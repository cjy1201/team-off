/* =========================================================
   서버 호출 / 이벤트
   ========================================================= */
let $toast = null, toastTimer = null;
function toast(msg, err) {
  if ($toast) $toast.remove();
  $toast = document.createElement('div');
  $toast.className = 'toast' + (err ? ' err' : '');
  $toast.textContent = msg;
  document.body.appendChild($toast);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { if ($toast) { $toast.remove(); $toast = null; } }, 3200);
}

let $loading = null;
function loading(on) {
  if (on && !$loading) { $loading = document.createElement('div'); $loading.className = 'loading'; $loading.innerHTML = '<div class="spinner"></div>'; document.body.appendChild($loading); }
  if (!on && $loading) { $loading.remove(); $loading = null; }
}

function handleError(e) {
  const msg = (e && e.message) || String(e);
  if (msg.indexOf('SAVED:') === 0) { // 저장은 됐는데 결과가 커서 못 받은 경우 → 다시 불러오기
    closeModal(); toast(msg.slice(6));
    W.loaded = false;
    call('getBootstrap', getToken()).then((b) => { if (b.state) { S = b.state; render(); } }).catch(() => {});
    return;
  }
  if (msg.indexOf('AUTH:') >= 0) { // 토큰 만료·비밀번호 변경됨 → 로그인 화면
    setToken(''); syncUrlToken(''); S = null; screen = 'login'; closeModal(); render();
    return toast(msg.slice(msg.indexOf('AUTH:') + 5), true);
  }
  toast(msg, true);
}

/** 서버 응답 { state, token?, ... } 을 반영 */
async function run(promise, okMsg, after) {
  loading(true);
  try {
    const res = await promise;
    if (res.token) { setToken(res.token); if (urlToken) syncUrlToken(res.token); } // 비밀번호 변경 시 주소의 로그인 정보도 교체
    if (res.state) { S = res.state; screen = 'app'; stateSeq++; lastRefresh = Date.now(); }
    closeModal();
    render();
    if (okMsg) toast(okMsg);
    if (after) after(res);
  } catch (e) {
    handleError(e);
  } finally {
    loading(false);
  }
}

async function boot() {
  if (MOVED) return render(); // 예전 주소: 서버를 부르지 않고 안내만
  W.loaded = false; W.tasks = []; W.error = '';
  screen = 'loading'; render();
  const fromUrl = await readUrlToken();
  if (fromUrl) { urlToken = true; if (!getToken()) setToken(fromUrl); }
  call('getBootstrap', getToken()).then((res) => {
    if (res.needsSetup) screen = 'setup';
    else if (res.needLogin) {
      // 저장된 로그인 정보가 만료됐으면 주소에 붙은 것으로 한 번 더 시도
      if (fromUrl && getToken() !== fromUrl) { setToken(fromUrl); return boot(); }
      setToken(''); if (urlToken) syncUrlToken(''); screen = 'login';
    }
    else { S = res.state; screen = 'app'; stateSeq++; lastRefresh = Date.now(); }
    render();
  }).catch((e) => { screen = 'error'; screenMsg = (e && e.message) || String(e); render(); });
}

document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  if ($loading) return; // 처리 중 중복 제출 방지
  const v = (n) => (form.querySelector(`[name=${n}]`) || {}).value || '';
  switch (form.dataset.form) {
    case 'login': {
      const remember = !!(form.querySelector('[name=remember]') || {}).checked;
      rememberMode = remember;
      run(call('login', v('email'), v('password'), remember), '', () => syncUrlToken(remember ? getToken() : ''));
      break;
    }
    case 'setup': run(call('setupAdmin', { email: v('email'), name: v('name'), password: v('password') }), '관리자 계정을 만들었습니다.'); break;
    case 'password':
      if (v('next') !== v('next2')) return toast('새 비밀번호 확인이 일치하지 않습니다.', true);
      run(api('changePassword', v('current'), v('next'), rememberMode || urlToken), '비밀번호를 변경했습니다.');
      break;
  }
});

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName === 'SELECT' || t.tagName === 'INPUT') return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case 'tab':
      if (v === 'all-warn') { ui.tab = 'all'; ui.allFilter = { member: '', month: '', warnOnly: true }; }
      else ui.tab = v;
      if (v === 'history') { HX.loaded = false; HX.error = ''; HX.limit = 200; } // 탭을 열 때마다 최신 이력
      render(); window.scrollTo(0, 0); break;
    case 'month': {
      const t0 = new Date();
      ui.month = v === '0' ? new Date(t0.getFullYear(), t0.getMonth(), 1) : new Date(ui.month.getFullYear(), ui.month.getMonth() + Number(v), 1);
      render(); break;
    }
    case 'day': openDay(v); break;
    case 'newLeave': openLeaveForm(null); break;
    case 'editLeave': openLeaveForm(v); break;
    case 'delLeave': removeLeave(v); break;
    case 'newUser': openUserForm(); break;
    case 'bulkUsers': openBulkForm(); break;
    case 'editUser': openUserForm(v); break;
    case 'delUser': removeUser(v); break;
    case 'resetPw': resetPw(v); break;
    case 'newHoliday': openHolidayForm(); break;
    case 'newEvent': openEventForm(null, v); break;
    case 'wpart': ui.workPart = v; render(); break;
    case 'wmonth': {
      const t0 = new Date();
      ui.workMonth = v === '0' ? new Date(t0.getFullYear(), t0.getMonth(), 1) : new Date(ui.workMonth.getFullYear(), ui.workMonth.getMonth() + Number(v), 1);
      render(); break;
    }
    case 'wday': openWorkDay(v); break;
    case 'wview': ui.workView = v; render(); break;
    case 'wsum': openWorkGroup(v); break;
    case 'weekAbsent': openWeekAbsent(v); break;
    case 'news': openNews(); break;
    case 'newsGo': goNews(v); break;
    case 'reloadHistory': HX.loaded = false; HX.error = ''; render(); break;
    case 'moreHistory': HX.limit += 200; render(); break;
    case 'newTask': openTaskForm(null, v); break;
    case 'editTask': openTaskForm(v); break;
    case 'delTask': removeTask(v); break;
    case 'reloadTasks': W.error = ''; loadTasks(true); render(); break;
    case 'editEvent': openEventForm(v); break;
    case 'delEvent': removeEvent(v); break;
    case 'delHoliday': confirmBox('공휴일 삭제', `<p>${fmtShort(v)} ${esc(D.holidays[v] || '')}을(를) 삭제할까요?</p>`, '삭제', true).then((ok) => ok && run(api('deleteHoliday', v), '삭제했습니다.')); break;
    case 'holYear': ui.holYear += Number(v); render(); break;
    case 'clearMonth': ui.allFilter.month = ''; render(); break;
    case 'account': openAccount(); break;
    case 'refresh': refreshData(true); break;
    case 'copyAttendance': copyText(attendanceText(v)); break;
    case 'logout': setToken(''); syncUrlToken(''); S = null; W.loaded = false; W.tasks = []; closeModal(); screen = 'login'; ui.tab = 'cal'; render(); break;
    case 'reload': boot(); break;
    case 'reset': Mock._reset(); setToken(Mock._tokenFor('lead@example.com')); boot(); break;
  }
});

document.addEventListener('change', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  switch (t.dataset.act) {
    case 'mineOnly': ui.mineOnly = t.checked; render(); break;
    case 'part': ui.part = t.value; ui.allFilter.member = ''; render(); break;
    case 'wmine': ui.workMine = t.checked; render(); break;
    case 'tstatus': { // 목록에서 바로 상태 변경
      const task = W.tasks.find((x) => x.id === t.dataset.v);
      if (task) runTasks(api('saveTask', Object.assign({}, task, { status: t.value })), `상태를 '${t.value}'(으)로 바꿨습니다.`);
      break;
    }
    case 'filter': ui.allFilter[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.value; render(); break;
    case 'hfilter': HX[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.value; HX.limit = 200; render(); break;
    case 'switch':
      if (t.value === '__setup') { Mock._empty(); setToken(''); }
      else if (t.value === '__logout') { if (!Mock._db().users.length) Mock._reset(); setToken(''); }
      else setToken(Mock._tokenFor(t.value));
      ui.tab = 'cal'; boot(); break;
  }
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') dismissModal(); });

let lastMobile = window.matchMedia('(max-width: 640px)').matches;
window.addEventListener('resize', () => {
  const m = window.matchMedia('(max-width: 640px)').matches;
  if (m !== lastMobile) { lastMobile = m; if (screen === 'app' && ui.tab === 'cal') render(); }
});

/* =========================================================
   자동 새로고침 — 다른 사람이 바꾼 내용이 새로고침 없이 보이도록
   - 앱으로 돌아올 때(탭·앱 전환) 마지막 갱신 후 5분이 지났으면, 화면에 떠 있는 동안 10분마다, ↻ 버튼(즉시)
   - 실제로 바뀐 게 있을 때만 다시 그리고 스크롤 위치 유지. 열려 있는 등록 창은 그대로 둔다
   - 새로고침 도중 내가 저장하면(stateSeq 변경) 그 새로고침 결과는 버린다 (옛 데이터로 덮어쓰지 않게)
   ========================================================= */
let stateSeq = 0;
let lastRefresh = 0;
let refreshing = false;
const REFRESH_EVERY = 10 * 60000; // 화면에 떠 있는 동안 10분마다
const REFRESH_ON_RETURN = 5 * 60000; // 앱으로 돌아왔을 때 마지막 갱신 후 5분이 지났으면 새로고침

async function refreshData(manual) {
  if (refreshing || screen !== 'app' || !S || MOVED) return;
  refreshing = true;
  const seq = stateSeq;
  const btn = document.querySelector('[data-act="refresh"]');
  if (manual && btn) btn.classList.add('spin');
  let changed = false;
  try {
    const b = await call('getBootstrap', getToken());
    if (b.needLogin) { setToken(''); S = null; screen = 'login'; render(); return; }
    if (b.state && seq === stateSeq && JSON.stringify(b.state) !== JSON.stringify(S)) { S = b.state; changed = true; }
    if (W.loaded && seq === stateSeq) {
      const t = await api('getTasks');
      if (seq === stateSeq && JSON.stringify(t.tasks) !== JSON.stringify(W.tasks)) { W.tasks = t.tasks || []; changed = true; }
    }
    lastRefresh = Date.now();
    if (changed) {
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
    }
    if (manual) toast(changed ? '최신 내용으로 업데이트했습니다.' : '이미 최신 내용입니다.');
  } catch (e) {
    if (manual) handleError(e);
  } finally {
    refreshing = false;
    const b2 = document.querySelector('[data-act="refresh"]');
    if (b2) b2.classList.remove('spin');
  }
}

if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastRefresh > REFRESH_ON_RETURN) refreshData(false);
  });
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('focus', () => { if (Date.now() - lastRefresh > REFRESH_ON_RETURN) refreshData(false); });
}
setInterval(() => {
  if (typeof document === 'undefined' || document.visibilityState !== 'hidden') refreshData(false);
}, REFRESH_EVERY);

if (MODE === 'mock' && !getToken() && Mock._db().users.length) setToken(Mock._tokenFor('lead@example.com'));
boot();
</script>
</body>
</html>
