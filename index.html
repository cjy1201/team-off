<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>슈퍼SOL 전담반 일정</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="전담반 일정">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f5eff">
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e3e6eb;
    --text: #1d2330; --muted: #6b7280; --primary: #1f5eff; --primary-weak: #e8efff;
    --danger: #d92d20; --danger-weak: #fdecea; --warn: #b54708; --warn-weak: #fff4e5;
    --sun: #d92d20; --sat: #2563eb; --today: #1f5eff;
    --t-annual: #2563eb; --t-am: #0d9488; --t-pm: #7c3aed; --t-sick: #ea580c; --t-edu: #db2777; --t-etc: #64748b; --t-qpm: #5b7f1a; --evt: #b45309; --evt-bg: #fff7ed;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --radius: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --border: #2a2f3a;
      --text: #e7e9ee; --muted: #9aa3b2; --primary: #6b93ff; --primary-weak: #1c2742;
      --danger: #ff6b5e; --danger-weak: #3a1b19; --warn: #f5a524; --warn-weak: #33260f;
      --sun: #ff6b5e; --sat: #6b93ff; --today: #6b93ff;
      --t-annual: #5b8cff; --t-am: #2dd4bf; --t-pm: #a78bfa; --t-sick: #fb923c; --t-edu: #f472b6; --t-etc: #94a3b8; --t-qpm: #6f9a2a; --evt: #fbbf24; --evt-bg: #2a2110;
      --shadow: none;
      color-scheme: dark; /* 입력칸·달력 선택창 같은 브라우저 기본 부품도 어둡게 */
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --border: #2a2f3a;
    --text: #e7e9ee; --muted: #9aa3b2; --primary: #6b93ff; --primary-weak: #1c2742;
    --danger: #ff6b5e; --danger-weak: #3a1b19; --warn: #f5a524; --warn-weak: #33260f;
    --sun: #ff6b5e; --sat: #6b93ff; --today: #6b93ff;
    --t-annual: #5b8cff; --t-am: #2dd4bf; --t-pm: #a78bfa; --t-sick: #fb923c; --t-edu: #f472b6; --t-etc: #94a3b8; --t-qpm: #6f9a2a; --evt: #fbbf24; --evt-bg: #2a2110;
    --shadow: none;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  /* 모바일에서 화면 전체가 옆으로 밀리지 않게 (가로로 긴 표·타임라인은 각자 안에서 스크롤) */
  html, body { overflow-x: clip; overscroll-behavior-x: none; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 14px; line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .kbd-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  .kbd-table { width: 100%; } .kbd-table td { white-space: normal; } .kbd-table td:first-child { white-space: nowrap; }
  kbd { display: inline-block; padding: 1px 6px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.5; color: var(--text); }
  .nav-order .no-row { display: flex; align-items: center; gap: 6px; padding: 8px 4px; border-bottom: 1px solid var(--border); }
  .nav-order .no-row.no-cut { border-top: 2px dashed var(--border); }
  .nav-order .no-n { width: 20px; color: var(--muted); font-size: 12px; text-align: right; }
  .nav-order .no-t { flex: 1; font-weight: 600; }
  .ds-toggle { font-size: 13px; margin-right: 4px; white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover, th.sortable.on { color: var(--primary); }
  .plink { color: var(--primary); cursor: pointer; font-weight: 600; }
  .label-row { display: flex !important; align-items: center; justify-content: space-between; gap: 4px; height: 17px; } /* 라벨 줄에 버튼이 있어도 높이는 다른 라벨과 같게 */
  .quick-dates { display: inline-flex; gap: 2px; flex: none; }
  .quick-dates .btn { padding: 2px 8px; font-size: 12px; }
  .ptr { position: fixed; left: 0; right: 0; top: 0; z-index: 60; text-align: center; font-size: 13px; color: var(--muted); padding: 10px; opacity: 0; transform: translateY(-40px); pointer-events: none; transition: opacity .15s; }
  .people-search { padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); width: 130px; }
  .bnav { display: none; }
  @media (max-width: 640px) {
    body.navb nav.tabs { display: none; }
    body.navb main { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    body.navb .toast { bottom: calc(76px + env(safe-area-inset-bottom)); }
    .bnav { display: grid; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--border);
      padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
    .bnav button { border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 4px; font-size: 11px; font-weight: 600; }
    .bnav button svg { display: block; flex: none; width: 23px; height: 23px; } /* iOS: 버튼 속 svg는 block이어야 보임 */
    .bnav button.on { color: var(--primary); }
  }
  .a2hs { display: flex; align-items: center; gap: 8px; background: var(--primary-weak); color: var(--text); border-radius: 10px; padding: 8px 8px 8px 14px; margin-bottom: 12px; font-size: 13px; font-weight: 600; }
  .a2hs span { flex: 1; min-width: 0; }
  .a2hs-steps { margin: 0; padding-left: 20px; line-height: 1.7; }
  .a2hs-steps li { margin: 6px 0; }
  .inline-ic { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; color: var(--primary); }
  .cal-add { padding: 4px 6px; color: var(--muted); }
  .cal-add svg { display: block; width: 18px; height: 18px; } /* iOS: 버튼 속 svg는 block */
  .more-list { display: flex; flex-direction: column; }
  .more-list button { display: flex; justify-content: space-between; align-items: center; border: 0; border-bottom: 1px solid var(--border); background: none; padding: 14px 4px; font-size: 15px; font-weight: 600; text-align: left; }
  .more-list button:last-child { border-bottom: 0; }
  .more-list button.on { color: var(--primary); }
  .more-list button span { color: var(--muted); }
  .num-input { padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); width: 64px; text-align: right; }
  .grant-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .grant-row select, .grant-row input:not(.num-input) { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }
  .grant-row input[data-f="note"] { flex: 1; min-width: 140px; }
  button { cursor: pointer; }

  .preview-bar { background: #111827; color: #f9fafb; font-size: 12px; padding: 8px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .preview-bar select { background: #374151; color: #fff; border: 0; border-radius: 6px; padding: 3px 6px; }
  .preview-bar button { background: transparent; color: #cbd5e1; border: 1px solid #4b5563; border-radius: 6px; padding: 2px 8px; }

  header.top { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .top-inner { max-width: 1200px; margin: 0 auto; padding: 12px 16px 0; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .t-short { display: none; }
  .whoami { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .badge.admin { background: var(--primary-weak); color: var(--primary); }
  nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { border: 0; background: none; padding: 10px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  nav.tabs button.on { color: var(--primary); border-bottom-color: var(--primary); }

  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .section-title { font-size: 15px; font-weight: 700; margin: 20px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  .btn { white-space: nowrap; border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 12px; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn[disabled] { opacity: .5; cursor: default; }

  /* summary */
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stat { padding: 12px 14px; min-width: 0; }
  .stat .label { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .stat .sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.warn .value { color: var(--danger); }

  /* calendar */
  .cal-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 10px; flex-wrap: wrap; }
  .month-nav { display: flex; align-items: center; gap: 4px; }
  .month-nav h2 { font-size: 18px; margin: 0 6px; min-width: 112px; text-align: center; }
  .icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
  .cal-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); user-select: none; }
  .cal { overflow: hidden; }
  .cal { position: relative; }
  .month-pill { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); background: rgba(17, 24, 39, .78); color: #fff; font-weight: 700; font-size: 15px;
    padding: 8px 16px; border-radius: 999px; pointer-events: none; animation: pillfade 1s ease-out forwards; }
  @keyframes pillfade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
  .cal-grid { touch-action: pan-y; } /* 가로 밀기는 앱이 처리 (달 넘기기), 세로는 그대로 스크롤 */
  .cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-head div { padding: 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; border-bottom: 1px solid var(--border); }
  .cal-head div:first-child { color: var(--sun); }
  .cal-head div:last-child { color: var(--sat); }
  .day { min-height: 130px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 4px; cursor: pointer; position: relative; min-width: 0; }
  .day:nth-child(7n) { border-right: 0; }
  .day:hover { background: var(--surface-2); }
  .day.out { background: var(--bg); }
  .day.out .dnum { opacity: .45; }
  .day .dtop { display: flex; align-items: center; gap: 4px; min-width: 0; margin-bottom: 2px; }
  .dnum { font-size: 12px; font-weight: 600; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; flex: none; }
  .day.sun .dnum, .day.hol .dnum { color: var(--sun); }
  .day.sat .dnum { color: var(--sat); }
  .day.today .dnum { background: var(--today); color: #fff; }
  .day.today { box-shadow: inset 0 0 0 2px var(--today); }
  .day.flash { animation: dayflash 2s ease-out; }
  @keyframes dayflash { 0%, 30% { background: var(--primary-weak); } 100% { background: transparent; } } /* 오늘 칸 테두리 (안쪽 그림자라 칸 크기는 그대로) */
  .hname { font-size: 10.5px; color: var(--sun); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: flex; align-items: center; gap: 3px; font-size: 11.5px; padding: 1px 5px; border-radius: 4px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  .chip .nm { overflow: hidden; text-overflow: ellipsis; }
  .chip.conflict { outline: 2px solid var(--danger); outline-offset: -1px; }
  .chip.mine { box-shadow: inset 0 0 0 1.5px #fff; font-weight: 800; } /* 내 일정: 칩 안쪽 흰 테두리 + 굵게 */
  .chip .w { flex: none; }
  .more { font-size: 11px; color: var(--muted); margin-top: 2px; padding-left: 4px; }
  .t-연차 { background: var(--t-annual); } .t-오전반차 { background: var(--t-am); } .t-오후반차 { background: var(--t-pm); }
  .t-반반차 { background: var(--t-qpm); } .t-병가 { background: var(--t-sick); } .t-연수\/교육 { background: var(--t-edu); } .t-기타 { background: var(--t-etc); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }

  /* list items */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .item .bar { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
  .item .body { flex: 1; min-width: 0; }
  .item .title { font-weight: 700; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .item .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .item .actions { display: flex; gap: 6px; flex: none; }
  .item.past { opacity: .6; }
  /* 좁은 목록(날짜 상세 창 · 휴대폰)에서는 버튼을 글 아래 줄로 — 글이 버튼에 밀려 한두 글자씩 줄바꿈되지 않게 */
  .list { container-type: inline-size; }
  @container (max-width: 560px) {
    .item.barred:has(> .actions) { display: grid; grid-template-columns: 4px minmax(0, 1fr); column-gap: 12px; row-gap: 8px; }
    .item.barred .bar { grid-row: 1 / span 2; }
    .item.barred .actions { grid-column: 2; justify-content: flex-end; flex-wrap: wrap; width: auto; }
  }
  .warnbox { background: var(--danger-weak); color: var(--danger); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-top: 8px; }
  .warnbox div + div { margin-top: 2px; }
  .infobox { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filters select, .filters input[type=month] { padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }

  /* modal */
  .overlay, .modal { overscroll-behavior: contain; }
  .overlay { position: fixed; inset: 0; background: rgba(15,17,21,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 480px; max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 40px rgba(0,0,0,.2); }
  .modal.wide { max-width: 640px; }
  /* 요청함 */
  .tab-n { display: inline-block; min-width: 16px; height: 16px; padding: 0 4px; margin-left: 4px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 11px; line-height: 16px; text-align: center; font-weight: 700; vertical-align: 1px; }
  .bnav button { position: relative; } .bnav .tab-n { position: absolute; top: 2px; left: calc(50% + 6px); margin: 0; }
  .req-item { cursor: pointer; } .req-desc { margin-top: 4px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .seg.wrap { flex-wrap: wrap; }
  .slot-day { margin-top: 8px; } .slot-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .slot { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font: inherit; font-size: 13px; color: var(--text); cursor: pointer; }
  .slot span { font-size: 11px; color: var(--muted); } .slot.on { border-color: var(--primary); background: var(--primary-weak, var(--surface-2)); color: var(--primary); font-weight: 600; }
  .slot:disabled { opacity: .45; cursor: default; } .slot button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 0 0 2px; font: inherit; }
  .q-edit { padding: 12px; margin-top: 8px; } td.wrap-cell { white-space: normal; min-width: 80px; max-width: 260px; }
  .modal header { padding: 16px 18px 8px; display: flex; justify-content: space-between; align-items: center; }
  .modal header h3 { margin: 0; font-size: 16px; }
  .modal .content { padding: 4px 18px 16px; }
  .modal footer { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--border); }
  .modal footer .spacer { flex: 1; }
  .modal > footer { position: sticky; bottom: 0; background: var(--surface); z-index: 2; } /* 긴 메모를 써도 저장 버튼이 늘 보이게 */
  .field textarea[data-grow] { min-height: 88px; max-height: 60vh; resize: vertical; line-height: 1.55; }
  .memo-count { text-align: right; margin-top: 3px; }
  .memo-clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .memo-more { background: none; border: 0; padding: 2px 0; color: var(--primary); font-size: 12px; cursor: pointer; }
  .field { margin-top: 12px; }
  .field > label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  .req { color: var(--danger); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field > label.toggle { display: inline-flex; margin-bottom: 0; } .field input[type=checkbox] { width: auto; padding: 0; } /* 칸 안 체크박스 줄이 깨지지 않게 */
  .row2 > * { min-width: 0; } /* 칸 안의 입력창이 옆 칸으로 넘치지 않게 */
  /* iOS 사파리 날짜 칸: 기본 모양(가운데 정렬 · 고유 최소 폭 · 다른 높이 · 파란 글씨)을 다른 입력칸과 맞춤 */

<div id="app"></div>

<script>
/* =========================================================
   공통 상수 / 유틸
   ========================================================= */
const TYPES = ['연차', '오전반차', '오후반차', '반반차', '병가', '연수/교육', '기타'];
const HALF = { '오전반차': 0.5, '오후반차': 0.5, '반반차': 0.25 }; // 하루짜리 + 사용일수 (반반차는 오후에만, 0.25일)
const SHORT = { // 달력 칸에 표시하는 짧은 이름
  '연차': '연차', '오전반차': '오전', '오후반차': '오후', '반반차': '반반', '병가': '병가', '연수/교육': '교육', '기타': '기타' };
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const PARTS = ['기획', 'QA', '개발', '퍼블', 'NP', '디자인'];
/** 테스터 계정 (이름에 '테스터') — 총원 · 파트 인원 · 부재 비율에서 뺀다 (서버 isTester_와 같은 규칙) */
const MEMO_MAX = 2000; // 업무 · 중요 일정 메모 글자 수 (서버 Code.gs와 같게)
const CROWD_PERCENT = 20; // 서버와 같게: 총원(테스터 제외) 중 이 비율 이상이 같은 날 부재하면 안내 (사유 필수는 아님)
const isTester = (u) => String((u && u.name) || '').includes('테스터');
const TASK_PARTS = ['전체', ...PARTS, 'PM']; // 업무 일정의 파트 ('전체' · 'PM' 업무는 PM만 등록. '전체'는 모든 파트 공통 업무)
const MAX_SUBS = 3;
const ROLE_TEXT = { pm: 'PM', pl: 'PL', member: '파트원' };
/** 'PM' / 'PL' / '파트원'(또는 빈칸) → pm / pl / member */
const roleOfText = (v) => { const t = String(v || '').trim().toLowerCase(); return t === 'pm' || t === '관리자' ? 'pm' : t === 'pl' || t === '리더' ? 'pl' : 'member'; };

const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const todayStr = () => ymd(new Date());
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtShort = (s) => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}(${WEEK[d.getDay()]})`; };
const fmtRange = (l) => l.startDate === l.endDate ? fmtShort(l.startDate) : `${fmtShort(l.startDate)} ~ ${fmtShort(l.endDate)}`;
const slots = (type) => type === '오전반차' ? 1 : type === '오후반차' || type === '반반차' ? 2 : 3;
const overlaps = (a, b) => a.startDate <= b.endDate && b.startDate <= a.endDate && (slots(a.type) & slots(b.type)) !== 0;

function eachDate(start, end, fn) {
  for (let d = parse(start); ymd(d) <= end; d = addDays(d, 1)) fn(ymd(d), d);
}

/* =========================================================
   로그인 토큰 — '로그인 유지'면 localStorage(180일), 아니면 창을 닫으면 지워지는 sessionStorage
   ========================================================= */
const TOKEN_KEY = 'team-off-token';
let memToken = '';
let rememberMode = true;
const getToken = () => {
  try { return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || memToken; } catch (e) { return memToken; }
};
const setToken = (t) => {
  memToken = t || '';
  try {
    localStorage.removeItem(TOKEN_KEY);
    sessionStorage.removeItem(TOKEN_KEY);
    if (t) (rememberMode ? localStorage : sessionStorage).setItem(TOKEN_KEY, t);
  } catch (e) {}
};
try { rememberMode = !sessionStorage.getItem(TOKEN_KEY); } catch (e) {} // 지난번에 '로그인 유지'를 껐으면 그대로

/*
 * '이 기기에서 로그인 유지': 아이폰 사파리 등은 Apps Script 화면의 저장 공간을 앱을 닫으면 지운다.
 * 그래서 로그인 정보를 주소(?t=)에도 붙여서, 그 주소로 홈 화면에 추가하면 계속 로그인된 상태로 열리게 한다.
 */

/*
 * GitHub Pages에서의 서버 호출
 * 1순위: 통신용 페이지(Apps Script ?bridge=1)를 보이지 않는 iframe으로 띄우고 postMessage로 요청 → google.script.run
 * 2순위: 통신용 페이지가 안 뜨는 환경이면 doPost(fetch). 이 방식은 구글 응답 전달(echo)이 자주 404로 실패해서 보조로만 쓴다
 */
const bridge = { win: null, origin: '', ready: null, broken: false, seq: 0, pending: {} };

function initBridge() {
  if (bridge.ready) return bridge.ready;
  bridge.ready = new Promise((resolve, reject) => {
    const fail = () => { bridge.broken = true; reject(new Error('bridge timeout')); };
    const timer = setTimeout(fail, 15000);
    window.addEventListener('message', (ev) => {
      const d = ev.data;
      let host = '';
      try { host = new URL(ev.origin).hostname; } catch (e) { return; }
      if (!d || typeof d !== 'object' || !/\.googleusercontent\.com$/.test(host)) return;
      if (d.type === 'teamoff-ready') {
        bridge.win = ev.source; bridge.origin = ev.origin;
        clearTimeout(timer); resolve();
      } else if (d.type === 'teamoff-broken') {
        clearTimeout(timer); fail(); // 통신용 페이지는 떴지만 구글 서버와 통신이 안 됨 (회사망 등)
      } else if (d.type === 'teamoff-reply' && bridge.pending[d.id]) {
        const p = bridge.pending[d.id];
        delete bridge.pending[d.id];
        clearTimeout(p.timer);
        d.ok ? p.resolve(d.data) : p.reject(new Error(d.error));
      }
    });
    const f = document.createElement('iframe');
    f.src = API_URL + '?bridge=1';
    f.title = '서버 연결';
    f.setAttribute('aria-hidden', 'true');
    f.tabIndex = -1;
    f.style.cssText = 'position:absolute;left:-9999px;top:0;width:1px;height:1px;border:0;visibility:hidden';
    document.body.appendChild(f);
  });
  return bridge.ready;
}

function callBridge(fn, args) {
  return initBridge().then(() => new Promise((resolve, reject) => {
    const id = ++bridge.seq;
    const timer = setTimeout(() => {
      delete bridge.pending[id];
      reject(new Error('서버 응답이 없습니다. 잠시 후 다시 시도하세요.'));
    }, 60000);
    bridge.pending[id] = { resolve, reject, timer };
    bridge.win.postMessage({ type: 'teamoff-call', id, fn, args }, bridge.origin);
  }));
}

// 조회만 하는 요청 — 응답을 못 받으면 자동으로 다시 보내도 안전하다
const READ_ONLY = { getBootstrap: true, checkLeave: true, getTasks: true, checkTaskAbsence: true, checkMeal: true };

/*
 * 회사망(모개망)은 외부 사이트로 가는 POST 요청을 보안 장비가 가로채서 안내 문구로 바꿔치기한다.
 * /api 전달을 쓸 때 POST 응답이 JSON이 아니면 GET(/api?q=요청내용)으로 다시 보내고, 이 기기는 이후 계속 GET을 쓴다.
 * (가로채진 POST는 서버에 도달하지 않았으므로 다시 보내도 중복 처리되지 않는다)
 */
const GET_KEY = 'team-off-use-get';
let useGet = false;
try { useGet = localStorage.getItem(GET_KEY) === '1'; } catch (e) {}

function newRid() {
  const a = new Uint8Array(12);
  (window.crypto || crypto).getRandomValues(a);
  return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
}

/** 문자열(한글 포함) → URL에 넣을 수 있는 base64url */
function toB64Url(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach((b) => (bin += String.fromCharCode(b)));
  return btoa(bin).split('+').join('-').split('/').join('_').replace(/=+$/, ''); // 정규식에 슬래시 두 개가 연달아 들어가면 Apps Script가 주석으로 잘라낸다
}

function fetchOnce(fn, args) {
  const lost = () => { const e = new Error('lost'); e.lost = true; throw e; };
  // 저장 요청에는 한 번만 처리되도록 요청 ID(rid)를 붙인다 (전달 서버가 응답을 잃어버려 다시 보내도 중복 저장 안 됨)
  const payload = JSON.stringify(READ_ONLY[fn] ? { fn, args } : { fn, args, rid: newRid() });
  const viaGet = USE_PROXY && useGet;
  // POST는 text/plain 으로 보내야 브라우저가 사전 확인(CORS preflight) 없이 바로 보낸다
  const req = viaGet
    ? fetch(PROXY_URL + '?q=' + toB64Url(payload), { cache: 'no-store' })
    : fetch(USE_PROXY ? PROXY_URL : API_URL, { method: 'POST', body: payload });
  return req
    .then((r) => r.text().then((text) => ({ r, text })), lost)
    .then(({ r, text }) => {
      let res = null;
      try { res = JSON.parse(text); } catch (e) {}
      if (!res || typeof res !== 'object') {
        if (!r.ok && !USE_PROXY) lost();
        // 우리 서버 응답이 아님 → 중간에서 가로챔
        if (USE_PROXY && !viaGet) {
          useGet = true;
          try { localStorage.setItem(GET_KEY, '1'); } catch (e) {}
          return fetchOnce(fn, args);
        }
        const snippet = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 150);
        throw new Error(`네트워크에서 요청이 차단되었습니다 (HTTP ${r.status}). 받은 내용: ${snippet || '(없음)'}`);
      }
      if (r.status === 502 || (!r.ok && !USE_PROXY)) lost();
      if (!res.ok) throw new Error(res.error);
      return res.data;
    });
}

/** fetch 방식: 구글 응답 전달(echo)이 가끔 응답을 잃어버려서 조회는 최대 3번 시도 */
function callFetch(fn, args, attempt = 1) {
  return fetchOnce(fn, args).catch((e) => {
    if (!e.lost) throw e;
    if (READ_ONLY[fn] && attempt < 3) return new Promise((r) => setTimeout(r, 700 * attempt)).then(() => callFetch(fn, args, attempt + 1));
    if (READ_ONLY[fn]) throw new Error('서버에 연결할 수 없습니다. 잠시 후 다시 시도하세요.');
    // 저장 요청은 서버에서 이미 처리됐을 수 있어 다시 보내지 않고, 화면만 새로 불러온다
    setTimeout(() => { if (screen === 'app') call('getBootstrap', getToken()).then((b) => { if (b.state) { S = b.state; render(); } }).catch(() => {}); }, 300);
    throw new Error('서버 응답을 받지 못했습니다. 반영됐을 수 있으니 목록을 확인한 뒤 필요하면 다시 시도하세요.');
  });
}

function callApi(fn, args) {
  if (USE_PROXY || bridge.broken) return callFetch(fn, args);
  return callBridge(fn, args).catch((e) => {
    if (e.message === 'bridge timeout') return callFetch(fn, args); // 통신용 페이지가 안 뜨면 fetch로

  });
}

/**
 * 휴가 현황 — 참고용. PM이 연도별로 일반휴가·특별휴가·대체휴가 부여 일수를 따로 입력하고,
 * 사용(연차·반차, 예정 포함)은 합계에서 함께 뺀다. granted: 세 종류 합계 (입력 없으면 null)
 */
const ANNUAL_KINDS = ['일반휴가', '특별휴가', '대체휴가'];
const GRANT_KINDS = ['특별휴가', '대체휴가']; // 생길 때마다 한 줄씩 쌓는 부여 내역
function annualOf(email, map, year) {
  const used = S.leaves.filter((l) => l.email === email && l.startDate.startsWith(year) && (l.type === '연차' || HALF[l.type])).reduce((s, l) => s + workdays(l), 0);
  const v = map ? map[year] : null;
  const src = typeof v === 'number' ? { 일반휴가: v } : v && typeof v === 'object' ? v : {};
  // 특별·대체휴가는 부여 내역의 합계 (내역이 없으면 서버가 준 합계 — '전체 일정 조회' 권한자는 합계만 받음)
  const list = Array.isArray(src.내역) ? src.내역 : [];
  const kinds = { 내역: list };
  if (typeof src.일반휴가 === 'number') kinds.일반휴가 = src.일반휴가;
  GRANT_KINDS.forEach((k) => {
    const mine = list.filter((g) => g.kind === k);
    if (mine.length) kinds[k] = mine.reduce((sum, g) => sum + g.days, 0);
    else if (!list.length && typeof src[k] === 'number') kinds[k] = src[k];
  });
  const has = ANNUAL_KINDS.some((k) => typeof kinds[k] === 'number');
  const granted = has ? ANNUAL_KINDS.reduce((s, k) => s + (kinds[k] || 0), 0) : null;

}
/**
 * 남은 휴가를 넘는 연차·반차인지 (부여 일수를 입력한 사람만, 경고용) — 넘으면 { year, left, need, after }
 * 수정이면 원래 일정의 일수는 돌려놓고 계산한다

/** 이 연차·반차를 등록하면 남은 휴가가 어떻게 되는지 (부여 일수 입력한 사람만, 아니면 null) */
function annualAfter(p, ex) {
  const counts = (l) => l && (l.type === '연차' || HALF[l.type]);

  const year = p.startDate.slice(0, 4);

  const back = ex && counts(ex) && ex.email === owner && ex.startDate.startsWith(year) ? workdays(ex) : 0;
  const need = workdays({ ...p, endDate: HALF[p.type] ? p.startDate : p.endDate || p.startDate });

  return { year, left, need, after: left - need };
}

/*

const IS_STANDALONE = typeof window !== 'undefined' && !!((window.navigator && window.navigator.standalone) || window.matchMedia('(display-mode: standalone)').matches);

/* 안드로이드 크롬 · 삼성 인터넷: 브라우저가 '앱 설치' 창을 열어준다 → [앱 설치] 버튼으로 바로 띄움 (아이폰은 불가 → 방법 안내) */

const NAV_BOTTOM = IS_STANDALONE || (typeof location !== 'undefined' && /[?&]bottomnav=1/.test(location.search || ''));
const BN_ICON = {

/** 보이는 탭 (권한별) — 내 메뉴 순서(S.me.navOrder)대로, 순서에 없는 탭은 기본 순서로 뒤에 */
function myTabs(defaultOrder) {
  const tabs = [['cal', '캘린더'], ['events', '중요 일정'], ['work', '업무 일정'], ['mine', '내 일정'], ['requests', '요청함']];

  const order = defaultOrder ? [] : S.me.navOrder || [];
  const rank = (k) => (order.indexOf(k) >= 0 ? order.indexOf(k) : 100);
  return tabs.map((t, i) => [t, i]).sort((a, b) => rank(a[0][0]) - rank(b[0][0]) || a[1] - b[1]).map(([t]) => t);

const NAV_MAIN = 4; // 하단 탭바에 바로 보이는 메뉴 수 (나머지는 '더보기')
function bottomNav(tabs) {
  const label = { cal: '캘린더', events: '중요', work: '업무', mine: '내 일정', requests: '요청함', more: '더보기', all: canSeeAll() ? '전체' : '파트', members: '팀원', early: '조기퇴근', holidays: '공휴일', history: '이력' };
  const main = (tabs.length <= NAV_MAIN + 1 ? tabs : tabs.slice(0, NAV_MAIN)).map(([k]) => k);
  const extra = tabs.filter(([k]) => !main.includes(k));
  const items = main.map((k) => [k, label[k], 'tab']);
  if (extra.length === 1) items.push([extra[0][0], label[extra[0][0]] || extra[0][1], 'tab']);
  else if (extra.length > 1) items.push(['more', label.more, 'navMore']);
  const on = (k) => (k === 'more' ? extra.some(([x]) => x === ui.tab) : ui.tab === k);
  return `<nav class="bnav" style="grid-template-columns: repeat(${items.length}, 1fr)">${items.map(([k, t, act]) => `<button class="${on(k) ? 'on' : ''}" data-act="${act}" data-v="${k}">

}

function viewCalendar() {
  const today = todayStr();
  const tDate = parse(today);
  const me = S.me.email;
  const year = today.slice(0, 4);
  let stats;

  if (canSeeTeam()) {
    const scope = !canSeeAll() ? '파트 ' : ui.part ? ui.part + ' ' : '';
    const todays = D.isOff(today, tDate) ? [] : leavesOn(today);
    const mon = addDays(tDate, -((tDate.getDay() + 6) % 7));
    const weekPeople = new Set();
    for (let i = 0; i < 5; i++) { const ds = ymd(addDays(mon, i)); if (!D.isOff(ds, parse(ds))) leavesOn(ds).forEach((l) => weekPeople.add(l.email)); }
    const warn = scoped().filter((l) => l.endDate >= today && conflictsOf(l).length);
    stats = [
      [`오늘 ${scope}부재`, `${todays.length}명`, todays.length ? todays.map((l) => `${esc(nameOf(l.email))} ${SHORT[l.type]}`).join(', ') : '전원 근무', 0, todays.length ? { act: 'day', v: today } : ''],
      [`이번 주 ${scope}부재`, `${weekPeople.size}명`, [...weekPeople].map((e) => esc(nameOf(e))).join(', ') || '-', 0, weekPeople.size ? { act: 'weekAbsent', v: ymd(mon) } : ''],
      [`${scope}대직 겹침 경고`, `${warn.length}건`, warn.length ? '확인 필요 ⚠' : '문제 없음', warn.length, warn.length ? 'all-warn' : ''],
    ];
  } else {
    const mine = S.leaves.filter((l) => l.email === me);
    const next = mine.filter((l) => l.endDate >= today).sort((a, b) => a.startDate.localeCompare(b.startDate))[0];
    const an = annualOf(me, S.me.annual, year);
    const warn = mine.filter((l) => l.endDate >= today && conflictsOf(l).length);
    stats = [
      ['다음 내 일정', next ? fmtShort(next.startDate) : '-', next ? next.type : '예정 없음'],
      an.granted === null ? [`${year}년 연차 사용`, `${an.used}일`, '반차 0.5일 · 주말·공휴일 제외', 0, 'mine']
        : [`${year}년 남은 휴가`, `${an.left}일`, `${an.granted}일 중 ${an.used}일 사용 · 참고용`, an.left < 0, 'mine'],
      ['대직자 겹침', `${warn.length}건`, warn.length ? '확인 필요 ⚠' : '문제 없음', warn.length, warn.length ? 'mine' : ''],
    ];
  }
  // 부여 일수가 입력된 사람: 팀 카드 옆에 '내 남은 휴가' (본인 일정만 보는 사람은 이미 카드에 있음)
  if (canSeeTeam()) {
    const an = annualOf(me, S.me.annual, year);
    if (an.granted !== null) stats.push(['내 남은 휴가', `${an.left}일`, `${an.granted}일 중 ${an.used}일 사용 · 참고용`, an.left < 0, 'mine']);
  }
  const statsHtml = `<div class="stats${stats.length > 3 ? ' four' : ''}">${stats.map(([label, value, sub, warn, go]) => `
    <div class="card stat ${warn ? 'warn' : ''}" ${go ? `data-act="${go.act || 'tab'}" data-v="${go.v || go}" style="cursor:pointer"` : ''}>
      <div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`).join('')}</div>`;

  // 달력
  const first = ui.month;
  const start = addDays(first, -first.getDay());
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const weeks = Math.ceil((first.getDay() + last.getDate()) / 7);
  const maxChips = 5;
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i);
    const ds = ymd(d);
    let items = leavesOn(ds);
    if (ui.mineOnly) items = items.filter((l) => l.email === me || l.substitutes.includes(me));
    const cls = ['day', d.getMonth() !== first.getMonth() && 'out', d.getDay() === 0 && 'sun', d.getDay() === 6 && 'sat', D.holidays[ds] && 'hol', ds === today && 'today'].filter(Boolean).join(' ');
    const evs = eventsOn(ds);
    const room = Math.max(maxChips - evs.length, 1);
    const shown = items.slice(0, items.length > room ? room - 1 : room);
    cells += `<div class="${cls}" data-act="day" data-v="${ds}">
      <div class="dtop"><span class="dnum">${d.getDate()}</span>${D.holidays[ds] ? `<span class="hname">${esc(D.holidays[ds])}</span>` : ''}</div>
      ${evs.map((e) => `<div class="chip evt" title="${esc(e.title)}${e.time ? ' ' + esc(e.time) : ''}"><span class="w">★</span><span class="nm">${esc(e.title)}</span></div>`).join('')}
      ${shown.map((l) => {
        const c = conflictOn(l, ds);
        const cover = l.email !== me && l.substitutes.includes(me);
        return `<div class="chip t-${l.type} ${c ? 'conflict' : ''} ${cover ? 'cover' : ''} ${l.email === me ? 'mine' : ''}" title="${esc(nameOf(l.email))} ${l.type}${cover ? ' (내가 대직)' : ''}${c ? ' — 대직 겹침' : ''}">${c ? '<span class="w">⚠</span>' : ''}${cover ? '<span class="w">↺</span>' : ''}<span class="nm">${esc(nameOf(l.email))}</span><span class="ty">${SHORT[l.type]}</span></div>`;
      }).join('')}
      ${items.length > shown.length ? `<div class="more">+${items.length - shown.length}</div>` : ''}
    </div>`;
  }

  // 다가오는 중요 일정: 한 줄씩 (누르면 그 날짜 상세 — 내용은 상세에서). 휴대폰은 2개, PC는 3개까지
  // 담당자: 3명까지 이름, 나머지는 '외 N명' (내 이름은 굵게)
  const whoLine = (list) => {
    if (!(list || []).length) return '';
    const shown = list.slice(0, 3).map((x) => (x === S.me.email ? `<b>${esc(nameOf(x))}</b>` : esc(nameOf(x)))).join(', ');
    return `<span class="who">담당 ${shown}${list.length > 3 ? ` 외 ${list.length - 3}명` : ''}</span>`;
  };
  const allUp = (S.events || []).filter((e) => e.endDate >= today).sort((a, b) => a.startDate.localeCompare(b.startDate));
  const upMax = window.matchMedia('(max-width: 640px)').matches ? 2 : 3;
  const upcomingHtml = allUp.length ? `
    <div class="card evt-compact">${allUp.slice(0, upMax).map((e) => `
      <div class="evt-row" data-act="day" data-v="${e.startDate < today ? today : e.startDate}" title="${esc(e.title)}${e.memo ? ' — ' + esc(e.memo) : ''}">
        <span class="when">★ ${esc(evtWhen(e))}</span><span class="what">${esc(e.title)}</span>${(e.assignees || []).includes(S.me.email) ? '<span class="badge admin" style="flex:none">내 담당</span>' : ''}${whoLine(e.assignees)}</div>`).join('')}
      ${allUp.length > upMax ? `<div class="evt-row more" data-act="tab" data-v="events">중요 일정 ${allUp.length - upMax}건 더 보기 ›</div>` : ''}
    </div>` : '';

  return a2hsBanner() + upcomingHtml + statsHtml + `
    <div class="cal-toolbar">
      <div class="month-nav">
        <button class="icon-btn" data-act="month" data-v="-1" aria-label="이전 달">‹</button>
        <h2>${first.getFullYear()}년 ${first.getMonth() + 1}월</h2>
        <button class="icon-btn" data-act="month" data-v="1" aria-label="다음 달">›</button>
        <button class="btn sm" data-act="month" data-v="0" style="margin-left:4px">오늘</button>
      </div>
      <div class="cal-actions">
        ${canSeeAll() ? partSelect() : ''}
        ${canSeeAll() ? `<button class="btn" data-act="copyAttendance" data-v="${today}">오늘 근태 복사</button>` : ''}
        ${isAdmin() ? '<button class="btn" data-act="newEvent">+ 중요 일정</button>' : ''}
        ${canSeeTeam() ? `<label class="toggle"><input type="checkbox" data-act="mineOnly" ${ui.mineOnly ? 'checked' : ''}> 나와 관련된 일정만</label>` : ''}
        <button class="btn primary" data-act="newLeave">+ 일정 등록</button>
      </div>
    </div>
    <div class="card cal">
      <div class="cal-head">${WEEK.map((w) => `<div>${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div class="legend">
      ${TYPES.map((t) => `<span><i class="dot t-${t}"></i>${t}</span>`).join('')}
      <span><span style="color:var(--evt)">★</span> 중요 일정</span>
      <span><span style="color:var(--danger)">⚠</span> 대직자와 일정 겹침</span>
      ${canSeeTeam() ? '<span>↺ 내가 대직하는 일정</span>' : ''}
      ${isAdmin() ? '' : canSeeAll() ? '<span>· 전체 직원 일정 (수정은 본인 일정만)</span>' : S.me.part ? `<span>· ${esc(S.me.part)} 파트 일정 + PM·PL 일정 (수정은 본인 일정만)</span>` : '<span>· 본인 일정 + PM·PL 일정</span>'}
    </div>
    ${isAdmin() ? '' : designatedBox()}`;
}

/** 나를 대직자로 지정한 사람 (이름만) — PM은 전체 일정을 보므로 표시 안 함 */
function designatedBox() {
  const names = S.designatedBy || [];
  return `<div class="infobox designated"><b>나를 대직자로 지정한 사람</b>
    ${names.length ? names.map((n) => `<span class="name-chip">${esc(n)}</span>`).join('') : '<span>없음</span>'}</div>`;
}

/** 아침 근태 보고용 문구 — 그날 부재자를 유형별로 묶는다 */
function attendanceText(ds) {
  const items = leavesOn(ds);
  const title = `[${fmtShort(ds)}${ui.part ? ' ' + ui.part : ''} 근태 현황]`;
  if (!items.length) return `${title}\n부재 없음 (전원 정상 근무)`;
  const who = (l) => nameOf(l.email) + (partOf(l.email) && !ui.part ? `(${partOf(l.email)})` : '');
  const lines = TYPES.map((t) => {
    const ls = items.filter((l) => l.type === t).sort((a, b) => nameOf(a.email).localeCompare(nameOf(b.email)));
    return ls.length ? `${t}: ${ls.map(who).join(', ')}` : '';
  }).filter(Boolean);
  return `${title}\n${lines.join('\n')}\n→ 부재 ${new Set(items.map((l) => l.email)).size}명`;
}

function partSelect() {
  return `<select class="part-select" data-act="part"><option value="">전체 파트</option>
    ${PARTS.map((p) => `<option ${ui.part === p ? 'selected' : ''}>${p}</option>`).join('')}</select>`;
}

/* ---------- 일정 카드 ---------- */
/** opts.day: 날짜 상세에서는 그날 겹침이 있을 때만 경고 */
function leaveItem(l, opts = {}) {
  const c = opts.day && !conflictOn(l, opts.day) ? [] : conflictsOf(l);
  const past = l.endDate < todayStr();
  return `<div class="card item barred ${past ? 'past' : ''}">
    <div class="bar t-${l.type}"></div>
    <div class="body">
      <div class="title">${opts.showName ? esc(nameOf(l.email)) + ' · ' : ''}${l.type} <span class="muted small" style="font-weight:500">${fmtRange(l)} · ${workdays(l)}일</span>
        ${c.length ? '<span class="badge" style="background:var(--danger-weak);color:var(--danger)">⚠ 대직 겹침</span>' : ''}</div>
      <div class="meta">대직자 ${l.substitutes.map((e) => esc(nameOf(e))).join(', ')}${l.memo ? ' · ' + esc(l.memo) : ''}</div>
      ${c.length ? `<div class="warnbox">${c.map((x) => `<div>⚠ ${esc(x)}</div>`).join('')}</div>` : ''}
    </div>
    ${canEdit(l) || !past ? `<div class="actions">
      ${past ? '' : `<button class="btn sm ghost cal-add" data-act="toCal" data-v="leave:${l.id}" title="내 캘린더에 추가" aria-label="내 캘린더에 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg></button>`}
      ${canEdit(l) ? `<button class="btn sm" data-act="editLeave" data-v="${l.id}">수정</button>
      <button class="btn sm danger" data-act="delLeave" data-v="${l.id}">삭제</button>` : ''}</div>` : ''}
  </div>`;
}

/* =========================================================
   업무 일정 — 파트별 업무 공유 (휴가 일정과 데이터·화면 모두 별도)
   탭을 열 때만 서버에서 불러온다 (getTasks)
   ========================================================= */
const TASK_CATS = ['개발', '배포', '테스트', '회의/리뷰', '마감', '인프라', '기타'];
const TASK_STATUS = ['예정', '진행 중', '완료', '지연'];
const MAX_ASSIGNEES = 10;
const W = { loaded: false, loading: false, error: '', tasks: [] };
const catIdx = (c) => Math.max(TASK_CATS.indexOf(c), 0);

function loadTasks(force) {
  if (W.loading || (W.loaded && !force)) return;
  W.loading = true;
  api('getTasks')
    .then((r) => { W.tasks = r.tasks || []; W.loaded = true; W.error = ''; })
    .catch((e) => { const m = (e && e.message) || String(e); if (m.indexOf('AUTH:') >= 0) return handleError(e); W.error = m; })
    .finally(() => { W.loading = false; if (screen === 'app' && ui.tab === 'work') render(); });
}

/** 업무 일정 저장·삭제 결과({ tasks }) 반영 */
async function runTasks(promise, okMsg) {
  loading(true);
  try {
    const r = await promise;
    W.tasks = r.tasks || []; W.loaded = true; stateSeq++;
    closeModal(); render();
    if (okMsg) toast(okMsg);
  } catch (e) {
    handleError(e);
  } finally {
    loading(false);
  }
}

function workFiltered() {
  const me = S.me.email;
  // 파트를 골라도 '전체' 파트(공통) 업무는 함께 보여준다
  return W.tasks.filter((t) => (!ui.workPart || t.part === ui.workPart || t.part === '전체') && (!ui.workMine || t.assignees.includes(me) || t.createdBy === me));
}

/** 그날 표시할 업무 (여러 날 업무는 주말·공휴일엔 표시하지 않음) */
function tasksOn(ds, list) {
  const d = parse(ds);
  return list.filter((t) => t.startDate <= ds && ds <= t.endDate && (t.startDate === t.endDate || !D.isOff(ds, d)))
    .sort((a, b) => taskTimeKey(a).localeCompare(taskTimeKey(b))); // 시간순 (시간 없는 업무가 먼저), 같으면 등록순 (정렬이 안정적이라 원래 순서 유지)
}
const taskTimeKey = (t) => { const r = parseTimeRange(t.time); return r ? r[0] : ''; };

const isOverdue = (t) => t.status !== '완료' && t.endDate < todayStr();

function taskItem(t) {
  const names = t.assignees.map((e) => esc(nameOf(e))).join(', ');
  const late = isOverdue(t);
  return `<div class="card item barred ${t.status === '완료' ? 'past' : ''}"${t.canEdit ? ` data-cid="${t.id}"` : ''}>
    <div class="bar k-${catIdx(t.category)}"></div>
    <div class="body">
      <div class="title"><span class="badge">${esc(t.part)}</span> ${esc(t.title)}${t.series ? ' <span class="muted small" title="반복 일정">↻</span>' : ''}
        <span class="muted small" style="font-weight:500">${fmtRange(t)}${t.time ? ' ' + esc(t.time) : ''}</span>
        ${late ? '<span class="badge overdue">기한 지남</span>' : t.status === '지연' ? '<span class="badge overdue">지연</span>' : ''}</div>
      <div class="meta">${esc(t.category)}${t.canEdit ? '' : ' · ' + esc(t.status)}${names ? ' · 담당 ' + names : ''}${t.visibility === 'part' ? ' · 파트 내부' : t.visibility === 'ds' ? ' · <b>DS직원만</b>' : t.visibility === 'assignees' ? ' · <b>담당자만</b>' : t.visibility === 'private' ? ' · <b>나만 보기</b>' : ''}${t.drawId ? ` <button class="draw-link" data-act="drawView" data-v="${t.drawId}">· 추첨 결과</button>` : ''}</div>
      ${t.memo ? memoBlock(t.memo) : ''}
      ${(t.absences || []).length ? `<div class="absent-box">⚠ 담당자 부재: ${t.absences.map(esc).join(', ')}</div>` : ''}
    </div>
    ${t.canEdit || t.endDate >= todayStr() ? `<div class="actions">
      ${t.endDate >= todayStr() && t.status !== '완료' ? `<button class="btn sm ghost cal-add" data-act="toCal" data-v="task:${t.id}" title="내 캘린더에 추가" aria-label="내 캘린더에 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg></button>` : ''}
      ${t.canEdit ? `<select class="status-sel" data-act="tstatus" data-v="${t.id}" aria-label="상태">${TASK_STATUS.map((st) => `<option ${t.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select>
      <button class="btn sm" data-act="editTask" data-v="${t.id}">수정</button>
      <button class="btn sm danger" data-act="delTask" data-v="${t.id}">삭제</button>` : ''}</div>` : ''}
  </div>`;
}

/** 요약 카드: 이번 주 · 마감 임박(3일 이내) · 지연/기한 지남 */
function workSummary(list) {
  const today = todayStr();
  const t = parse(today);
  const mon = ymd(addDays(t, -((t.getDay() + 6) % 7)));
  const sun = ymd(addDays(parse(mon), 6));
  const soonEnd = ymd(addDays(t, 3));
  const open = list.filter((x) => x.status !== '완료');
  const groups = {
    week: list.filter((x) => x.startDate <= sun && mon <= x.endDate),
    soon: open.filter((x) => x.endDate >= today && x.endDate <= soonEnd),
    late: open.filter((x) => x.status === '지연' || x.endDate < today),
  };
  const scope = ui.workPart ? ui.workPart + ' ' : ui.workMine ? '내 ' : '';
  const card = (key, label, warn) => {
    const g = groups[key];
    return `<div class="card stat ${warn && g.length ? 'warn' : ''}" ${g.length ? `data-act="wsum" data-v="${key}" style="cursor:pointer"` : ''}>
      <div class="label">${label}</div><div class="value">${g.length}건</div>
      <div class="sub">${g.length ? g.slice(0, 3).map((x) => esc(x.title)).join(', ') : '없음'}</div></div>`;
  };
  W.groups = groups;
  return `<div class="stats" style="margin-bottom:12px">${card('week', `이번 주 ${scope}업무`)}${card('soon', '마감 3일 이내', true)}${card('late', '지연 · 기한 지남', true)}</div>`;
}

/** 이번 주 부재 — 평일별로 누가 어떤 일정인지 (날짜를 누르면 그날 상세) */
function openWeekAbsent(monStr) {
  const mon = parse(monStr);
  const days = [0, 1, 2, 3, 4].map((i) => ymd(addDays(mon, i))).filter((ds) => !D.isOff(ds, parse(ds)));
  const who = (l) => `<span class="name-chip"><i class="dot t-${l.type}"></i> ${esc(nameOf(l.email))}${partOf(l.email) && canSeeAll() && !ui.part ? ` <span class="muted small">${esc(partOf(l.email))}</span>` : ''} <span class="muted small">${SHORT[l.type]}</span></span>`;
  const rows = days.map((ds) => {
    const ls = leavesOn(ds);
    return `<div class="week-absent" data-act="day" data-v="${ds}">
      <div class="wa-day${ds === todayStr() ? ' today' : ''}">${fmtShort(ds)} <span class="muted small">${ls.length}명</span></div>
      <div class="wa-names">${ls.length ? ls.map(who).join('') : '<span class="muted small">부재 없음</span>'}</div></div>`;
  }).join('');
  openModal(`<header><h3>이번 주 부재 <span class="muted small">날짜를 누르면 상세</span></h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content">${rows || '<div class="empty">이번 주는 평일이 없습니다.</div>'}</div>`);
  $modal.querySelector('.modal').classList.add('wide');
}

function openWorkGroup(key) {
  const title = { week: '이번 주 업무', soon: '마감 3일 이내', late: '지연 · 기한 지남' }[key];
  const items = ((W.groups || {})[key] || []).slice().sort((a, b) => a.endDate.localeCompare(b.endDate));
  openModal(`<header><h3>${title} <span class="muted small">${items.length}건</span></h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content"><div class="list">${items.map(taskItem).join('') || '<div class="empty">없습니다.</div>'}</div></div>`);
}

/** 타임라인: 파트별로 묶어 선택한 달의 기간을 막대로 */
function workTimeline(list, first) {
  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const ym = `${first.getFullYear()}-${pad(first.getMonth() + 1)}`;
  const mStart = `${ym}-01`, mEnd = `${ym}-${pad(days)}`;
  const today = todayStr();
  const inMonth = list.filter((t) => t.startDate <= mEnd && mStart <= t.endDate);
  const cols = `grid-template-columns: 150px repeat(${days}, minmax(22px, 1fr))`;
  let html = `<div class="tl-row"><div class="tl-label tl-part">업무</div>`;
  for (let d = 1; d <= days; d++) {
    const ds = `${ym}-${pad(d)}`;
    html += `<div class="tl-day ${D.isOff(ds, parse(ds)) ? 'off' : ''} ${ds === today ? 'today' : ''}">${d}</div>`;
  }
  html += '</div>';
  const parts = TASK_PARTS.filter((p) => inMonth.some((t) => t.part === p));
  parts.forEach((p) => {
    html += `<div class="tl-row"><div class="tl-label tl-part" style="grid-column: 1 / -1">${esc(p)} <span class="muted small">${inMonth.filter((t) => t.part === p).length}건</span></div></div>`;
    inMonth.filter((t) => t.part === p).sort((a, b) => a.startDate.localeCompare(b.startDate)).forEach((t) => {
      const s = t.startDate < mStart ? 1 : Number(t.startDate.slice(8));
      const e = t.endDate > mEnd ? days : Number(t.endDate.slice(8));
      const left = ((s - 1) / days) * 100, width = ((e - s + 1) / days) * 100;
      html += `<div class="tl-row"><div class="tl-label" title="${esc(t.title)}">${(t.absences || []).length ? '⚠ ' : ''}${esc(t.title)}</div>
        <div class="tl-cell" style="grid-column: 2 / -1">
          <div class="tl-bar k-${catIdx(t.category)} ${t.status === '완료' ? 'done' : ''}"${t.canEdit ? ` data-cid="${t.id}"` : ''} data-act="${t.canEdit ? 'editTask' : 'wday'}" data-v="${t.canEdit ? t.id : t.startDate < mStart ? mStart : t.startDate}"
            style="left:${left}%;width:${width}%" title="${esc(t.title)} ${fmtRange(t)}">${esc(t.title)}</div></div></div>`;
    });
  });
  if (!parts.length) return '<div class="card empty">이 달에 등록된 업무가 없습니다.</div>';
  return `<div class="card tl-wrap"><div class="tl" style="${cols}">${html}</div></div>`;
}

function viewWork() {
  if (!W.loaded) {
    loadTasks();
    return W.error
      ? `<div class="card empty">업무 일정을 불러오지 못했습니다. ${esc(W.error)}<br><button class="btn sm" data-act="reloadTasks" style="margin-top:8px">다시 시도</button></div>`
      : '<div class="card empty">업무 일정을 불러오는 중…</div>';
  }
  const today = todayStr();
  const list = workFiltered();
  const first = ui.workMonth;
  const summary = workSummary(list);
  const start = addDays(first, -first.getDay());
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const weeks = Math.ceil((first.getDay() + last.getDate()) / 7);
  const mobile = window.matchMedia('(max-width: 640px)').matches;
  const canDrag = !mobile && window.matchMedia('(pointer: fine)').matches; // PC(마우스)에서만 끌어서 옮기기
  const maxChips = 5;
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i);
    const ds = ymd(d);
    const items = tasksOn(ds, list);
    const cls = ['day', d.getMonth() !== first.getMonth() && 'out', d.getDay() === 0 && 'sun', d.getDay() === 6 && 'sat', D.holidays[ds] && 'hol', ds === today && 'today'].filter(Boolean).join(' ');
    const evs = (S.events || []).filter((e) => e.startDate <= ds && ds <= e.endDate); // 중요 일정도 업무 캘린더 맨 위에 ★
    const room = Math.max(maxChips - evs.length, 1);
    const shown = items.slice(0, items.length > room ? room - 1 : room);
    cells += `<div class="${cls}" data-act="wday" data-v="${ds}">
      <div class="dtop"><span class="dnum">${d.getDate()}</span>${D.holidays[ds] ? `<span class="hname">${esc(D.holidays[ds])}</span>` : ''}</div>
      ${evs.map((e) => `<div class="chip evt" title="${esc(e.title)}${e.time ? ' ' + esc(e.time) : ''}"><span class="w">★</span><span class="nm">${esc(e.title)}</span></div>`).join('')}
      ${shown.map((t) => `<div class="chip k-${catIdx(t.category)} ${t.status === '완료' ? 'done' : ''}"${canDrag && t.canEdit ? ` draggable="true" data-tid="${t.id}"` : ''}${t.canEdit ? ` data-cid="${t.id}"` : ''} title="[${esc(t.part)}] ${esc(t.title)}${(t.absences || []).length ? ' (담당자 부재)' : ''}${canDrag && t.canEdit ? ' · 끌어서 날짜 옮기기 · Ctrl(⌘)+클릭 복사' : ''}">${(t.absences || []).length ? '<span class="w">⚠</span>' : ''}${mobile || ui.workPart ? '' : `<span class="pt">${esc(t.part)}</span>`}<span class="nm">${esc(t.title)}</span></div>`).join('')}
      ${items.length > shown.length ? `<div class="more">+${items.length - shown.length}</div>` : ''}
    </div>`;
  }
  const ym = `${first.getFullYear()}-${pad(first.getMonth() + 1)}`;
  const monthAll = list.filter((t) => t.startDate.slice(0, 7) <= ym && ym <= t.endDate.slice(0, 7))
    .sort((a, b) => a.startDate.localeCompare(b.startDate) || a.part.localeCompare(b.part));
  const monthList = ui.workHidePast ? monthAll.filter((t) => t.endDate >= today) : monthAll; // 지난 업무 = 종료일이 오늘보다 전

  return `
    <div class="chips-row" style="margin-bottom:10px">
      ${['', ...PARTS, ...(isAdmin() || (W.tasks || []).some((t) => t.part === 'PM') ? ['PM'] : [])].map((p) => `<button class="${ui.workPart === p ? 'on' : ''}" data-act="wpart" data-v="${p}">${p || '전체 파트'}</button>`).join('')}
    </div>
    ${summary}
    <div class="cal-toolbar">
      <div class="month-nav">
        <button class="icon-btn" data-act="wmonth" data-v="-1" aria-label="이전 달">‹</button>
        <h2>${first.getFullYear()}년 ${first.getMonth() + 1}월</h2>
        <button class="icon-btn" data-act="wmonth" data-v="1" aria-label="다음 달">›</button>
        <button class="btn sm" data-act="wmonth" data-v="0" style="margin-left:4px">오늘</button>
      </div>
      <div class="cal-actions">
        <div class="view-switch"><button class="${ui.workView === 'cal' ? 'on' : ''}" data-act="wview" data-v="cal">캘린더</button><button class="${ui.workView === 'timeline' ? 'on' : ''}" data-act="wview" data-v="timeline">타임라인</button></div>
        <label class="toggle"><input type="checkbox" data-act="wmine" ${ui.workMine ? 'checked' : ''}> 내 업무만</label>
        ${isAdmin() ? '<button class="btn" data-act="newEvent">+ 중요 일정</button>' : ''}
        <button class="btn primary" data-act="newTask">+ 업무 등록</button>
      </div>
    </div>
    ${ui.workView === 'timeline' ? workTimeline(list, first) : `<div class="card cal">
      <div class="cal-head">${WEEK.map((w) => `<div>${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>`}
    <div class="legend">${TASK_CATS.map((c, i) => `<span><i class="dot k-${i}"></i>${c}</span>`).join('')}
      <span><span style="color:var(--evt)">★</span> 중요 일정</span>
      <span><span style="color:var(--warn)">⚠</span> 담당자 부재</span>
      <span>· 휴가 일정과는 별도로 관리됩니다</span></div>
    <div class="section-title"><span>${first.getMonth() + 1}월 업무 <span class="muted small">${monthList.length}건${monthAll.length > monthList.length ? ` · 지난 업무 ${monthAll.length - monthList.length}건 숨김` : ''}</span></span>
      <label class="toggle"><input type="checkbox" data-act="wpast" ${ui.workHidePast ? 'checked' : ''}> 지난 업무 숨기기</label></div>
    <div class="list">${monthList.length ? monthList.map(taskItem).join('') : `<div class="card empty">${monthAll.length ? '이 달 업무는 모두 지났습니다.' : '이 달에 등록된 업무가 없습니다.'}</div>`}</div>`;
}

function openWorkDay(ds) {
  const items = tasksOn(ds, workFiltered());
  const d = parse(ds);
  const evs = (S.events || []).filter((e) => e.startDate <= ds && ds <= e.endDate);
  openModal(`<header><h3>${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEK[d.getDay()]}) 업무</h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content">${evs.length ? `<div class="evt-list" style="margin:0 0 12px">${evs.map(evtItem).join('')}</div>` : ''}<div class="list">${items.length ? items.map(taskItem).join('') : '<div class="empty">등록된 업무가 없습니다.</div>'}</div></div>
    <footer><span class="spacer"></span><button class="btn primary" data-act="newTask" data-v="${ds}">+ 이 날 업무 등록</button></footer>`);
}

/** 담당자 선택 (칩 + 추가 목록, 본인 포함 가능) */
function renderAssignees(box, list, part, onChange, max = MAX_ASSIGNEES) {
  const groups = {};
  S.users.filter((u) => !list.includes(u.email)).forEach((u) => (groups[u.part || 'PM'] = groups[u.part || 'PM'] || []).push(u));
  const order = [part, ...PARTS, 'PM'].filter((g, k, a) => g && a.indexOf(g) === k && groups[g]);
  box.innerHTML = list.map((e, i) => `<span class="name-chip">${esc(nameOf(e))}<button type="button" data-adel="${i}" aria-label="${esc(nameOf(e))} 빼기">✕</button></span>`).join('')
    + (list.length < max ? `<select data-aadd><option value="">+ 담당자 추가</option>${order.map((g) =>
      `<optgroup label="${esc(g)}">${groups[g].sort((a, b) => a.name.localeCompare(b.name)).map((u) => `<option value="${esc(u.email)}">${esc(u.name)}</option>`).join('')}</optgroup>`).join('')}</select>` : '');
  const again = () => { renderAssignees(box, list, part, onChange, max); if (onChange) onChange(); };
  box.querySelectorAll('[data-adel]').forEach((b) => (b.onclick = () => { list.splice(+b.dataset.adel, 1); again(); }));
  const sel = box.querySelector('[data-aadd]');
  if (sel) sel.onchange = () => { if (sel.value) list.push(sel.value); again(); };
}

/** copyId: 그 업무 내용으로 채운 새 등록 창 (수정 창의 [복사]) — 상태는 '예정', 반복 묶음은 이어지지 않음 */
function openTaskForm(id, date, copyId) {
  const ex = id ? W.tasks.find((t) => t.id === id) : null;
  const src = !ex && copyId ? W.tasks.find((t) => t.id === copyId) : null;
  const myPart = S.me.part || '';
  if (!ex && !isAdmin() && !myPart) return toast('파트가 지정되지 않은 계정입니다. PM에게 파트 지정을 요청하세요.', true);
  const d0 = date || todayStr();
  const mine = !ex || ex.createdBy === S.me.email; // '나만 보기'는 등록한 사람만 설정 가능
  const f = ex ? Object.assign({}, ex, { assignees: ex.assignees.slice() })
    : src ? Object.assign({}, src, { id: '', status: '예정', series: '', part: isAdmin() ? src.part : myPart, assignees: src.assignees.slice() })
    : { id: '', part: isAdmin() ? ui.workPart || myPart || 'PM' : myPart, title: '', category: '개발', startDate: d0, endDate: d0, time: '', assignees: [S.me.email], status: '예정', visibility: 'all', memo: '' };
  const m = openModal(`
    <header><h3>${ex ? '업무 일정 수정' : src ? '업무 일정 복사' : '업무 일정 등록'}</h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content">
      <div class="field"><label>파트 <span class="req">*</span></label>${isAdmin() /* PM은 수정할 때도 파트를 바꿀 수 있음 (파트원 · PL은 자기 파트 고정) */
        ? `<select name="part"><option value="">— 파트 선택 —</option>${TASK_PARTS.map((p) => `<option value="${p}" ${f.part === p ? 'selected' : ''}>${p === '전체' ? '전체 파트 (공통)' : p}</option>`).join('')}</select>`
        : `<input value="${esc(f.part)}" disabled>`}</div>
      <div class="field"><label>제목 <span class="req">*</span></label><input name="title" maxlength="60" value="${esc(f.title)}" placeholder="예: 10월 정기배포, 앱 3.2 회귀 테스트"></div>
      <div class="field"><label>분류 <span class="req">*</span></label>
        <div class="seg">${TASK_CATS.map((c, i) => `<button type="button" data-cat="${esc(c)}" class="${f.category === c ? 'on' : ''}"><i class="dot k-${i}"></i>${c}</button>`).join('')}</div></div>
      <div class="row2">
        <div class="field"><label>시작일 <span class="req">*</span></label><input type="date" name="startDate" value="${f.startDate}"></div>
        <div class="field"><label>종료일</label><input type="date" name="endDate" value="${f.endDate}" min="${f.startDate}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>시간 <span class="muted" style="font-weight:400">선택</span></label><input name="time" maxlength="30" value="${esc(f.time)}" placeholder="예: 14:00~16:00"></div>
        <div class="field"><label>상태</label><select name="status">${TASK_STATUS.map((st) => `<option ${f.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>공개 범위</label><div class="seg">
        <button type="button" data-vis="all" class="${!f.visibility || f.visibility === 'all' ? 'on' : ''}">전체 공개</button>
        <button type="button" data-vis="part" class="${f.visibility === 'part' ? 'on' : ''}">파트 내부만</button>
        ${isAdmin() || S.me.ds || f.visibility === 'ds' ? `<button type="button" data-vis="ds" class="${f.visibility === 'ds' ? 'on' : ''}">DS직원만</button>` : ''}
        <button type="button" data-vis="assignees" class="${f.visibility === 'assignees' ? 'on' : ''}">담당자만</button>
        ${mine ? `<button type="button" data-vis="private" class="${f.visibility === 'private' ? 'on' : ''}">나만 보기</button>` : ''}</div>
        <div class="muted small" data-vishelp style="margin-top:4px"></div></div>
      ${ex ? (ex.series ? `<div class="field"><label class="label-row"><span>↻ 반복 일정 · 수정 범위</span><button type="button" class="btn ghost sm" data-extend>+ 반복 연장</button></label>
        <div class="seg" data-scopes><button type="button" data-scope="" class="on">이 일정만</button><button type="button" data-scope="after">이후 모두 (${W.tasks.filter((x) => x.series === ex.series && x.startDate >= ex.startDate).length}건)</button><button type="button" data-scope="all">전체 (${W.tasks.filter((x) => x.series === ex.series).length}건)</button></div>
        <div class="muted small" data-scopehelp style="margin-top:4px">이 날짜 일정만 바뀌어요.</div></div>` : '') : `<div class="field"><label>반복 <span class="muted" style="font-weight:400">선택</span></label>
        <select name="repFreq"><option value="">반복 안 함</option><option value="weekday">매일 (평일)</option><option value="weekly">매주</option><option value="biweekly">격주</option><option value="monthly">매월 (같은 날짜)</option></select>
        <div data-repopts style="display:none;margin-top:8px">
          <div class="seg" data-repdays>${['일', '월', '화', '수', '목', '금', '토'].map((w, i) => `<button type="button" data-rd="${i}">${w}</button>`).join('')}</div>
          <div class="field" style="margin:8px 0 0"><label>반복 종료일</label><input type="date" name="repUntil"></div>
          <div class="field" style="margin:8px 0 0"><label>공휴일${'<span data-offwk> · 주말</span>'}에 걸리면</label>
            <select name="repOff"><option value="skip">건너뛰기</option><option value="next">다음 영업일로</option><option value="prev">이전 영업일로</option><option value="keep">그대로 두기</option></select></div>
          <div class="muted small" data-repinfo style="margin-top:6px"></div>
        </div></div>`}
      <div class="field" data-afield><label>담당자 <span class="muted" style="font-weight:400">선택 · 최대 ${MAX_ASSIGNEES}명 · 다른 파트도 가능</span></label><div class="assignee-box" data-assignees></div><div data-absent></div>
        ${isAdmin() && ex ? `<div style="margin-top:6px"><button type="button" class="btn sm" data-drawbtn>사다리 추첨으로 뽑기</button>${ex.drawId ? ' <button type="button" class="draw-link" data-act="drawView" data-v="' + ex.drawId + '">지난 추첨 결과</button>' : ''}</div>` : ''}</div>
      <div class="field"><label>메모</label><textarea name="memo" rows="3" maxlength="${MEMO_MAX}" data-grow placeholder="링크, 참고사항, 업무 내역 (길게 써도 돼요)">${esc(f.memo)}</textarea></div>
      ${isAdmin() && !ex ? `<label class="toggle" style="color:var(--text)"><input type="checkbox" name="asEvent">
        <span><b style="color:var(--evt)">★ 중요 일정으로 등록</b> <span class="muted small">— 업무 대신 중요 일정으로 저장돼서 모든 직원에게 보여요 (제목 · 날짜 · 시간 · 담당자 · 메모)</span></span></label>` : ''}
    </div>
    <footer>${ex ? '<button class="btn danger" data-del>삭제</button><button class="btn" data-copy title="이 내용으로 새 업무 등록">복사</button>' : ''}<span class="spacer"></span>
      <button class="btn" data-close>취소</button><button class="btn primary" data-save>${ex ? '저장' : '등록'}</button></footer>`);
  const q = (sel) => m.querySelector(sel);
  if (ex) q('[data-copy]').onclick = () => openTaskForm(null, null, ex.id);
  if (q('[data-extend]')) q('[data-extend]').onclick = () => openSeriesExtend(ex.id);
  const box = q('[data-assignees]');
  // 담당자·기간이 바뀌면 부재 여부를 서버에 확인 (휴가 공개 규칙 안에서만)
  let seq = 0, timer = null;
  const checkAbsent = () => {
    clearTimeout(timer);
    const my = ++seq;
    timer = setTimeout(() => {
      if (!f.assignees.length) { q('[data-absent]').innerHTML = ''; return; }
      api('checkTaskAbsence', { startDate: q('[name=startDate]').value, endDate: q('[name=endDate]').value, assignees: f.assignees })
        .then((r) => { if (my === seq && $modal === m) q('[data-absent]').innerHTML = r.absences.length ? `<div class="absent-box">⚠ 담당자 부재: ${r.absences.map(esc).join(', ')}</div>` : ''; })
        .catch(() => {});
    }, 300);
  };
  const renderA = () => renderAssignees(box, f.assignees, f.part, checkAbsent);
  renderA();
  checkAbsent();
  m.querySelectorAll('[data-cat]').forEach((b) => (b.onclick = () => { f.category = b.dataset.cat; m.querySelectorAll('[data-cat]').forEach((x) => x.classList.toggle('on', x === b)); }));
  // 공개 범위: '나만 보기'면 담당자 칸을 숨긴다 (담당자는 본인으로 고정, 서버도 같은 규칙)
  const VIS_HELP = { all: '모든 직원이 볼 수 있습니다.', part: '우리 파트 직원과 PM만 볼 수 있습니다.', assignees: '담당자와 등록한 사람만 볼 수 있습니다. (PM·PL도 담당자가 아니면 볼 수 없어요)', ds: 'DS직원과 PM만 볼 수 있습니다. 담당자도 DS직원 중에서 고르세요 (DS직원이 아니면 담당자여도 안 보여요).', private: '나만 볼 수 있습니다. PM·PL도 볼 수 없고, 담당자는 본인으로 고정됩니다.' };
  const syncVis = () => {
    q('[data-afield]').style.display = f.visibility === 'private' ? 'none' : '';
    q('[data-vishelp]').textContent = VIS_HELP[f.visibility] || VIS_HELP.all;
  };
  m.querySelectorAll('[data-vis]').forEach((b) => (b.onclick = () => { f.visibility = b.dataset.vis; m.querySelectorAll('[data-vis]').forEach((x) => x.classList.toggle('on', x === b)); syncVis(); }));
  syncVis();
  if (q('select[name=part]')) q('select[name=part]').onchange = (e) => { f.part = e.target.value; renderA(); };
  const sd = q('[name=startDate]'), ed = q('[name=endDate]');
  let prevStart = sd.value;
  sd.onchange = () => {
    // 복사본: 시작일을 옮기면 종료일도 같은 기간만큼 따라감
    if (src && prevStart && ed.value && sd.value) ed.value = ymd(addDays(parse(ed.value), Math.round((parse(sd.value) - parse(prevStart)) / 864e5)));
    if (!ed.value || ed.value < sd.value) ed.value = sd.value;
    ed.min = sd.value; prevStart = sd.value; checkAbsent();
  };
  ed.onchange = checkAbsent;
  if (ex) q('[data-del]').onclick = () => removeTask(ex.id);
  if (q('[data-drawbtn]')) q('[data-drawbtn]').onclick = () => openDrawForm('task', ex.id);
  // 반복 일정 수정 범위 — 날짜·상태는 이 일정에만, 제목·분류·담당자·메모 등은 고른 범위에 함께 반영
  let scope = '';
  m.querySelectorAll('[data-scope]').forEach((b) => (b.onclick = () => {
    scope = b.dataset.scope;
    m.querySelectorAll('[data-scope]').forEach((x) => x.classList.toggle('on', x === b));
    q('[data-scopehelp]').textContent = scope ? `제목·분류·시간·담당자·공개 범위·메모가 ${scope === 'all' ? '전체 반복 일정' : '이 날짜 이후 반복 일정'}에 함께 반영돼요. 날짜·상태는 이 일정만 바뀌어요.` : '이 날짜 일정만 바뀌어요.';
  }));
  // 반복 (새 일정만): 방식 · 요일 · 종료일 · 공휴일 건너뛰기 → 몇 회 만들어지는지 미리 보여줌
  const rep = { freq: '', days: [], until: '', offDay: 'skip' };
  const repInfo = () => {
    if (!rep.freq) return;
    rep.until = q('[name=repUntil]').value; rep.offDay = q('[name=repOff]').value;
    let txt;
    try { const ds = repeatDates(sd.value, ed.value || sd.value, rep); txt = `총 <b>${ds.length}회</b> 등록돼요 (${fmtShort(ds[0][0])} ~ ${fmtShort(ds[ds.length - 1][0])})`; } catch (e) { txt = `<span style="color:var(--danger)">${esc(e.message)}</span>`; }
    q('[data-repinfo]').innerHTML = txt;
  };
  if (q('[name=repFreq]')) {
    const paintDays = () => m.querySelectorAll('[data-rd]').forEach((b) => b.classList.toggle('on', rep.days.includes(+b.dataset.rd)));
    q('[name=repFreq]').onchange = (e) => {
      rep.freq = e.target.value;
      q('[data-repopts]').style.display = rep.freq ? '' : 'none';
      q('[data-repdays]').style.display = rep.freq === 'weekly' || rep.freq === 'biweekly' ? '' : 'none';
      q('[data-offwk]').style.display = rep.freq === 'monthly' ? '' : 'none'; // 주말은 매월 반복에서만 쉬는 날로 봄 (매주·격주는 고른 요일 그대로)
      if (!rep.days.length) rep.days = [parse(sd.value).getDay()];
      if (!q('[name=repUntil]').value) q('[name=repUntil]').value = ymd(addDays(parse(sd.value), 90)); // 기본 3개월
      paintDays(); repInfo();
    };
    m.querySelectorAll('[data-rd]').forEach((b) => (b.onclick = () => {
      const d = +b.dataset.rd;
      rep.days = rep.days.includes(d) ? rep.days.filter((x) => x !== d) : rep.days.concat([d]);
      paintDays(); repInfo();
    }));
    q('[name=repUntil]').onchange = repInfo; q('[name=repOff]').onchange = repInfo;
    sd.addEventListener('change', repInfo); ed.addEventListener('change', repInfo);
  }
  // PM: '중요 일정으로 등록'을 켜면 업무 전용 칸(분류 · 상태 · 공개 범위 · 반복)을 숨기고 중요 일정으로 저장

/** 반복 날짜 (서버 Code.gs repeatDates_와 같은 규칙 — 등록 화면 미리보기 · 미리보기 서버용) */
function repeatDates(startDate, endDate, rep, holidaySet, after) {
  const DAY = 864e5;
  const toT = (ds) => Date.UTC(+ds.slice(0, 4), +ds.slice(5, 7) - 1, +ds.slice(8, 10));
  const toS = (t) => new Date(t).toISOString().slice(0, 10);
  const hol = holidaySet || D.holidays || {};
  const until = rep.until || '';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(until) || until < startDate || (after && until <= after)) throw new Error('반복 종료일을 확인하세요.');
  const s0 = toT(startDate), u = toT(until), span = toT(endDate) - s0;
  if (u - (after ? toT(after) : s0) > 366 * DAY) throw new Error('반복은 최대 1년까지 등록할 수 있습니다.');
  const days = (rep.days || []).length ? rep.days : [new Date(s0).getUTCDay()];
  const week0 = s0 - new Date(s0).getUTCDay() * DAY;
  const mode = ['skip', 'next', 'prev', 'keep'].includes(rep.offDay) ? rep.offDay : rep.skipHolidays ? 'skip' : 'keep';
  const weekend = (tt) => { const w = new Date(tt).getUTCDay(); return w === 0 || w === 6; };
  const isOff = (tt) => !!hol[toS(tt)] || (rep.freq === 'monthly' && weekend(tt));
  const business = (tt) => !weekend(tt) && !hol[toS(tt)];
  const seen = {};
  const out = [];
  for (let t = s0; t <= u; t += DAY) {
    const d = new Date(t), dow = d.getUTCDay();
    const hit = rep.freq === 'weekday' ? dow >= 1 && dow <= 5
      : rep.freq === 'weekly' ? days.includes(dow)
        : rep.freq === 'biweekly' ? days.includes(dow) && Math.floor((t - week0) / (7 * DAY)) % 2 === 0
          : d.getUTCDate() === new Date(s0).getUTCDate();
    if (!hit) continue;
    let at = t;
    if (isOff(t)) {
      if (mode === 'skip') continue;
      if (mode === 'next') while (!business(at)) at += DAY;
      if (mode === 'prev') while (!business(at)) at -= DAY;
    }
    if (seen[at]) continue;
    seen[at] = true;
    if (after && toS(at) <= after) continue;
    out.push([toS(at), toS(at + span)]);
    if (out.length > 100) throw new Error('반복은 한 번에 100회까지 등록할 수 있습니다. 종료일을 앞당겨 주세요.');
  }
  if (!out.length) throw new Error('반복 조건에 맞는 날짜가 없습니다.');
  return out;
}

/** 반복 연장 날짜 (서버 extendTaskSeries와 같은 규칙): 매월이면 가장 많이 쓰인 날짜의 회차, 그 밖에는 첫 회차를 기준으로 마지막 회차 다음부터 */
function seriesExtendDates(list, rep, holidaySet) {
  const sorted = list.slice().sort((a, b) => (a.startDate < b.startDate ? -1 : a.startDate > b.startDate ? 1 : 0));
  const last = sorted[sorted.length - 1];
  let base = sorted[0];
  if (rep.freq === 'monthly') {
    const cnt = {};
    sorted.forEach((x) => (cnt[x.startDate.slice(8)] = (cnt[x.startDate.slice(8)] || 0) + 1));
    const day = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || (a < b ? -1 : 1))[0];
    base = sorted.find((x) => x.startDate.slice(8) === day);
  }
  const span = Math.round((parse(last.endDate) - parse(last.startDate)) / 864e5);
  const have = new Set(sorted.map((x) => x.startDate));
  const out = repeatDates(base.startDate, ymd(addDays(parse(base.startDate), span)), rep, holidaySet, last.startDate).filter(([s1]) => !have.has(s1));
  if (!out.length) throw new Error('반복 조건에 맞는 날짜가 없습니다.');
  return { last, dates: out };
}

/** 등록된 회차들로 반복 규칙 추정 (반복 연장 창의 기본값 — 사용자가 고칠 수 있음) */
function guessRepeat(list) {
  const ds = [...new Set(list.map((x) => x.startDate))].sort();
  const dows = ds.map((d) => parse(d).getDay());
  const gaps = ds.slice(1).map((d, i) => Math.round((parse(d) - parse(ds[i])) / 864e5));
  const minGap = gaps.length ? Math.min(...gaps) : 7;
  const cnt = {};
  dows.forEach((w) => (cnt[w] = (cnt[w] || 0) + 1));
  const days = Object.keys(cnt).map(Number).filter((w) => ds.length < 4 || cnt[w] >= 2).sort();
  let freq = 'weekly';
  if (gaps.length && Math.max(...gaps) <= 4 && new Set(dows).size >= 3 && dows.every((w) => w >= 1 && w <= 5)) freq = 'weekday';
  else if (minGap >= 25) freq = 'monthly';
  else if (minGap >= 14) freq = 'biweekly';
  let offDay = 'skip';
  if (freq === 'monthly') {
    const dc = {};
    ds.forEach((d) => (dc[d.slice(8)] = (dc[d.slice(8)] || 0) + 1));
    const main = +Object.keys(dc).sort((a, b) => dc[b] - dc[a])[0];
    const moved = ds.map((d) => +d.slice(8)).filter((x) => x !== main);
    if (moved.length) offDay = moved.some((x) => x > main || main - x > 20) ? 'next' : 'prev';
  }
  return { freq, days: days.length ? days : [dows[dows.length - 1]], offDay };
}

/** 같은 추첨은 늘 같은 사다리 모양 (추첨 id로 만든 난수) */
function seededRand(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
const LADDER_MAX = 16; // 이보다 많으면 사다리 대신 이름 카드 뽑기
function ladderHtml(d) {
  const ex = d.excluded.map((x) => x.email);
  const names = d.candidates.filter((c) => !ex.includes(c.email));
  const won = d.picked.map((x) => x.email);
  const n = names.length;
  if (n > LADDER_MAX) {
    return `<div class="roulette">${names.map((c) => `<span class="rchip" data-re="${esc(c.email)}">${esc(c.name)}</span>`).join('')}</div>`;
  }
  const rnd = seededRand(d.id), W2 = 64, top = 40, gap = 24, levels = Math.max(7, n + 3);
  const rung = [];
  for (let lv = 0; lv < levels; lv++) { rung[lv] = []; for (let i = 0; i < n - 1; i++) rung[lv][i] = !(i > 0 && rung[lv][i - 1]) && rnd() < 0.5; }
  const x = (c) => c * W2 + W2 / 2, y = (lv) => top + 12 + lv * gap, bottom = y(levels);
  const paths = names.map((c, i) => {
    let col = i; const pts = [[x(col), top]];
    for (let lv = 0; lv < levels; lv++) {
      if (rung[lv][col]) { pts.push([x(col), y(lv)], [x(col + 1), y(lv)]); col++; }
      else if (col > 0 && rung[lv][col - 1]) { pts.push([x(col), y(lv)], [x(col - 1), y(lv)]); col--; }
    }
    pts.push([x(col), bottom]);
    return { c, end: col, win: won.includes(c.email), d: pts.map((p, k) => (k ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ') };
  });
  const endWin = {};
  paths.forEach((p) => (endWin[p.end] = p.win));
  const H = bottom + 34, Wd = n * W2;
  return `<div class="ladder-wrap"><svg class="ladder" width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}">
    ${names.map((c, i) => `<text x="${x(i)}" y="22" text-anchor="middle" class="ln">${esc(c.name.slice(0, 5))}</text><line x1="${x(i)}" y1="${top}" x2="${x(i)}" y2="${bottom}" class="lr"/>`).join('')}
    ${rung.map((r, lv) => r.map((on, i) => (on ? `<line x1="${x(i)}" y1="${y(lv)}" x2="${x(i + 1)}" y2="${y(lv)}" class="lr"/>` : '')).join('')).join('')}
    ${paths.map((p, i) => `<path d="${p.d}" class="lp ${p.win ? 'win' : ''}" data-li="${i}"/>`).join('')}
    ${names.map((c, i) => `<g class="lb ${endWin[i] ? 'win' : ''}" data-lb="${i}"><rect x="${x(i) - 26}" y="${bottom + 6}" width="52" height="24" rx="6"/><text x="${x(i)}" y="${bottom + 22}" text-anchor="middle">${endWin[i] ? '당첨' : '-'}</text></g>`).join('')}
  </svg></div>`;
}
/** 사다리를 한 줄씩 내려가며 그림 (끝나면 done) */
function playLadder(root, done) {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const paths = [...root.querySelectorAll('.lp')];
  let timers = [];
  const finish = () => { timers.forEach(clearTimeout); timers = []; root.querySelectorAll('.lp').forEach((p) => { p.style.transition = 'none'; p.style.strokeDashoffset = 0; }); root.querySelectorAll('.lb, .rchip').forEach((b) => b.classList.add('shown')); root.querySelectorAll('.rchip').forEach((c) => c.classList.remove('hot')); done(); };
  if (paths.length) {
    paths.forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
    if (reduce) { finish(); return finish; }
    const wrap = root.querySelector('.ladder-wrap');
    paths.forEach((p, i) => timers.push(setTimeout(() => {
      p.getBoundingClientRect(); p.style.transition = 'stroke-dashoffset .9s ease-in-out'; p.style.strokeDashoffset = 0;
      if (wrap) wrap.scrollLeft = Math.max(0, i * 64 - wrap.clientWidth / 2);
    }, i * 500)));
    timers.push(setTimeout(finish, paths.length * 500 + 1000));
    return finish;
  }
  const chips = [...root.querySelectorAll('.rchip')];
  if (!chips.length || reduce) { finish(); return finish; }
  const winners = chips.filter((c) => c.dataset.win === '1');
  let k = 0;
  const spin = setInterval(() => { chips.forEach((c) => c.classList.remove('hot')); chips[Math.floor(Math.random() * chips.length)].classList.add('hot'); }, 90);
  timers.push(setTimeout(() => { clearInterval(spin); chips.forEach((c) => c.classList.remove('hot')); winners.forEach((c, i) => timers.push(setTimeout(() => c.classList.add('shown'), i * 350))); timers.push(setTimeout(done, winners.length * 350 + 200)); }, 2200));
  return () => { clearInterval(spin); finish(); };
}
