const SHORTCUTS = [
  ['N', '새로 등록 (캘린더·내 일정 → 휴가, 업무 일정 → 업무, 중요 일정 → 중요 일정)'],
  ['← / →', '이전 · 다음 달 (공휴일은 이전 · 다음 해)'],
  ['T', '오늘로'],
  ['1 ~ 9', '메뉴 이동 (내 메뉴 순서 기준)'],
  ['R', '최신 내용 불러오기'],
  ['/', '이름 검색 (전체 일정 탭으로 이동)'],
  ['Ctrl(⌘) + S', '열린 창 저장 · 등록'],
  ['Ctrl(⌘) + 클릭', '업무 캘린더 칸 · 업무 카드를 바로 복사'],
  ['?', '단축키 목록'],
  ['Esc', '창 닫기'],
];
function openShortcuts() {
  openModal(`<header><h3>단축키 <span class="muted small">PC</span></h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content"><table class="kbd-table"><tbody>${SHORTCUTS.map(([k, t]) => `<tr><td><kbd>${esc(k)}</kbd></td><td>${esc(t)}</td></tr>`).join('')}</tbody></table>
      <p class="muted small">입력칸에 글을 쓰는 중에는 Ctrl(⌘) + S · Esc만 동작해요. 한글 입력 상태여도 같은 자리의 키로 동작해요.</p></div>`);
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return dismissModal();
  if (screen !== 'app' || e.isComposing) return;
  const mod = (e.ctrlKey || e.metaKey) && !e.altKey;
  if (mod && e.code === 'KeyS') { // 열린 창의 저장 · 등록 버튼 (브라우저 '페이지 저장' 대신)
    if (!$modal) return;
    e.preventDefault();
    const b = $modal.querySelector('[data-save]') || $modal.querySelector('footer .btn.primary, button[type=submit].primary');
    if (b && !b.disabled) b.click();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target;
  if (tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))) return; // 글 쓰는 중
  if ($modal) return;
  const click = (sel) => { const b = document.querySelector(sel); if (b) { b.click(); return true; } return false; };
  const c = e.code;
  if (c === 'KeyN') {
    const want = { work: 'newTask', events: 'newEvent', holidays: 'newHoliday', members: 'newUser' }[ui.tab] || 'newLeave';
    if (!click(`[data-act="${want}"]`) && want === 'newLeave') openLeaveForm(null);
  } else if (c === 'ArrowLeft' || c === 'ArrowRight') {
    const d = c === 'ArrowLeft' ? '-1' : '1';
    if (!click(`main [data-act="month"][data-v="${d}"], main [data-act="wmonth"][data-v="${d}"], main [data-act="holYear"][data-v="${d}"]`)) return;
  } else if (c === 'KeyT') {
    click('main [data-act="month"][data-v="0"], main [data-act="wmonth"][data-v="0"]');
  } else if (/^Digit[1-9]$/.test(c)) {
    const t = myTabs()[+c.slice(5) - 1];
    if (t) goTab(t[0]);
  } else if (c === 'KeyR') {
    click('[data-act="refresh"]');
  } else if (c === 'Slash' && e.shiftKey) {
    openShortcuts();
  } else if (c === 'Slash') {
    if (!document.querySelector('.people-search') && myTabs().some((t) => t[0] === 'all')) goTab('all'); // 이름 검색은 전체 일정 탭에 있음
    const s = document.querySelector('.people-search');
    if (s) s.focus(); else return;
  } else return;
  e.preventDefault();
});
// 이름 검색: 목록에서 고르면 바로 이동 (엔터 없이)
document.addEventListener('input', (e) => { const t = e.target; if (t && t.dataset && t.dataset.act === 'psearch') pickBySearch(t.value, true); });

let lastMobile = window.matchMedia('(max-width: 640px)').matches;
window.addEventListener('resize', () => {
  const m = window.matchMedia('(max-width: 640px)').matches;
  if (m !== lastMobile) { lastMobile = m; if (screen === 'app' && ui.tab === 'cal') render(); }
});

/* =========================================================
   자동 새로고침 — 다른 사람이 바꾼 내용이 새로고침 없이 보이도록
   - 앱으로 돌아올 때(탭·앱 전환) 마지막 갱신 후 5분이 지났으면, 화면에 떠 있는 동안 10분마다, ↻ 버튼(즉시)
   - 실제로 바뀐 게 있을 때만 다시 그리고 스크롤 위치 유지. 열려 있는 등록 창은 그대로 둔다
   - 새로고침 도중 내가 저장하면(stateSeq 변경) 그 새로고침 결과는 버린다 (옛 데이터로 덮어쓰지 않게)
   ========================================================= */
let stateSeq = 0;
let lastRefresh = 0;
let refreshing = false;
const REFRESH_EVERY = 10 * 60000; // 화면에 떠 있는 동안 10분마다
const REFRESH_ON_RETURN = 5 * 60000; // 앱으로 돌아왔을 때 마지막 갱신 후 5분이 지났으면 새로고침

/* 휴대폰: 아래에서 올라온 창을 아래로 쓸어내리면 닫기 (창 안이 맨 위로 스크롤된 상태에서만) */
(function swipeDownClose() {
  if (typeof window === 'undefined') return;
  let st = null;
  window.addEventListener('touchstart', (e) => {
    const m = e.target && e.target.closest && e.target.closest('.modal');
    const typing = e.target.closest && e.target.closest('input, textarea, select');
    st = m && !typing && m.scrollTop <= 0 && window.matchMedia('(max-width: 640px)').matches
      ? { m, y0: e.touches[0].clientY, x0: e.touches[0].clientX, t0: Date.now(), dy: 0, mode: '' } : null;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (!st) return;
    const dy = e.touches[0].clientY - st.y0, dx = e.touches[0].clientX - st.x0;
    if (!st.mode && (Math.abs(dy) > 8 || Math.abs(dx) > 8)) st.mode = dy > 0 && Math.abs(dy) > Math.abs(dx) && st.m.scrollTop <= 0 ? 'down' : 'no';
    if (st.mode !== 'down') return;
    if (e.cancelable) e.preventDefault(); // 끌어내리는 동작이 뒤 화면 스크롤로 넘어가지 않게 (아이폰에서 뒤 화면이 맨 위로 튀던 문제)
    st.dy = Math.max(dy, 0);
    st.m.style.transition = 'none';
    st.m.style.transform = `translateY(${st.dy}px)`;
  }, { passive: false });
  window.addEventListener('touchend', () => {
    if (!st) return;
    const { m, dy, t0, mode } = st;
    st = null;
    if (mode !== 'down') return;
    const fast = dy > 40 && Date.now() - t0 < 250;
    if (dy > 110 || fast) {
      m.style.transition = 'transform .18s ease-in';
      m.style.transform = 'translateY(100%)';
      setTimeout(dismissModal, 170);
    } else {
      m.style.transition = 'transform .2s ease-out';
      m.style.transform = '';
    }
  }, { passive: true });
})();

/*
 * 캘린더를 좌우로 넘기기 (휴가 캘린더 · 업무 캘린더)
 * 미는 동안 날짜 칸이 손가락을 따라 움직이고, 충분히 밀었다 놓으면 밀려 나가고 다음(이전) 달이 반대쪽에서 들어온다.
 * 조금만 밀었다 놓으면 제자리로. 세로로 움직이기 시작하면 스크롤로 보고 건드리지 않는다 (.cal-grid는 touch-action: pan-y)
 */
(function swipeMonths() {
  if (typeof window === 'undefined') return;
  const EASE = 'cubic-bezier(.2,.8,.2,1)';
  let st = null;
  const set = (g, x, fade, ms) => {
    g.style.transition = ms ? `transform ${ms}ms ${EASE}, opacity ${ms}ms ${EASE}` : 'none';
    g.style.transform = x ? `translateX(${x}px)` : '';
    g.style.opacity = fade ? String(1 - fade) : '';
  };
  window.addEventListener('touchstart', (e) => {
    const grid = e.target && e.target.closest && e.target.closest('.cal-grid');
    st = grid && e.touches.length === 1 && (ui.tab === 'cal' || ui.tab === 'work')
      ? { grid, x0: e.touches[0].clientX, y0: e.touches[0].clientY, t0: Date.now(), dx: 0, mode: '', w: grid.offsetWidth || 1 } : null;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (!st) return;
    const dx = e.touches[0].clientX - st.x0, dy = e.touches[0].clientY - st.y0;
    if (!st.mode && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) st.mode = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    if (st.mode !== 'h') return;
    st.dx = dx;
    set(st.grid, dx, Math.min(Math.abs(dx) / st.w, 1) * 0.4, 0);
  }, { passive: true });
  const end = () => {
    if (!st) return;
    const { grid, dx, w, t0, mode } = st;
    st = null;
    if (mode !== 'h') return;
    const fast = Math.abs(dx) > 40 && Date.now() - t0 < 250; // 빠르게 튕겨도 넘김
    if (Math.abs(dx) < w * 0.25 && !fast) { set(grid, 0, 0, 200); return; } // 제자리로
    const step = dx < 0 ? 1 : -1; // 왼쪽으로 밀면 다음 달
    set(grid, -step * w, 1, 160);
    setTimeout(() => {
      if (ui.tab === 'work') ui.workMonth = new Date(ui.workMonth.getFullYear(), ui.workMonth.getMonth() + step, 1);
      else ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() + step, 1);
      render();
      const g = document.querySelector('.cal-grid');
      if (!g) return;
      set(g, step * w * 0.6, 1, 0); // 반대쪽에서 들어오기
      void g.offsetWidth;
      set(g, 0, 0, 220);
      // 달 제목이 화면 밖에 있을 수 있어 넘긴 달을 칸 위에 잠깐 표시
      const m = ui.tab === 'work' ? ui.workMonth : ui.month;
      const card = g.closest('.cal');
      if (card) {
        const pill = document.createElement('div');
        pill.className = 'month-pill';
        pill.textContent = `${m.getFullYear()}년 ${m.getMonth() + 1}월`;
        card.appendChild(pill);
        setTimeout(() => pill.remove(), 1000);
      }
    }, 160);
  };
  window.addEventListener('touchend', end, { passive: true });
  window.addEventListener('touchcancel', () => { if (st) { set(st.grid, 0, 0, 200); st = null; } }, { passive: true });
})();

/*
 * 홈 화면에 추가한 앱(standalone)은 브라우저의 '당겨서 새로고침'이 없어서 직접 만든다. (브라우저에서는 브라우저 기능과 겹치므로 켜지 않음)
 * 맨 위에서 70px 넘게 당겼다 놓으면 ↻ 버튼과 같은 동작
 */
(function pullToRefresh() {
  if (!IS_STANDALONE || typeof document === 'undefined' || !document.body) return;
  const bar = document.createElement('div');
  bar.className = 'ptr';
  document.body.appendChild(bar);
  let y0 = null, dy = 0;
  const reset = () => { y0 = null; dy = 0; bar.style.opacity = 0; bar.style.transform = 'translateY(-40px)'; };
  window.addEventListener('touchstart', (e) => { y0 = window.scrollY <= 0 && !$modal && screen === 'app' ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0) return reset();
    bar.textContent = dy > 70 ? '↻ 놓으면 새로고침' : '↓ 당겨서 새로고침';
    bar.style.opacity = dy > 15 ? 1 : 0;
    bar.style.transform = `translateY(${Math.min(dy, 90) - 40}px)`;
  }, { passive: true });
  window.addEventListener('touchend', () => { if (y0 !== null && dy > 70) refreshData(true); reset(); });
})();

async function refreshData(manual) {
  if (refreshing || screen !== 'app' || !S || MOVED) return;
  refreshing = true;
  const seq = stateSeq;
  const btn = document.querySelector('[data-act="refresh"]');
  if (manual && btn) btn.classList.add('spin');
  let changed = false;
  try {
    const b = await call('getBootstrap', getToken());
    if (b.needLogin) { setToken(''); S = null; screen = 'login'; render(); return; }
    if (b.state && seq === stateSeq && JSON.stringify(b.state) !== JSON.stringify(S)) { S = b.state; changed = true; }
    if (W.loaded && seq === stateSeq) {
      const t = await api('getTasks');
      if (seq === stateSeq && JSON.stringify(t.tasks) !== JSON.stringify(W.tasks)) { W.tasks = t.tasks || []; changed = true; }
    }
    if (E.loaded && seq === stateSeq && isAdmin()) {
      const x = await api('getEarly');
      if (seq === stateSeq && JSON.stringify(x.items) !== JSON.stringify(E.items)) { E.items = x.items || []; changed = true; }
    }
    if (R.loaded && seq === stateSeq) {
      const q = await api('getRequests');
      if (seq === stateSeq && JSON.stringify(q.requests) !== JSON.stringify(R.list)) { R.list = q.requests || []; changed = true; }
    }
    lastRefresh = Date.now();
    if (changed) {
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
    }
    if (manual) toast(changed ? '최신 내용으로 업데이트했습니다.' : '이미 최신 내용입니다.');
  } catch (e) {
    if (manual) handleError(e);
  } finally {
    refreshing = false;
    const b2 = document.querySelector('[data-act="refresh"]');
    if (b2) b2.classList.remove('spin');
  }
}

if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastRefresh > REFRESH_ON_RETURN) refreshData(false);
  });
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('focus', () => { if (Date.now() - lastRefresh > REFRESH_ON_RETURN) refreshData(false); });
}
setInterval(() => {
  if (typeof document === 'undefined' || document.visibilityState !== 'hidden') refreshData(false);
}, REFRESH_EVERY);

if (MODE === 'mock' && !getToken() && Mock._db().users.length) setToken(Mock._tokenFor('lead@example.com'));
boot();
</script>
