/** 검색 목록에 보일 이름 — 동명이인이면 '이름 · 파트' */
const personLabel = (u, list) => (list.filter((x) => x.name === u.name).length > 1 ? `${u.name} · ${u.part || 'PM'}` : u.name);
/** 이름 검색: 목록에서 고르거나 이름을 정확히 입력하면 그 사람 일정 전체로 (일부만 입력하면 하나뿐일 때 선택) */
function pickBySearch(text, exactOnly) {
  const q = String(text || '').trim();
  if (!q) return;
  const part = canSeeAll() ? ui.part : S.me.part;
  const people = S.users.filter((u) => !part || u.part === part);
  let hit = people.filter((u) => personLabel(u, people) === q);
  if (!hit.length && !exactOnly) hit = people.filter((u) => u.name.includes(q));
  if (hit.length === 1) { ui.allFilter = { member: hit[0].email, month: '', warnOnly: false }; render(); window.scrollTo(0, 0); }
  else if (!exactOnly) toast(hit.length ? `'${q}' 이름이 ${hit.length}명입니다. 목록에서 골라 주세요.` : `'${q}' 이름의 직원이 없습니다.`, true);
}

function viewAll() {
  const f = ui.allFilter, today = todayStr(), year = today.slice(0, 4);
  const part = canSeeAll() ? ui.part : S.me.part;
  // 휴가 사용 현황(개수)은 PM 전체, PL은 자기 파트만, '전체 일정 조회' 권한자는 DS직원이 아닌 사람만 (서버가 usage 표시)
  const extOnly = !isAdmin() && !isPL() && !!S.me.viewAll;
  const usagePart = isAdmin() ? part : isPL() ? S.me.part : extOnly ? part || '' : null;
  const usagePeople = usagePart === null ? [] : S.users.filter((u) => (!usagePart || u.part === usagePart) && (!extOnly || u.usage));
  const showAnnual = isAdmin() || extOnly;
  const people = S.users.filter((u) => !part || u.part === part);
  let list = scoped().slice();
  if (f.member) list = list.filter((l) => l.email === f.member);
  // 한 사람을 고르면 지난 일정까지 모두 (예정 → 지난 순), 아니면 예정된 일정 또는 고른 달
  const personAll = !!f.member && !f.month;
  if (f.month) list = list.filter((l) => l.startDate.slice(0, 7) <= f.month && f.month <= l.endDate.slice(0, 7));
  else if (!personAll) list = list.filter((l) => l.endDate >= today);
  if (f.warnOnly) list = list.filter((l) => conflictsOf(l).length);
  list.sort((a, b) => a.startDate.localeCompare(b.startDate) || nameOf(a.email).localeCompare(nameOf(b.email)));
  const listHtml = (ls) => (ls.length ? ls.map((l) => leaveItem(l, { showName: true })).join('') : '<div class="card empty">해당하는 일정이 없습니다.</div>');
  let personHtml = '';
  if (personAll) {
    const coming = list.filter((l) => l.endDate >= today);
    const past = list.filter((l) => l.endDate < today).reverse();
    const pu = S.users.find((u) => u.email === f.member) || { email: f.member, name: nameOf(f.member) };
    const an = annualOf(f.member, pu.annual || (f.member === S.me.email ? S.me.annual : null), year);
    personHtml = `<div class="infobox" style="margin:0 0 12px"><b>${esc(pu.name)}</b> · ${year}년 연차 사용 ${an.used}일 (예정 포함)${an.granted !== null ? ` · 부여 ${an.granted}일 <span class="muted small">(${esc(annualBreak(an))})</span> · <b>남은 휴가 ${an.left}일</b>` : ''}
      <span class="muted small"> · 지난 일정 포함 전체 ${list.length}건</span>${an.granted !== null ? grantsHtml(an) : ''}</div>
      <div class="section-title" style="margin-top:0">예정된 일정 <span class="muted small">${coming.length}건</span></div><div class="list">${listHtml(coming)}</div>
      <div class="section-title">지난 일정 <span class="muted small">${past.length}건 · 최근 순${isAdmin() ? ' · PM은 지난 일정도 수정할 수 있어요' : ''}</span></div><div class="list">${listHtml(past)}</div>`;
  }

  // 사용 현황: 사람마다 숫자를 먼저 계산 → 제목 칸을 누르면 그 기준으로 정렬 (다시 누르면 반대로)
  const usage = usagePeople.map((u) => {
    const ls = S.leaves.filter((l) => l.email === u.email && l.startDate.startsWith(year));
    const sum = (pred) => ls.filter(pred).reduce((s, l) => s + workdays(l), 0);
    const an = annualOf(u.email, u.annual, year);
    return { u, an, name: u.name, annual: sum((l) => l.type === '연차'), half: sum((l) => HALF[l.type]), total: sum((l) => l.type === '연차' || HALF[l.type]),
      sick: sum((l) => l.type === '병가'), edu: sum((l) => l.type === '연수/교육'), etc: sum((l) => l.type === '기타'), granted: an.granted, left: an.left };
  });
  const us = ui.usageSort;
  usage.sort((a, b) => {
    if (us.key === 'name') return (us.dir === 'asc' ? 1 : -1) * a.name.localeCompare(b.name);
    const x = a[us.key], y = b[us.key];
    if (x === null || y === null) return x === y ? a.name.localeCompare(b.name) : x === null ? 1 : -1; // 입력 안 한 사람(-)은 항상 아래
    return (us.dir === 'asc' ? x - y : y - x) || a.name.localeCompare(b.name);
  });
  const rows = usage.map(({ u, an, annual, half, total, sick, edu, etc }) => `<tr><td><span class="plink" data-act="pickMember" data-v="${esc(u.email)}" title="${esc(u.name)}님 일정 전체 보기">${esc(u.name)}</span>${isAdmin() && u.part ? ` <span class="muted small">${esc(u.part)}</span>` : ''}</td>
      <td class="num">${annual}</td>
      <td class="num">${half}</td>
      <td class="num"><b>${total}</b></td>
      <td class="num">${sick}</td>
      <td class="num">${edu}</td>
      <td class="num">${etc}</td>${showAnnual
        ? `<td class="num">${an.granted === null ? '<span class="muted">-</span>' : `<span title="${esc(annualBreak(an) + (an.kinds.내역.length ? '\n' + an.kinds.내역.map(grantText).join('\n') : ''))}">${an.granted}</span>`}</td><td class="num">${an.left === null ? '<span class="muted">-</span>' : an.left < 0 ? `<b style="color:var(--danger)">${an.left}</b>` : `<b>${an.left}</b>`}</td>`
        : ''}</tr>`).join('');
  const th = (key, label, num = true) => `<th class="${num ? 'num ' : ''}sortable${us.key === key ? ' on' : ''}" data-act="usageSort" data-v="${key}" title="눌러서 정렬">${label}${us.key === key ? (us.dir === 'asc' ? ' ▲' : ' ▼') : ''}</th>`;

  return `
    <div class="filters">
      ${canSeeAll() ? partSelect() : ''}
      <input type="search" class="people-search" data-act="psearch" list="people-dl" placeholder="이름 검색" aria-label="이름으로 사람 찾기" autocomplete="off">
      <datalist id="people-dl">${people.map((u) => `<option value="${esc(personLabel(u, people))}"></option>`).join('')}</datalist>
      <select data-act="filter" data-k="member"><option value="">${part ? esc(part) + ' 전체' : '전체 팀원'}</option>
        ${people.map((u) => `<option value="${esc(u.email)}" ${f.member === u.email ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>
      <input type="month" data-act="filter" data-k="month" value="${f.month}">
      ${f.month ? `<button class="btn sm ghost" data-act="clearMonth">${f.member ? '전체 기간 보기' : '예정 일정 보기'}</button>` : `<span class="muted small">${f.member ? '지난 일정 포함 전체 표시 중' : '예정된 일정 표시 중 · 사람을 고르면 지난 일정까지 보여요'}</span>`}
      <label class="toggle"><input type="checkbox" data-act="filter" data-k="warnOnly" ${f.warnOnly ? 'checked' : ''}> 겹침 경고만</label>
      <span style="flex:1"></span>
      ${isAdmin() ? '<button class="btn" data-act="bulkLeaves">휴가 일괄 등록</button><button class="btn primary" data-act="newLeave">+ 대리 등록</button>' : ''}
    </div>
    ${isAdmin() ? '' : `<div class="infobox" style="margin:0 0 12px">${canSeeAll() ? '전체 직원' : esc(part) + ' 파트원'}의 일정을 볼 수 있습니다. 수정·삭제는 본인(지나지 않은 일정) 또는 PM만 할 수 있습니다.</div>`}
    ${personAll ? personHtml : `<div class="list">${listHtml(list)}</div>`}
    ${usagePart === null ? '' : `<div class="section-title"><span>${year}년 ${usagePart ? esc(usagePart) + ' 파트 ' : extOnly ? '휴가 ' : '팀원별 '}사용 현황 <span class="muted small">(주말·공휴일 제외 일수, 예정 포함 · 이름을 누르면 그 사람 일정 전체)</span></span>
      ${isAdmin() ? '<button class="btn sm" data-act="annualForm">휴가 일수 입력</button>' : ''}</div>
    <div class="card table-wrap"><table>
      <thead><tr>${th('name', '이름', false)}${th('annual', '연차')}${th('half', '반차·반반차')}${th('total', '연차 합계')}${th('sick', '병가')}${th('edu', '연수/교육')}${th('etc', '기타')}${showAnnual ? th('granted', '부여 합계') + th('left', '남은 휴가') : ''}</tr></thead>
      <tbody>${rows || `<tr><td colspan="9" class="muted">${extOnly ? 'DS직원이 아닌 직원이 없습니다.' : '직원이 없습니다.'}</td></tr>`}</tbody></table></div>`}`;
}

/* ---------- 휴가 일수 입력 (PM) — 일반휴가는 표에서, 특별·대체휴가는 사람별 부여 내역 ---------- */
function openAnnualForm(year, draft) {
  const thisYear = Number(todayStr().slice(0, 4));
  year = String(year || thisYear);
  draft = draft || {}; // 내역 창에 다녀오는 동안 표에 입력하던 일반휴가 값
  const people = S.users.slice().sort((a, b) => (a.part || '').localeCompare(b.part || '') || a.name.localeCompare(b.name));
  const cur = (u) => { const an = annualOf(u.email, u.annual, year); return typeof an.kinds.일반휴가 === 'number' ? String(an.kinds.일반휴가) : ''; };
  const m = openModal(`<header><h3>휴가 일수 입력</h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content">
      <div class="filters" style="margin-bottom:8px">
        <select data-year>${[thisYear, thisYear + 1].map((y) => `<option ${String(y) === year ? 'selected' : ''}>${y}</option>`).join('')}</select>
        <span class="muted small">년 부여 일수 (0.25일 단위, 비우면 없음)</span>
      </div>
      <div class="infobox" style="margin:0 0 10px">남은 휴가 = 일반휴가 + 특별휴가 + 대체휴가 − 사용(연차·반차, 예정 포함). 본인과 PM만 볼 수 있고 참고용입니다.<br>
        <span class="muted small">특별휴가 · 대체휴가는 생길 때마다 [내역]에서 한 줄씩 추가하세요 (생긴 날 · 일수 · 사유). 합계는 자동으로 계산돼요.</span></div>
      <div class="card table-wrap"><table>
        <thead><tr><th>이름</th><th class="num">사용</th><th class="num">일반휴가</th><th class="num">특별휴가</th><th class="num">대체휴가</th><th></th></tr></thead>
        <tbody>${people.map((u) => {
          const an = annualOf(u.email, u.annual, year);
          const n = an.kinds.내역.length;
          return `<tr><td style="white-space:nowrap">${esc(u.name)} <span class="muted small">${esc(u.part || 'PM')}</span></td>
          <td class="num">${an.used}</td>
          <td class="num"><input type="number" min="0" max="60" step="0.25" inputmode="decimal" data-email="${esc(u.email)}" value="${esc(u.email in draft ? draft[u.email] : cur(u))}" class="num-input"></td>
          <td class="num">${typeof an.kinds.특별휴가 === 'number' ? an.kinds.특별휴가 : '<span class="muted">-</span>'}</td>
          <td class="num">${typeof an.kinds.대체휴가 === 'number' ? an.kinds.대체휴가 : '<span class="muted">-</span>'}</td>
          <td><button class="btn sm" data-grants="${esc(u.email)}">내역${n ? ` ${n}` : ''}</button></td></tr>`;
        }).join('')}
        </tbody></table></div>
    </div>
    <footer><span class="spacer"></span><button class="btn primary" data-save>일반휴가 저장</button></footer>`);
  const changed = () => {
    const days = {};
    m.querySelectorAll('input[data-email]').forEach((i) => {
      const u = S.users.find((x) => x.email === i.dataset.email);
      if (u && i.value.trim() !== cur(u)) days[u.email] = i.value.trim();
    });
    return days;
  };
  m.querySelector('[data-year]').onchange = (e) => openAnnualForm(e.target.value);
  m.querySelectorAll('[data-grants]').forEach((b) => (b.onclick = () => openGrantForm(year, b.dataset.grants, changed())));
  m.querySelector('[data-save]').onclick = () => {
    const days = changed();
    if (!Object.keys(days).length) { closeModal(); return; }
    run(api('setAnnualDays', year, days), `${year}년 일반휴가 일수를 저장했습니다.`);
  };
  m.querySelector('.modal').classList.add('wide');
}

/** 한 사람의 특별·대체휴가 부여 내역 (생긴 날 · 일수 · 사유) — 저장하면 휴가 일수 입력 표로 돌아감 */
function openGrantForm(year, email, draft) {
  const u = S.users.find((x) => x.email === email);
  const an = annualOf(email, u.annual, year);
  const rows = an.kinds.내역.map((g) => ({ ...g }));
  const back = () => openAnnualForm(year, draft);
  const m = openModal(`<header><h3>${esc(u.name)} · ${year}년 특별 · 대체휴가 내역</h3><button class="btn ghost sm" data-back>← 표로</button></header>
    <div class="content"><div class="infobox" style="margin:0 0 10px">휴가가 생길 때마다 한 줄씩 추가하세요. 예: 대체휴가 · 10/1 · 1일 · 9/20 주말 근무<br>
      <span class="muted small">사유는 본인과 PM에게만 보여요.</span></div>
      <div data-rows></div>
      <button class="btn sm" data-add style="margin-top:8px">+ 한 줄 추가</button>
      <div data-sum class="muted small" style="margin-top:10px"></div></div>
    <footer><button class="btn" data-back>취소</button><span class="spacer"></span><button class="btn primary" data-save>저장</button></footer>`);
  m.querySelector('.modal').classList.add('wide');
  const box = m.querySelector('[data-rows]');
  const draw = () => {
    box.innerHTML = rows.length ? rows.map((g, i) => `<div class="grant-row" data-i="${i}">
      <select data-f="kind">${GRANT_KINDS.map((k) => `<option ${g.kind === k ? 'selected' : ''}>${k}</option>`).join('')}</select>
      <input type="date" data-f="date" value="${esc(g.date || '')}" aria-label="생긴 날">
      <input type="number" data-f="days" min="0.25" max="30" step="0.25" inputmode="decimal" value="${esc(String(g.days))}" class="num-input" aria-label="일수">
      <input data-f="note" maxlength="50" placeholder="사유 (예: 9/20 주말 근무)" value="${esc(g.note || '')}">
      <button class="btn sm danger" data-del="${i}" aria-label="삭제">✕</button></div>`).join('') : '<div class="card empty">내역이 없습니다. [+ 한 줄 추가]를 누르세요.</div>';
    const sum = (k) => rows.filter((g) => g.kind === k).reduce((s2, g) => s2 + (Number(g.days) || 0), 0);
    m.querySelector('[data-sum]').textContent = `합계: 특별휴가 ${sum('특별휴가')}일 · 대체휴가 ${sum('대체휴가')}일`;
    box.querySelectorAll('[data-f]').forEach((el) => (el.oninput = el.onchange = () => {
      const g = rows[+el.closest('[data-i]').dataset.i];
      g[el.dataset.f] = el.value;
      if (el.dataset.f === 'days' || el.dataset.f === 'kind') m.querySelector('[data-sum]').textContent = `합계: 특별휴가 ${sum('특별휴가')}일 · 대체휴가 ${sum('대체휴가')}일`;
    }));
    box.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => { rows.splice(+b.dataset.del, 1); draw(); }));
  };
  draw();
  m.querySelector('[data-add]').onclick = () => { rows.push({ kind: '대체휴가', date: todayStr(), days: 1, note: '' }); draw(); };
  m.querySelectorAll('[data-back]').forEach((b) => (b.onclick = back));
  m.querySelector('[data-save]').onclick = () => {
    const list = rows.map((g) => ({ kind: g.kind, date: g.date || '', days: Number(g.days), note: (g.note || '').trim() }));
    const bad = list.findIndex((g) => !(g.days > 0));
    if (bad >= 0) return toast(`${bad + 1}번째 줄: 일수를 입력하세요.`, true);
    run(api('setAnnualGrants', year, email, list), `${u.name}님 ${year}년 내역을 저장했습니다.`, back);
  };
}

/* ---------- 새 소식 (전 직원) ---------- */

  const n = (S.news && S.news.unread) || 0;
  return `<button class="icon-btn ghost-btn bell" data-act="news" title="새 소식" aria-label="새 소식${n ? ' ' + n + '개' : ''}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    ${n ? `<span class="nbadge">${n > 9 ? '9+' : n}</span>` : newGuide() ? '<span class="ndot"></span>' : ''}</button>`;
}

/** 식권(PAYCO) 본인 신청 승인 — Cloudflare 서버(/api, functions/api.js)에서만 동작 */
const MEAL_ON = MODE === 'api' && /\.pages\.dev$/.test(location.hostname);
function mealButton() {
  if (!MEAL_ON || !S.me.ds) return ''; // DS직원만 (PM이 팀원 관리에서 체크)
  return `<button class="icon-btn ghost-btn meal" data-act="meal" title="식권 승인" aria-label="식권 승인">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a3 3 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a3 3 0 0 0 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/><path d="M14 5v2"/><path d="M14 11v2"/><path d="M14 17v2"/></svg></button>`;
}
/** 내 대기 신청을 먼저 조회해서 보여주고, 확인하면 승인 */
async function approveMeal() {
  loading(true);
  let r;
  try {
    r = await api('checkMeal');
  } catch (e) {
    return handleError(e);
  } finally {
    loading(false);
  }
  if (!r.pending.length) {
    openModal(`<header><h3>식권 승인</h3><button class="btn ghost sm" data-close>닫기</button></header>
      <div class="content"><p>${esc(r.message)}</p></div>`);
    return;
  }
  const ok = await confirmBox('식권 승인', `<p><b>${esc(S.me.name)}</b> 이름으로 승인 대기 중인 신청 ${r.pending.length}건</p>
    <ul>${r.pending.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
    <p class="muted small">본인 신청만 승인되고 다른 사람의 신청은 건드리지 않습니다.</p>`, `${r.pending.length}건 승인`);
  if (!ok) return;
  loading(true);
  try {
    const a = await api('approveMeal');
    toast(a.message, a.failed.length > 0);
  } catch (e) {
    handleError(e);
  } finally {
    loading(false);
  }
}

/** '방금' · 'N분 전' · 'N시간 전' · '10/3 14:02' */
function agoText(iso) {
  const d = new Date(iso);
  const mins = Math.floor((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return '방금';
  if (mins < 60) return `${mins}분 전`;
  if (mins < 1440) return `${Math.floor(mins / 60)}시간 전`;
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function openNews() {
  const n = S.news || { items: [], unread: 0, seenAt: '' };
  const seen = n.seenAt || '';
  openModal(`<header><h3>새 소식</h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content">
      <button class="btn" data-act="guide" style="width:100%;margin-bottom:8px">사용 안내 · 업데이트 내역 <span class="muted small">(최근 ${Number(latestUpdate().slice(5, 7))}/${Number(latestUpdate().slice(8))} 업데이트)</span>${newGuide() ? '<span class="badge new">NEW</span>' : ''}</button>
      ${IS_STANDALONE ? '' : '<button class="btn" data-act="a2hs" style="width:100%;margin-bottom:8px">홈 화면에 추가하기 <span class="muted small">(앱처럼 쓰기)</span></button>'}
      ${n.items.length ? n.items.map((x) => `<div class="news-item ${x.at > seen ? 'unread' : ''}" ${x.go ? `data-act="newsGo" data-v="${esc(x.go)}"` : ''}>
        <div class="nt">${esc(x.text)}</div><div class="when">${esc(agoText(x.at))}</div></div>`).join('') : '<div class="empty">새 소식이 없습니다.</div>'}
      <p class="muted small" style="margin:12px 0 0">나를 대직자로 지정하거나, 나에게 업무가 배정되거나, 중요 일정이 바뀌면 여기에 알려드려요. 내가 한 일은 오지 않아요.</p>
    </div>`);
  if (n.unread) {
    n.unread = 0;
    render(); // 숫자 표시 없애기 (열린 창은 그대로)
    api('markNewsRead').then((r) => { if (S && S.news) S.news.seenAt = r.seenAt || S.news.seenAt; }).catch(() => {});
  }
}

/** 소식을 누르면 해당 날짜(캘린더) 또는 탭으로 */
function goNews(go) {
  closeModal();
  const i = go.indexOf(':');
  const kind = go.slice(0, i), val = go.slice(i + 1);
  if (kind === 'day') {
    const d = parse(val);
    ui.tab = 'cal'; ui.month = new Date(d.getFullYear(), d.getMonth(), 1);
    render(); flashDate(val); // 그 날짜 칸으로 스크롤해서 잠깐 강조 (칸을 누르면 상세)
  } else if (kind === 'tab') {
    ui.tab = val; render(); window.scrollTo(0, 0);
  } else if (kind === 'draw') {
    openDrawView(val);
  }
}

/* ---------- 요청함 (도서구매 신청 · 면담 일정 취합 등 — 만들기는 PM, 응답은 대상자) ---------- */
const R = { loaded: false, loading: false, error: '', list: [] };
const REQ_TYPES = [['text', '짧은 글'], ['long', '긴 글'], ['number', '숫자'], ['link', '링크'], ['choice', '하나 고르기'], ['multi', '여러 개 고르기'], ['date', '날짜'], ['slot', '시간대 고르기 (선착순)']];
const REQ_TYPE_LABEL = Object.fromEntries(REQ_TYPES);
const REQ_TEMPLATES = {
  book: { title: '도서구매 신청', desc: '읽고 싶은 업무 관련 도서를 신청해 주세요.', shared: true, questions: [
    { id: 'q1', type: 'choice', label: '구매 여부', required: true, options: ['신청', '이번엔 안 함'] },
    ...[{ type: 'text', label: '도서명', required: true }, { type: 'link', label: '도서 링크 (온라인 서점 주소)' },
      { type: 'number', label: '가격 (원)', required: true }, { type: 'number', label: '수량', required: true }, { type: 'long', label: '신청 사유' }]
      .map((x, i) => ({ ...x, id: 'q' + (i + 2), showIf: { q: 'q1', eq: '신청' } }))] },
  meet: { title: '면담 일정 신청', desc: '편한 시간대를 골라 주세요. 고르면 업무 일정에 자동으로 등록돼요.', questions: [
    { type: 'slot', label: '면담 시간', required: true, slots: [] }, { type: 'long', label: '하고 싶은 이야기 (선택)' }] },
  attend: { title: '참석 조사', desc: '', questions: [
    { type: 'choice', label: '참석 여부', required: true, options: ['참석', '불참'] }, { type: 'text', label: '비고' }] },
};

function loadRequests(force) {
  if (R.loading || (R.loaded && !force)) return;
  R.loading = true;
  api('getRequests')
    .then((r) => { R.list = r.requests || []; R.loaded = true; R.error = ''; S.reqPending = r.pending || 0; })
    .catch((e) => { const m = (e && e.message) || String(e); if (m.indexOf('AUTH:') >= 0) return handleError(e); R.error = m; })
    .finally(() => { R.loading = false; if (screen === 'app' && ui.tab === 'requests') render(); });
}

/** 요청함 저장 결과({ requests, pending }) 반영. 면담 시간대는 업무 일정도 바뀌므로 업무 일정은 다시 불러옴 */
async function runReq(promise, okMsg, after) {
  loading(true);
  try {
    const r = await promise;
    R.list = r.requests || []; R.loaded = true; S.reqPending = r.pending || 0; stateSeq++;
    W.loaded = false;
    closeModal(); render();
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg);
    if (after) after(r);
  } catch (e) {
    handleError(e);
  } finally {
    loading(false);
  }
}

const reqDeadline = (r) => {
  const left = Math.round((parse(r.deadline) - parse(todayStr())) / 864e5);
  return `마감 ${fmtShort(r.deadline)}${r.open ? (left === 0 ? ' · 오늘 마감' : ` · D-${left}`) : ''}`;
};
const reqTargetText = (t) => (t.mode === 'parts' ? `${(t.parts || []).join(', ')} 파트` : t.mode === 'people' ? `${(t.emails || []).length}명 지정` : '전체 직원');
const slotText = (s) => `${fmtShort(s.date)} ${s.start}~${s.end}`;
/** 응답 값을 보기 좋은 글로 (표 · CSV · 공개 목록 공용) */
function reqAnswerText(q, v) {
  if (v == null || v === '' || (Array.isArray(v) && !v.length)) return '';
  if (q.type === 'multi') return v.join(', ');
  if (q.type === 'slot') { const s = (q.slots || []).find((x) => x.id === v); return s ? slotText(s) : v; }
  if (q.type === 'date') return fmtShort(v);
  if (q.type === 'number') return Number(v).toLocaleString('ko-KR');
  return String(v);
}

function viewRequests() {
  if (!R.loaded) {
    loadRequests();
    return R.error
      ? `<div class="card empty">요청함을 불러오지 못했습니다. ${esc(R.error)}<br><button class="btn sm" data-act="reloadReq" style="margin-top:8px">다시 시도</button></div>`
      : '<div class="card empty">요청함을 불러오는 중…</div>';
  }
  const todo = R.list.filter((r) => r.open && r.isTarget && !r.mine);
  const open = R.list.filter((r) => r.open && !todo.includes(r));
  const closed = R.list.filter((r) => !r.open);
  const card = (r) => {
    const status = !r.open ? '<span class="badge">마감</span>'
      : r.isTarget ? (r.mine ? '<span class="badge" style="background:var(--ok-weak,#e7f6ec);color:var(--ok,#15803d)">응답 완료</span>' : '<span class="badge" style="background:var(--danger-weak);color:var(--danger)">응답 필요</span>') : '';
    return `<div class="card item req-item" data-act="openReq" data-v="${esc(r.id)}" role="button" tabindex="0">
      <div class="body"><div class="title">${esc(r.title)} ${status}${r.shared ? ' <span class="badge">응답 공개</span>' : ''}</div>
        <div class="meta">${esc(reqDeadline(r))}${r.canManage ? ` · ${esc(reqTargetText(r.targets))} · 응답 <b>${r.responseCount}</b>/${r.targetCount}명` : ` · ${esc(r.createdByName)}`}</div>
        ${r.desc ? `<div class="muted small req-desc">${esc(r.desc)}</div>` : ''}</div></div>`;
  };
  const sec = (title, list, empty) => `<div class="section-title">${title} <span class="muted small">${list.length}건</span></div>
    <div class="list">${list.length ? list.map(card).join('') : `<div class="card empty">${empty}</div>`}</div>`;
  return `
    <div class="section-title" style="margin-top:4px"><span>요청함</span>${isAdmin() ? '<button class="btn primary" data-act="newReq">+ 새 요청</button>' : ''}</div>
    <div class="infobox" style="margin:0 0 4px">도서구매 신청 · 면담 일정 같은 취합을 여기서 받아요. 응답은 <b>본인과 PM만</b> 봐요 ('응답 공개' 요청은 대상자끼리도 보여요).</div>
    ${todo.length || !isAdmin() ? sec('응답할 요청', todo, '응답할 요청이 없습니다.') : ''}
    ${sec(isAdmin() ? '진행 중' : '응답한 요청', open, isAdmin() ? '진행 중인 요청이 없습니다.' : '진행 중인 요청이 없습니다.')}
    ${closed.length ? sec('마감', closed, '') : ''}`;
}

/** 요청 열기: 대상자는 응답 양식, PM은 관리 버튼 */
function openRequest(id) {
  const r = R.list.find((x) => x.id === id);
  if (!r) return;
  const ans = JSON.parse(JSON.stringify((r.mine && r.mine.answers) || {}));
  const can = r.isTarget && r.open;
  const field = (q) => {
    const v = ans[q.id];
    const req = q.required ? ' <span class="req">*</span>' : '';
    const dis = can ? '' : 'disabled';
    let input = '';
    if (q.type === 'text') input = `<input data-q="${q.id}" maxlength="200" value="${esc(v || '')}" ${dis}>`;
    else if (q.type === 'long') input = `<textarea data-q="${q.id}" rows="3" maxlength="1000" ${dis}>${esc(v || '')}</textarea>`;
    else if (q.type === 'number') input = `<input data-q="${q.id}" type="number" inputmode="decimal" value="${esc(v || '')}" ${dis}>`;
    else if (q.type === 'link') input = `<input data-q="${q.id}" type="url" maxlength="500" placeholder="http로 시작하는 주소" value="${esc(v || '')}" ${dis}>`;
    else if (q.type === 'date') input = `<input data-q="${q.id}" type="date" value="${esc(v || '')}" ${dis}>`;
    else if (q.type === 'choice' || q.type === 'multi') input = `<div class="seg wrap" data-qc="${q.id}">${q.options.map((o) => `<button type="button" data-o="${esc(o)}" class="${(q.type === 'multi' ? (v || []).includes(o) : v === o) ? 'on' : ''}" ${dis}>${esc(o)}</button>`).join('')}</div>`;
    else if (q.type === 'slot') {
      const byDate = {};
      q.slots.forEach((s) => (byDate[s.date] = byDate[s.date] || []).push(s));
      input = `<div data-qs="${q.id}">${Object.keys(byDate).map((d) => `<div class="slot-day"><div class="small muted">${fmtShort(d)}</div><div class="slot-grid">${byDate[d].map((s) => {
        const used = (r.slotTaken[s.id] || 0) - (r.mine && r.mine.answers[q.id] === s.id ? 1 : 0);
        const full = used >= s.cap;
        return `<button type="button" class="slot${v === s.id ? ' on' : ''}" data-s="${esc(s.id)}" ${full || !can ? 'disabled' : ''}>${s.start}~${s.end}<span>${full ? '마감' : s.cap > 1 ? `남은 ${s.cap - used}` : ''}</span></button>`;
      }).join('')}</div></div>`).join('')}</div>`;
    }
    return `<div class="field" data-qw="${q.id}"><label>${esc(q.label)}${req}</label>${input}</div>`;
  };
  // 조건부 질문: 앞 '하나 고르기' 답이 조건과 같을 때만 보임
  const shown = (qq) => !qq.showIf || ans[qq.showIf.q] === qq.showIf.eq;
  const others = r.shared && !r.canManage ? r.responses.filter((x) => x.email !== S.me.email) : [];
  const m = openModal(`<header><h3>${esc(r.title)}</h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content">
      <div class="muted small" style="margin-bottom:8px">${esc(reqDeadline(r))} · ${esc(r.createdByName)}${r.canManage ? ` · ${esc(reqTargetText(r.targets))}` : ''}</div>
      ${r.desc ? `<div class="infobox" style="margin:0 0 12px;white-space:pre-wrap">${esc(r.desc)}</div>` : ''}
      ${r.canManage ? `<div class="infobox" style="margin:0 0 12px">응답 <b>${r.responseCount}</b>/${r.targetCount}명${r.pending.length ? ` · 미응답 ${r.pending.slice(0, 5).map((p) => esc(p.name)).join(', ')}${r.pending.length > 5 ? ` 외 ${r.pending.length - 5}명` : ''}` : ''}
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn sm primary" data-rstat>현황 · 내려받기</button>
        ${r.open && r.pending.length ? '<button class="btn sm" data-rremind>미응답자에게 다시 알림</button>' : ''}</div></div>` : ''}
      ${r.isTarget ? r.questions.map(field).join('') : `<div class="muted small">질문 ${r.questions.length}개: ${r.questions.map((q) => esc(q.label)).join(', ')}</div>`}
      ${r.isTarget && !r.open ? '<div class="infobox">마감된 요청이에요.</div>' : ''}
      ${r.mine ? `<div class="muted small" style="margin-top:6px">응답 저장 ${esc(new Date(r.mine.updatedAt).toLocaleString('ko-KR'))}${can ? ' · 마감 전까지 고칠 수 있어요' : ''}</div>` : ''}
      ${others.length ? `<div class="section-title" style="margin-top:16px">다른 사람 응답 <span class="muted small">${others.length}명</span></div>${reqTable(r, others)}` : ''}
    </div>
    <footer>${r.canManage ? '<button class="btn danger" data-rdel>삭제</button><button class="btn" data-redit>수정</button>' : ''}${r.canManage ? `<button class="btn" data-rclose>${r.status === 'closed' ? '다시 열기' : '마감'}</button>` : ''}
      ${can && r.mine ? '<button class="btn" data-rcancel>응답 취소</button>' : ''}<span class="spacer"></span>
      <button class="btn" data-close>닫기</button>${can ? `<button class="btn primary" data-save>${r.mine ? '수정 저장' : '응답 제출'}</button>` : ''}</footer>`);
  const q = (sel) => m.querySelector(sel);
  m.querySelectorAll('[data-qc]').forEach((box) => {
    const qq = r.questions.find((x) => x.id === box.dataset.qc);
    box.querySelectorAll('[data-o]').forEach((b) => (b.onclick = () => {
      const o = b.dataset.o;
      if (qq.type === 'multi') { const cur = ans[qq.id] || []; ans[qq.id] = cur.includes(o) ? cur.filter((x) => x !== o) : cur.concat([o]); }
      else ans[qq.id] = ans[qq.id] === o && !qq.required ? '' : o;
      box.querySelectorAll('[data-o]').forEach((x) => x.classList.toggle('on', qq.type === 'multi' ? ans[qq.id].includes(x.dataset.o) : ans[qq.id] === x.dataset.o));
      paintCond();
    }));
  });
  const paintCond = () => r.questions.forEach((qq) => { const el = m.querySelector(`[data-qw="${qq.id}"]`); if (el) el.style.display = shown(qq) ? '' : 'none'; });
  paintCond();
  m.querySelectorAll('[data-qs]').forEach((box) => box.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => {
    const qq = r.questions.find((x) => x.id === box.dataset.qs);
    ans[qq.id] = ans[qq.id] === b.dataset.s && !qq.required ? '' : b.dataset.s;
    box.querySelectorAll('[data-s]').forEach((x) => x.classList.toggle('on', ans[qq.id] === x.dataset.s));
  })));
  if (q('[data-save]')) q('[data-save]').onclick = () => {
    m.querySelectorAll('[data-q]').forEach((el) => (ans[el.dataset.q] = el.value));
    r.questions.forEach((qq) => { if (!shown(qq)) delete ans[qq.id]; }); // 숨겨진 질문의 답은 보내지 않음
    const miss = r.questions.find((qq) => qq.required && shown(qq) && (ans[qq.id] == null || ans[qq.id] === '' || (Array.isArray(ans[qq.id]) && !ans[qq.id].length)));
    if (miss) return toast(`'${miss.label}' 항목을 ${['choice', 'multi', 'slot'].includes(miss.type) ? '고르' : '입력하'}세요.`, true);
    runReq(api('submitResponse', r.id, ans), r.mine ? '응답을 수정했습니다.' : '응답을 제출했습니다.' + (r.questions.some((x) => x.type === 'slot' && ans[x.id]) ? ' 업무 일정에 면담이 등록됐어요.' : ''));
  };
  if (q('[data-rcancel]')) q('[data-rcancel]').onclick = async () => {
    if (await confirmBox('응답 취소', `<p>${esc(r.title)} 응답을 지울까요?${r.questions.some((x) => x.type === 'slot') ? '<br><span class="muted small">고른 시간대와 면담 업무 일정도 함께 지워져요.</span>' : ''}</p>`, '응답 취소', true)) runReq(api('cancelResponse', r.id), '응답을 취소했습니다.');
  };
  if (r.canManage) {
    q('[data-rstat]').onclick = () => openRequestStatus(r.id);
    if (q('[data-rremind]')) q('[data-rremind]').onclick = () => runReq(api('remindRequest', r.id), (res) => `미응답자 ${res.reminded}명에게 알림을 보냈습니다.`, () => openRequest(r.id));
    q('[data-redit]').onclick = () => openRequestForm(r.id);
    q('[data-rclose]').onclick = () => runReq(api('setRequestStatus', r.id, r.status === 'closed' ? 'open' : 'closed'), r.status === 'closed' ? '다시 열었습니다.' : '마감했습니다.');
    q('[data-rdel]').onclick = async () => {
      if (await confirmBox('요청 삭제', `<p>${esc(r.title)}<br>응답 ${r.responses.length}건과 업무 일정의 마감 표시도 함께 지워져요.${r.questions.some((x) => x.type === 'slot') ? ' 자동 등록된 면담 업무 일정도 지워져요.' : ''} 삭제할까요?</p>`, '삭제', true)) runReq(api('deleteRequest', r.id), '삭제했습니다.');
    };
  }
}

/** 응답 표 (현황 · 공개 목록) */
function reqTable(r, rows) {
  return `<div class="card table-wrap"><table><thead><tr><th>이름</th>${r.questions.map((q) => `<th class="${q.type === 'number' ? 'num' : ''}">${esc(q.label)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((x) => `<tr><td>${esc(x.name)}${x.part ? ` <span class="muted small">${esc(x.part)}</span>` : ''}</td>${r.questions.map((q) => {
      const t = reqAnswerText(q, x.answers[q.id]);
      return `<td class="${q.type === 'number' ? 'num' : 'wrap-cell'}">${q.type === 'link' && t ? `<a href="${esc(t)}" target="_blank" rel="noopener noreferrer">링크</a>` : esc(t)}</td>`;
    }).join('')}</tr>`).join('')}</tbody>
    ${r.questions.some((q) => q.type === 'number') ? `<tfoot><tr><th>합계</th>${r.questions.map((q) => `<th class="num">${q.type === 'number' ? rows.reduce((s, x) => s + (Number(x.answers[q.id]) || 0), 0).toLocaleString('ko-KR') : ''}</th>`).join('')}</tr></tfoot>` : ''}</table></div>`;
}

/** PM: 응답 현황 표 + 미응답자 + CSV 내려받기 */
function openRequestStatus(id) {
  const r = R.list.find((x) => x.id === id);
  if (!r) return;
  const rows = r.responses.slice().sort((a, b) => a.name.localeCompare(b.name));
  const m = openModal(`<header><h3>${esc(r.title)} · 응답 현황</h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content">
      <div class="muted small" style="margin-bottom:8px">응답 ${r.responseCount}/${r.targetCount}명 · ${esc(reqDeadline(r))}</div>
      ${rows.length ? reqTable(r, rows) : '<div class="card empty">아직 응답이 없습니다.</div>'}
      ${r.pending.length ? `<div class="section-title" style="margin-top:14px">미응답 <span class="muted small">${r.pending.length}명</span></div><div class="small">${r.pending.map((p) => esc(p.name)).join(', ')}</div>` : ''}
    </div>
    <footer><span class="spacer"></span><button class="btn" data-back>뒤로</button><button class="btn primary" data-csv ${rows.length ? '' : 'disabled'}>엑셀(CSV) 내려받기</button></footer>`);
  m.querySelector('.modal').classList.add('wide');
  m.querySelector('[data-back]').onclick = () => openRequest(id);
  m.querySelector('[data-csv]').onclick = () => {
    const cell = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
    const head = ['이름', '파트', ...r.questions.map((q) => q.label), '응답 시각'];
    const body = rows.map((x) => [x.name, x.part, ...r.questions.map((q) => (q.type === 'number' ? x.answers[q.id] || '' : reqAnswerText(q, x.answers[q.id]))), new Date(x.updatedAt).toLocaleString('ko-KR')]);
    const pend = r.pending.map((p) => [p.name, p.part, ...r.questions.map(() => ''), '미응답']);
    const text = String.fromCharCode(0xfeff) + [head, ...body, ...pend].map((row) => row.map(cell).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: `${r.title.replace(/[\\/:*?"<>|]/g, '')}_${todayStr()}.csv` });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  };
}

/** PM: 요청 만들기 · 수정. 응답이 있으면 질문은 잠김 (제목 · 설명 · 마감일 · 대상 · 공개는 수정 가능) */
function openRequestForm(id, tplKey) {
  const ex = id ? R.list.find((x) => x.id === id) : null;
  const tpl = tplKey ? REQ_TEMPLATES[tplKey] : null;
  const src = ex || tpl || { title: '', desc: '', questions: [{ type: 'text', label: '', required: true }] };
  const f = {
    title: src.title, desc: src.desc || '', deadline: ex ? ex.deadline : ymd(addDays(parse(todayStr()), 7)), shared: !!src.shared,
    targets: ex ? JSON.parse(JSON.stringify(ex.targets)) : { mode: 'all', parts: [], emails: [] },
    questions: JSON.parse(JSON.stringify(src.questions)).map((q, i) => ({ ...q, id: q.id || 'q' + (i + 1), options: q.options || [], slots: q.slots || [] })),
  };
  f.targets.parts = f.targets.parts || []; f.targets.emails = f.targets.emails || [];

      <div class="field"><label>제목 <span class="req">*</span></label><input name="title" maxlength="60" value="${esc(f.title)}" placeholder="예: 11월 도서구매 신청"></div>
      <div class="field"><label>설명</label><textarea name="desc" rows="2" maxlength="500" placeholder="예: 1인 3만원 이내, 업무 관련 도서">${esc(f.desc)}</textarea></div>

  m.querySelector('.modal').classList.add('wide');

  m.querySelectorAll('[data-tpl]').forEach((b) => (b.onclick = () => openRequestForm(null, b.dataset.tpl)));
  // 대상
  const peopleBox = q('[data-tpeople]');
  const nonTester = S.users.filter((u) => !isTester(u));
  const paintTargets = () => {
    const t = f.targets;
    m.querySelectorAll('[data-tm]').forEach((b) => b.classList.toggle('on', b.dataset.tm === t.mode));
    q('[data-tparts]').style.display = t.mode === 'parts' ? '' : 'none';

    const n = t.mode === 'all' ? nonTester.filter((u) => u.email !== S.me.email).length : t.mode === 'parts' ? nonTester.filter((u) => t.parts.includes(u.part || (u.role === 'pm' ? 'PM' : ''))).length : t.emails.length;
    q('[data-tinfo]').textContent = `대상 ${n}명${t.mode === 'all' ? ' (테스터 · 나 제외)' : t.mode === 'parts' ? ' (테스터 제외)' : ''}`;
  };

  m.querySelectorAll('[data-tp]').forEach((b) => (b.onclick = () => {

  renderAssignees(peopleBox, f.targets.emails, '', paintTargets, 200);

  const condKey = (c) => c.q + '#' + c.eq;
  const condOpts = (i) => f.questions.slice(0, i).filter((x) => x.type === 'choice' && x.options.length)

    box.innerHTML = f.questions.map((qq, i) => `<div class="card q-edit" data-qi="${i}">

        <div style="display:flex;gap:6px;align-items:center;justify-content:flex-end"><label class="toggle"><input type="checkbox" data-k="required" ${qq.required ? 'checked' : ''} ${locked ? 'disabled' : ''}> 필수</label>
        ${locked ? '' : `<button type="button" class="btn sm ghost" data-mv="-1" ${i ? '' : 'disabled'} aria-label="위로">▲</button><button type="button" class="btn sm ghost" data-mv="1" ${i < f.questions.length - 1 ? '' : 'disabled'} aria-label="아래로">▼</button><button type="button" class="btn sm ghost" data-qdel aria-label="질문 삭제">✕</button>`}</div></div>
      <div class="field" style="margin:8px 0 0"><input data-k="label" maxlength="100" value="${esc(qq.label)}" placeholder="질문 내용 (예: 도서명)" ${locked ? 'disabled' : ''}></div>
      ${qq.type === 'choice' || qq.type === 'multi' ? `<div class="field" style="margin:8px 0 0"><textarea data-k="options" rows="3" placeholder="보기를 한 줄에 하나씩" ${locked ? 'disabled' : ''}>${esc(qq.options.join('\n'))}</textarea></div>` : ''}
      ${qq.type === 'slot' ? slotEditor(qq, locked) : ''}
      ${condOpts(i).length ? `<div class="field" style="margin:8px 0 0"><select data-k="cond" ${locked ? 'disabled' : ''}><option value="">항상 보이기</option>${condOpts(i).map(([v, t]) => `<option value="${esc(v)}" ${qq.showIf && v === condKey(qq.showIf) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>` : ''}</div>`).join('');
    box.querySelectorAll('[data-qi]').forEach((el) => {
      const qq = f.questions[+el.dataset.qi];
      const k = (n) => el.querySelector(`[data-k="${n}"]`);
      k('type').onchange = (e) => { qq.type = e.target.value; paintQs(); };
      k('required').onchange = (e) => (qq.required = e.target.checked);
      if (k('cond')) k('cond').onchange = (e) => { const v = e.target.value, j = v.indexOf('#'); if (v) qq.showIf = { q: v.slice(0, j), eq: v.slice(j + 1) }; else delete qq.showIf; };
      k('label').oninput = (e) => (qq.label = e.target.value);
      if (k('options')) {
        k('options').oninput = (e) => (qq.options = e.target.value.split('\n').map((x) => x.trim()).filter(Boolean));
        k('options').onchange = paintQs; // 보기가 바뀌면 뒤 질문의 조건 목록도 갱신
      }
      if (qq.type === 'choice') k('label').onchange = paintQs; // 뒤 질문의 조건 목록에 이 질문 제목이 보이므로
      el.querySelectorAll('[data-mv]').forEach((b) => (b.onclick = () => {
        const i = +el.dataset.qi, j = i + +b.dataset.mv;
        [f.questions[i], f.questions[j]] = [f.questions[j], f.questions[i]]; paintQs();
      }));
      if (el.querySelector('[data-qdel]')) el.querySelector('[data-qdel]').onclick = () => { f.questions.splice(+el.dataset.qi, 1); paintQs(); };
      if (qq.type === 'slot' && !locked) bindSlotEditor(el, qq, paintQs);
    });
  };
  paintQs();
  if (q('[data-qadd]')) q('[data-qadd]').onclick = () => {
    const n = f.questions.reduce((mx, x) => Math.max(mx, +(String(x.id).match(/\d+/) || [0])[0]), 0) + 1;
    f.questions.push({ id: 'q' + n, type: 'text', label: '', required: false, options: [], slots: [] }); paintQs();
  };
  q('[data-save]').onclick = () => {

    const qs = f.questions.map((x) => ({ id: x.id, type: x.type, label: x.label, required: !!x.required, ...(x.showIf ? { showIf: x.showIf } : {}),

  };
}

/** 시간대 질문 편집: 기간 · 시각 · 간격 · 정원으로 한 번에 만들고, 하나씩 지울 수 있음 */
function slotEditor(qq, locked) {
  const byDate = {};
  qq.slots.forEach((s) => (byDate[s.date] = byDate[s.date] || []).push(s));
  const d0 = ymd(addDays(parse(todayStr()), 7));
  return `<div class="slot-edit">
    ${locked ? '' : `<div class="row2" style="margin-top:8px"><div class="field" style="margin:0"><label>시작일</label><input type="date" data-sg="from" value="${d0}"></div><div class="field" style="margin:0"><label>종료일</label><input type="date" data-sg="to" value="${ymd(addDays(parse(d0), 4))}"></div></div>
    <div class="row2" style="margin-top:8px"><div class="field" style="margin:0"><label>시작 시각</label><input type="time" data-sg="start" value="14:00" step="600"></div><div class="field" style="margin:0"><label>끝 시각</label><input type="time" data-sg="end" value="17:00" step="600"></div></div>
    <div class="row2" style="margin-top:8px"><div class="field" style="margin:0"><label>한 칸 (분)</label><select data-sg="min">${[15, 20, 30, 40, 60].map((n) => `<option ${n === 30 ? 'selected' : ''}>${n}</option>`).join('')}</select></div><div class="field" style="margin:0"><label>칸당 정원</label><input type="number" data-sg="cap" value="1" min="1" max="50"></div></div>
    <div style="display:flex;gap:6px;margin-top:8px;align-items:center"><button type="button" class="btn sm" data-sgo>시간대 만들기</button><span class="muted small">주말 · 공휴일은 빼고 만들어요</span>${qq.slots.length ? '<span class="spacer" style="flex:1"></span><button type="button" class="btn sm ghost" data-sclear>모두 지우기</button>' : ''}</div>`}
    <div class="muted small" style="margin-top:8px">시간대 ${qq.slots.length}개</div>
    ${Object.keys(byDate).sort().map((d) => `<div class="slot-day"><div class="small muted">${fmtShort(d)}</div><div class="slot-grid">${byDate[d].map((s) => `<span class="slot on">${s.start}~${s.end}${s.cap > 1 ? `<span>${s.cap}명</span>` : ''}${locked ? '' : `<button type="button" data-sdel="${esc(s.date + ' ' + s.start)}" aria-label="지우기">✕</button>`}</span>`).join('')}</div></div>`).join('')}
  </div>`;
}

function bindSlotEditor(el, qq, repaint) {
  const g = (k) => el.querySelector(`[data-sg="${k}"]`);
  const go = el.querySelector('[data-sgo]');
  if (go) go.onclick = () => {
    const from = g('from').value, to = g('to').value, st = g('start').value, en = g('end').value;
    const step = +g('min').value, cap = Math.max(1, Math.min(50, +g('cap').value || 1));
    if (!from || !to || to < from || !st || !en || en <= st) return toast('기간과 시각을 확인하세요.', true);
    const mins = (t) => +t.slice(0, 2) * 60 + +t.slice(3, 5);
    const hm = (n) => `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`;
    const have = new Set(qq.slots.map((s) => s.date + ' ' + s.start));
    let added = 0;
    for (let d = parse(from); ymd(d) <= to; d = addDays(d, 1)) {
      const ds = ymd(d);
      if (d.getDay() === 0 || d.getDay() === 6 || D.holidays[ds]) continue;
      for (let t = mins(st); t + step <= mins(en); t += step) {
        if (have.has(ds + ' ' + hm(t))) continue;
        qq.slots.push({ date: ds, start: hm(t), end: hm(t + step), cap }); added++;
      }
    }
    qq.slots.sort((a, b) => (a.date + a.start < b.date + b.start ? -1 : 1));
    if (qq.slots.length > 200) { qq.slots = qq.slots.slice(0, 200); toast('시간대는 200개까지만 만들 수 있어요.', true); }
    else if (!added) toast('새로 만들 시간대가 없어요.', true);
    repaint();
  };
  el.querySelectorAll('[data-sdel]').forEach((b) => (b.onclick = () => { qq.slots = qq.slots.filter((s) => s.date + ' ' + s.start !== b.dataset.sdel); repaint(); }));
  const clr = el.querySelector('[data-sclear]');
  if (clr) clr.onclick = () => { qq.slots = []; repaint(); };
}

/* ---------- 1시간 조기퇴근권 (PM만 기록 · 조회, 한 사람 한 달에 1번) ---------- */
const E = { loaded: false, loading: false, error: '', items: [], year: new Date().getFullYear() };
function loadEarly() {
  if (E.loading) return;
  E.loading = true;
  api('getEarly')
    .then((r) => { E.items = r.items || []; E.loaded = true; E.error = ''; })
    .catch((e) => { const m = (e && e.message) || String(e); if (m.indexOf('AUTH:') >= 0) return handleError(e); E.error = m; })
    .finally(() => { E.loading = false; if (screen === 'app' && ui.tab === 'early') render(); });
}
async function runEarly(promise, okMsg) {
  loading(true);
  try { const r = await promise; E.items = r.items || []; E.loaded = true; closeModal(); render(); toast(okMsg); }
  catch (e) { handleError(e); }
  finally { loading(false); }
}
const earlyPeople = () => S.users.filter((u) => !isTester(u)).slice().sort((a, b) => {
  const pa = drawPart(a) || '힣', pb = drawPart(b) || '힣';

    if (!E.error) loadEarly();

      <thead><tr><th class="nm">직원</th>${months.map((m) => `<th class="${m === thisYm ? 'now' : ''}">${Number(m.slice(5))}월</th>`).join('')}<th>합계</th></tr></thead>

function openEarlyForm(id, preset) {

    .catch((e) => { HX.error = (e && e.message) || '변경 이력을 불러오지 못했습니다.'; })

/** 마지막 백업 시각 (DB → 스프레드시트, 1시간마다). 3시간 넘게 없으면 경고 */
const BK = { loaded: false, loading: false, at: '' };
function backupBox() {
  if (MODE !== 'api' || !USE_PROXY) return ''; // DB를 쓰는 주소에서만
  if (!BK.loaded && !BK.loading) {
    BK.loading = true;
    api('getBackupInfo').then((r) => { BK.at = r.lastBackupAt || ''; }).catch(() => {}).finally(() => { BK.loaded = true; BK.loading = false; if (ui.tab === 'members') render(); });
  }
  if (!BK.loaded) return '<div class="infobox" style="margin:8px 0 0">스프레드시트 백업 상태 확인 중…</div>';
  if (!BK.at) return '<div class="warnbox" style="margin:8px 0 0">스프레드시트 백업 기록이 없습니다. Apps Script에서 setupBackup을 한 번 실행해 주세요.</div>';
  const d = new Date(BK.at);
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  const ago = mins < 60 ? `${mins}분 전` : mins < 1440 ? `${Math.floor(mins / 60)}시간 전` : `${Math.floor(mins / 1440)}일 전`;
  const text = `마지막 스프레드시트 백업: ${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())} (${ago}) · 1시간마다 자동`;
  return mins > 180 ? `<div class="warnbox" style="margin:8px 0 0">⚠ ${text} — 백업이 3시간 넘게 되지 않았습니다.</div>` : `<div class="infobox" style="margin:8px 0 0">${text}</div>`;
}

   모달
   ========================================================= */
let $modal = null, onDismiss = null;
/** 메모 칸: 글이 길어지면 칸이 같이 커지고(화면 60%까지), 아래에 글자 수 */
function growArea(ta) {
  const cnt = document.createElement('div');
  cnt.className = 'muted small memo-count';
  ta.after(cnt);
  const fit = () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight + 2, window.innerHeight * 0.6) + 'px';
    cnt.textContent = ta.value.length > 200 ? `${ta.value.length.toLocaleString()} / ${ta.maxLength.toLocaleString()}자` : '';
  };
  ta.addEventListener('input', fit);
  requestAnimationFrame(fit);
}
/** 목록의 긴 메모는 4줄까지만 보이고 '더 보기'로 펼침 */
function memoBlock(memo, cls = 'meta') {
  const long = memo.length > 160 || memo.split('\n').length > 4;
  return `<div class="${cls}${long ? ' memo-clamp' : ''}" style="white-space:pre-wrap">${esc(memo)}</div>${long ? '<button type="button" class="memo-more" data-act="memoMore">더 보기</button>' : ''}`;
}
function openModal(html, dismiss) {
  closeModal();
  $modal = document.createElement('div');
  $modal.className = 'overlay';
  $modal.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  $modal.addEventListener('mousedown', (e) => { if (e.target === $modal) dismissModal(); });
  document.body.appendChild($modal);
  onDismiss = dismiss || null;
  $modal.querySelectorAll('[data-close]').forEach((b) => (b.onclick = dismissModal));
  $modal.querySelectorAll('textarea[data-grow]').forEach(growArea);
  return $modal;
}
function closeModal() {
  if ($modal) { $modal.remove(); $modal = null; }
  onDismiss = null;
}
/** 바깥 클릭 / ESC / 닫기 — 확인창이면 '취소'로 처리 */
function dismissModal() { const cb = onDismiss; closeModal(); if (cb) cb(); }

function confirmBox(title, body, okLabel = '확인', danger = false) {
  return new Promise((resolve) => {
    const m = openModal(`<header><h3>${esc(title)}</h3></header><div class="content">${body}</div>
      <footer><button class="btn" data-r="0">취소</button><button class="btn ${danger ? 'danger' : 'primary'}" data-r="1">${esc(okLabel)}</button></footer>`, () => resolve(false));
    m.querySelectorAll('[data-r]').forEach((b) => b.addEventListener('click', () => { closeModal(); resolve(b.dataset.r === '1'); }));
  });
}

/** 클립보드 복사 — 막혀 있으면 execCommand, 그것도 안 되면 선택만 해두고 안내 */
async function copyText(text, ta) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
  if (!ok) {
    const t = ta || Object.assign(document.createElement('textarea'), { value: text });
    if (!ta) { t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); }
    t.focus(); t.select();
    try { ok = document.execCommand('copy'); } catch (e) {}
    if (!ta) t.remove();
  }
  toast(ok ? '복사했습니다. 메신저에 붙여넣으세요.' : '자동 복사가 안 됩니다. 글을 길게 눌러 직접 복사하세요.', !ok);
}

/** 내 메뉴 순서 — ▲▼로 옮기고 저장 (서버에 저장되어 PC · 휴대폰 · 홈 화면 앱 모두 같은 순서) */
function openNavOrder() {
  let list = myTabs();
  const m = openModal(`<header><h3>메뉴 순서 바꾸기</h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content"><p class="muted small" style="margin-top:0">위에 있는 메뉴가 앞에 보여요. 홈 화면 앱의 하단 탭바에는 앞의 ${NAV_MAIN}개가 보이고, 나머지는 '더보기'에 들어가요.</p>
      <div class="nav-order" data-list></div></div>
    <footer><button class="btn" data-reset>기본 순서로</button><span style="flex:1"></span><button class="btn primary" data-save>저장</button></footer>`);
  const paint = () => {
    m.querySelector('[data-list]').innerHTML = list.map(([k, t], i) => `<div class="no-row${list.length > NAV_MAIN + 1 && i === NAV_MAIN ? ' no-cut' : ''}"><span class="no-n">${i + 1}</span><span class="no-t">${esc(t)}</span>
      <button class="btn sm" data-mv="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="위로">▲</button><button class="btn sm" data-mv="${i}" data-d="1" ${i === list.length - 1 ? 'disabled' : ''} aria-label="아래로">▼</button></div>`).join('');
    m.querySelectorAll('[data-mv]').forEach((b) => (b.onclick = () => {
      const i = +b.dataset.mv, j = i + +b.dataset.d;
      [list[i], list[j]] = [list[j], list[i]]; paint();
    }));
  };
  paint();
  m.querySelector('[data-reset]').onclick = () => { list = myTabs(true); paint(); };
  m.querySelector('[data-save]').onclick = () => {
    const keys = list.map(([k]) => k);
    const def = myTabs(true).map(([k]) => k);
    run(api('setMyNavOrder', keys.join() === def.join() ? [] : keys), '메뉴 순서를 저장했습니다.');
  };
}

  if (ui.month.getFullYear() !== d.getFullYear() || ui.month.getMonth() !== d.getMonth()) { ui.month = new Date(d.getFullYear(), d.getMonth(), 1); render(); }

  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:super-sol-schedule', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    `UID:${Date.now()}-${Math.random().toString(36).slice(2)}@super-sol`, `DTSTAMP:${stamp}`,
    r.allDay ? `DTSTART;VALUE=DATE:${r.start}` : `DTSTART:${utc(r.start)}`,
    r.allDay ? `DTEND;VALUE=DATE:${r.end}` : `DTEND:${utc(r.end)}`,
    `SUMMARY:${esc2(c.title)}`, `DESCRIPTION:${esc2(c.details)}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}
function openToCal(v) {
  const i = v.indexOf(':');
  const c = calEntry(v.slice(0, i), v.slice(i + 1));
  if (!c) return toast('일정을 찾을 수 없습니다. 새로고침 후 다시 시도하세요.', true);
  const when = fmtRange(c) + (c.time ? ` ${c.time[0]}~${c.time[1]}` : ' (하루 종일)');
  const m = openModal(`<header><h3>내 캘린더에 추가</h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content"><div class="infobox" style="margin:0 0 12px"><b>${esc(c.title)}</b><br><span class="small">${esc(when)}</span></div>
      <div class="more-list">
        <button data-gcal>구글 캘린더에 추가<span>›</span></button>
        <button data-ics>휴대폰 캘린더에 추가 <span class="muted small" style="font-weight:500">아이폰 캘린더 등</span><span>›</span></button>
      </div>
      <p class="muted small" style="margin:10px 0 0">추가한 일정은 복사본이라, 여기서 날짜를 바꿔도 내 캘린더에는 바뀌지 않아요. 회사망(모개망)에서는 구글 캘린더가 열리지 않을 수 있어요.</p></div>`);
  m.querySelector('[data-gcal]').onclick = () => { window.open(googleCalUrl(c), '_blank'); closeModal(); };
  m.querySelector('[data-ics]').onclick = () => {
    const url = URL.createObjectURL(new Blob([icsText(c)], { type: 'text/calendar;charset=utf-8' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: `${c.title.replace(/[\\/:*?"<>|]/g, '')}.ics` });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    closeModal();
  };
}

/* ---------- 화면 모드 (시스템 · 밝게 · 어둡게, 이 기기만) ---------- */
const THEME_KEY = 'team-off-theme';
function themePref() { try { return localStorage.getItem(THEME_KEY) || ''; } catch (e) { return ''; } }
function applyTheme(v) {
  const root = document.documentElement;
  if (!root) return;
  if (v === 'light' || v === 'dark') root.dataset.theme = v;
  else delete root.dataset.theme;
}
function setTheme(v) {
  try { if (v) localStorage.setItem(THEME_KEY, v); else localStorage.removeItem(THEME_KEY); } catch (e) {}
  applyTheme(v);
  if ($modal) $modal.querySelectorAll('[data-act="setTheme"]').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
}

/* ---------- 대직자 선택칸 (휴가 등록 · 기본 대직자 설정에서 공용) ---------- */
/** subs 배열(1~3칸, 빈칸은 '')을 box에 그린다. 다른 칸에서 고른 사람과 owner 본인은 목록에서 뺀다 */
function renderSubPicker(box, owner, subs, onChange, firstOptional) {
  const own = partOf(owner);
  box.innerHTML = subs.map((cur, i) => {
    const taken = subs.filter((e, j) => j !== i && e);
    const groups = {};
    S.users.filter((u) => u.email !== owner && taken.indexOf(u.email) < 0)
      .forEach((u) => (groups[u.part || 'PM'] = groups[u.part || 'PM'] || []).push(u));
    const order = [own, ...PARTS, 'PM'].filter((g, k, a) => g && a.indexOf(g) === k && groups[g]);
    return `<div class="sub-row"><select data-sub="${i}"><option value="">— 대직자 ${i + 1}${i || firstOptional ? ' (선택)' : ''} —</option>${order.map((g) =>
      `<optgroup label="${esc(g === own ? g + ' (같은 파트)' : g)}">${groups[g].sort((a, b) => a.name.localeCompare(b.name))
        .map((u) => `<option value="${esc(u.email)}" ${u.email === cur ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</optgroup>`).join('')}</select>
      ${i ? `<button type="button" class="icon-btn" data-subdel="${i}" aria-label="대직자 ${i + 1} 빼기">✕</button>` : ''}</div>`;
  }).join('') + (subs.length < MAX_SUBS ? '<button type="button" class="btn sm" data-subadd>+ 대직자 추가</button>' : '');
  const again = () => { renderSubPicker(box, owner, subs, onChange, firstOptional); if (onChange) onChange(); };
  box.querySelectorAll('[data-sub]').forEach((el) => (el.onchange = () => { subs[+el.dataset.sub] = el.value; again(); }));
  box.querySelectorAll('[data-subdel]').forEach((el) => (el.onclick = () => { subs.splice(+el.dataset.subdel, 1); again(); }));
  const add = box.querySelector('[data-subadd]');
  if (add) add.onclick = () => { subs.push(''); renderSubPicker(box, owner, subs, onChange, firstOptional); box.querySelector(`[data-sub="${subs.length - 1}"]`).focus(); };
}

/** 기본 대직자 — 본인 것은 누구나, 다른 사람 것은 PM만 서버에서 받는다 */
function defaultSubsOf(email) {
  if (email === S.me.email) return S.me.defaultSubs || [];
  return (S.users.find((u) => u.email === email) || {}).defaultSubs || [];
}
const sameSubs = (a, b) => a.slice().sort().join() === b.slice().sort().join();

/* ---------- 휴가 등록/수정 ---------- */
function openLeaveForm(id, date, restore) {
  const ex = id ? S.leaves.find((l) => l.id === id) : null;
  const owner = ex ? ex.email : S.me.email;
  // 새 일정이면 기본 대직자 → 없으면 지난번에 지정했던 대직자를 채워준다
  const lastSubs = (email) => {
    const def = defaultSubsOf(email);
    if (def.length) return def.slice(0, MAX_SUBS);
    const prev = S.leaves.filter((l) => l.email === email).sort((a, b) => (b.updatedAt || b.startDate).localeCompare(a.updatedAt || a.startDate))[0];
    return prev && prev.substitutes.length ? prev.substitutes.slice(0, MAX_SUBS) : [''];
  };
  const f = restore ? { ...restore, subs: restore.subs.slice() }
    : ex ? { ...ex, subs: ex.substitutes.length ? ex.substitutes.slice() : [''] }
    : { id: '', email: owner, type: '연차', startDate: date || todayStr(), endDate: date || todayStr(), subs: lastSubs(owner), memo: '' };
  const chosen = () => f.subs.filter(Boolean);

  const m = openModal(`
    <header><h3>${ex ? '일정 수정' : '일정 등록'}</h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content">
      ${isAdmin() ? `<div class="field"><label>대상자</label><select name="email" ${ex ? 'disabled' : ''}>
        ${S.users.map((u) => `<option value="${esc(u.email)}" ${u.email === f.email ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select></div>` : ''}
      <div class="field"><label>유형 <span class="req">*</span></label>
        <div class="seg">${TYPES.map((t) => `<button type="button" data-type="${t}" class="${f.type === t ? 'on' : ''}"><i class="dot t-${t}"></i>${t}</button>`).join('')}</div></div>
      <div class="row2">
        <div class="field"><label class="label-row"><span data-startlabel>시작일 <span class="req">*</span></span>
          <span class="quick-dates"><button type="button" class="btn sm ghost" data-qd="0">오늘</button><button type="button" class="btn sm ghost" data-qd="1">내일</button></span></label>
          <input type="date" name="startDate" value="${f.startDate}"></div>
        <div class="field" data-endwrap><label>종료일 <span class="req">*</span></label><input type="date" name="endDate" value="${f.endDate}"></div>
      </div>
      <div class="field"><label>대직자 <span class="req">*</span> <span class="muted" style="font-weight:400">최대 ${MAX_SUBS}명 · 한 명이라도 같은 날 부재면 경고</span></label><div data-subs></div>
        <label class="toggle" data-defwrap style="margin-top:4px"><input type="checkbox" data-savedefault> <span data-deflabel></span></label></div>
      <div class="field"><label data-memolabel>메모</label><input name="memo" maxlength="200" placeholder="선택 입력 (예: 병원, 교육)" value="${esc(f.memo)}"></div>
      <div data-days></div><div data-check></div>
    </div>
    <footer>
      ${ex ? '<button class="btn danger" data-del>삭제</button>' : ''}<span class="spacer"></span>
      <button class="btn" data-close>취소</button><button class="btn primary" data-save>${ex ? '저장' : '등록'}</button>
    </footer>`);

  const q = (s) => m.querySelector(s);
  const payload = () => ({ id: f.id, email: f.email, type: f.type, startDate: f.startDate, endDate: f.endDate, substitutes: chosen(), memo: f.memo });
  // 대직 겹침 → 메모가 '사유 (필수)'로 바뀜
  const setReason = (on) => {
    q('[data-memolabel]').innerHTML = on ? '사유 <span class="req">*</span>' : '메모';
    q('[name=memo]').placeholder = on ? '필수 입력 (예: 사전 협의 완료, 가족 행사)' : '선택 입력 (예: 병원, 교육)';
  };

  // 대직자 겹침은 서버가 판단 (팀원은 다른 사람 일정을 받지 않으므로)
  let seq = 0, timer = null;
  const check = () => {
    clearTimeout(timer);
    const my = ++seq;
    q('[data-check]').innerHTML = chosen().length ? '<div class="infobox">대직자 일정 확인 중…</div>' : '';
    timer = setTimeout(() => {
      api('checkLeave', payload()).then((r) => {
        if (my !== seq || !$modal || $modal !== m) return;
        setReason(!!r.reasonRequired);
        q('[data-check]').innerHTML =
          (r.duplicate ? `<div class="warnbox">${esc(r.duplicate)}</div>` : '') +
          (r.warnings.length ? `<div class="warnbox"><b>⚠ 대직자와 일정이 겹칩니다</b>${r.warnings.map((w) => `<div>· ${esc(w)}</div>`).join('')}</div>` : '') +
          ((r.crowded || []).length ? `<div class="infobox"><b>ⓘ 총원의 ${CROWD_PERCENT}% 이상이 부재하는 날이 있어요</b>${r.crowded.slice(0, 5).map((w) => `<div>· ${esc(w)}</div>`).join('')}${r.crowded.length > 5 ? `<div>· 외 ${r.crowded.length - 5}일</div>` : ''}</div>` : '') +
          (r.reasonRequired ? `<div class="warnbox"><b>사유를 꼭 적어 주세요.</b> 대직자와 겹치는 휴가는 사유 없이 저장되지 않아요.</div>` : '') +
          (!r.duplicate && !r.warnings.length && chosen().length ? `<div class="infobox">✓ 대직자${chosen().length > 1 ? ' 모두' : ''} 일정과 겹치지 않습니다.</div>` : '');
      }).catch(handleError);
    }, 250);
  };

  const update = () => {
    const half = !!HALF[f.type];
    q('[data-endwrap]').style.display = half ? 'none' : '';
    q('[data-startlabel]').innerHTML = (half ? '날짜' : '시작일') + ' <span class="req">*</span>';
    if (half || f.endDate < f.startDate) { f.endDate = f.startDate; q('[name=endDate]').value = f.endDate; }
    q('[name=endDate]').min = f.startDate;
    f.subs = f.subs.map((e) => (e === f.email ? '' : e));
    renderSubPicker(q('[data-subs]'), f.email, f.subs, update);
    // 지금 고른 대직자가 기본 대직자와 다르면 '기본으로 저장' 체크박스를 보여준다
    const def = defaultSubsOf(f.email);
    const showDef = chosen().length > 0 && !sameSubs(chosen(), def) && (f.email === S.me.email || isAdmin());
    q('[data-defwrap]').style.display = showDef ? '' : 'none';
    q('[data-deflabel]').textContent = f.email === S.me.email ? '이 대직자를 내 기본 대직자로 저장' : `${nameOf(f.email)}님의 기본 대직자로 저장`;
    if (f.saveDefault == null) f.saveDefault = !def.length; // 기본 대직자가 아직 없으면 체크된 채로
    q('[data-savedefault]').checked = f.saveDefault;
    f.showDef = showDef;
    const evs = f.startDate ? (S.events || []).filter((e) => e.startDate <= f.endDate && f.startDate <= e.endDate) : [];
    const an = annualAfter(f, ex);
    q('[data-days]').innerHTML = (f.startDate ? `<div class="infobox">사용일수 <b>${workdays(f)}일</b> <span class="small">(주말·공휴일 제외)</span></div>` : '')
      + (an ? `<div class="${an.after < 0 ? 'warnbox' : 'infobox'}">${f.email !== S.me.email ? esc(nameOf(f.email)) + '님 ' : ''}${an.year}년 남은 휴가 <b>${an.left}일</b> → ${ex ? '저장' : '등록'} 후 <b>${an.after}일</b>${an.after < 0 ? ' (남은 휴가를 넘습니다)' : ''} <span class="small muted">· 참고용</span></div>` : '')
      + (evs.length ? `<div class="infobox" style="color:var(--evt)"><b>★ 이 기간에 중요 일정이 있습니다</b>${evs.map((e) => `<div>· ${esc(evtWhen(e))} ${esc(e.title)}</div>`).join('')}</div>` : '');
    if (f.startDate) check();
  };

  q('[data-savedefault]').onchange = (e) => (f.saveDefault = e.target.checked);

  m.querySelectorAll('[data-type]').forEach((b) => (b.onclick = () => {
    f.type = b.dataset.type;
    m.querySelectorAll('[data-type]').forEach((x) => x.classList.toggle('on', x === b));
    update();
  }));
  if (q('[name=email]')) q('[name=email]').onchange = (e) => { f.email = e.target.value; f.subs = lastSubs(f.email); update(); };
  q('[name=startDate]').onchange = (e) => { f.startDate = e.target.value; update(); };
  m.querySelectorAll('[data-qd]').forEach((b) => (b.onclick = () => { // [오늘] [내일]: 하루짜리로
    f.startDate = f.endDate = ymd(addDays(parse(todayStr()), +b.dataset.qd));
    q('[name=startDate]').value = f.startDate; q('[name=endDate]').value = f.endDate; update();
  }));
  q('[name=endDate]').onchange = (e) => { f.endDate = e.target.value; update(); };
  q('[name=memo]').oninput = (e) => (f.memo = e.target.value);
  if (q('[data-del]')) q('[data-del]').onclick = () => removeLeave(f.id);

  q('[data-save]').onclick = async () => {
    if (!f.startDate) return toast('날짜를 선택하세요.', true);
    const end = HALF[f.type] ? f.startDate : f.endDate || f.startDate;
    if (!chosen().length && !(isAdmin() && end < todayStr())) { q('[data-sub="0"]').focus(); return toast('대직자를 1명 이상 지정해야 합니다.', true); }
    const p = payload();
    loading(true);
    let r;
    try { r = await api('checkLeave', p); } catch (e) { loading(false); return handleError(e); }
    loading(false);
    if (r.duplicate) return toast(r.duplicate, true);
    if (r.reasonRequired && !(f.memo || '').trim()) {
      setReason(true); q('[name=memo]').focus();
      return toast('대직자와 일정이 겹쳐서 사유를 꼭 적어야 합니다.', true);
    }
    if (r.warnings.length) {
      const ok = await confirmBox('대직자와 일정이 겹칩니다', `<div class="warnbox" style="margin-top:0">${r.warnings.map((w) => `<div>⚠ ${esc(w)}</div>`).join('')}</div>
        <p class="muted small">그래도 저장하면 캘린더에 경고 표시가 남습니다. 대직자를 바꾸는 것을 권장합니다.</p>`, '그래도 저장');
      if (!ok) return openLeaveForm(id, null, f); // 입력하던 내용 그대로 폼으로 돌아감
    }
    const short = annualShortage(p, ex);
    if (short) {
      const who = p.email && p.email !== S.me.email ? nameOf(p.email) + '님의' : '';
      const ok = await confirmBox('남은 휴가를 넘습니다', `<div class="warnbox" style="margin-top:0">${who ? esc(who) + ' ' : ''}${short.year}년 남은 휴가는 <b>${short.left}일</b>인데
        이번에 <b>${short.need}일</b>을 등록하면 <b>${short.after}일</b>이 됩니다.</div>
        <p class="muted small">PM이 입력한 부여 일수 기준의 참고용 계산입니다. 실제 남은 일수가 다르면 그대로 저장해도 됩니다.</p>`, '그래도 저장');
      if (!ok) return openLeaveForm(id, null, f);
    }
    const asDefault = f.showDef && f.saveDefault;
    const fromCal = ui.tab === 'cal';
    run(api('saveLeave', { ...p, saveDefault: asDefault }), (ex ? '수정했습니다.' : '등록했습니다.') + (asDefault ? ' 기본 대직자도 저장했습니다.' : ''),
      () => { if (fromCal) flashDate(p.startDate); });
  };
  update();
}

async function removeLeave(id) {
  const l = S.leaves.find((x) => x.id === id);
  if (!l) return;
  const ok = await confirmBox('일정 삭제', `<p>${esc(nameOf(l.email))} · ${l.type} · ${fmtRange(l)}<br>일정을 삭제할까요?</p>`, '삭제', true);
  if (ok) run(api('deleteLeave', id), '삭제했습니다.');
}

/* ---------- 일괄 등록 (엑셀·시트에서 붙여넣기) ---------- */
function parseBulk(text) {
  const seen = {};
  S.users.forEach((u) => (seen[u.email] = 'registered'));
  return text.split(/\r?\n/).map((line) => line.split(/\t|,/).map((c) => c.trim()))
    .filter((c) => c.some(Boolean))
    .filter((c) => !/이메일|email/i.test(c[0])) // 제목 줄은 건너뜀
    .map(([email = '', name = '', part = '', role = '']) => {
      email = email.toLowerCase();
      const r = { email, name, part, role: roleOfText(role) };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) r.error = '이메일 형식 오류';
      else if (!name) r.error = '이름 없음';
      else if (r.role !== 'pm' && !PARTS.includes(part)) r.error = `파트 확인 (${PARTS.join('/')})`;
      else if (seen[email] === 'registered') r.error = '이미 등록됨';
      else if (seen[email]) r.error = '목록에 중복';
      seen[email] = seen[email] || 'batch';
      return r;
    });
}

/**
 * 휴가 일괄 등록용 붙여넣기 해석 (PM). 그룹웨어 목록을 그대로 복사해도 읽히게:
 *  - 제목 줄이 있으면 칸 이름으로 찾는다 (휴가자/연수자·직원·이름 / 유형·종류 / 시작일 / 종료일 / 대직자 / 메모·사유 / 등록일)
 *  - 제목 줄이 없으면: 직원 이름이 있는 첫 칸 = 직원, 날짜 칸 순서대로 시작일·종료일(·등록일), 유형 단어가 있는 칸 = 유형, 그 뒤 다른 직원 이름 = 대직자
 *  - 유형: 휴가·연차 → 연차, 휴가(오전)·오전반차 → 오전반차, 휴가(오후) → 오후반차, 반반차, 병가, 연수·교육 → 연수/교육, 기타·경조·공가 → 기타
 *  - 날짜: 2026-03-02 · 2026.3.2 · 3/2 · 3.2 (연도 없으면 올해)
 */
function leaveTypeOf(v) {
  const s = String(v || '').replace(/\s/g, '');
  if (!s) return '';
  if (/병가/.test(s)) return '병가';
  if (/연수|교육/.test(s)) return '연수/교육';
  if (/반반차/.test(s)) return '반반차';
  if (/오전/.test(s)) return '오전반차';
  if (/오후/.test(s)) return '오후반차';
  if (/반차/.test(s)) return '?반차';
  if (/연차|휴가|월차/.test(s)) return '연차';
  if (/기타|경조|공가|출산|예비군/.test(s)) return '기타';
  return '';
}
function bulkDate(v) {
  const s = String(v || '').trim().replace(/\s/g, '');
  let m = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})\.?$/);
  if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = s.match(/^(\d{1,2})[-./](\d{1,2})\.?$/);
  if (m) return `${todayStr().slice(0, 4)}-${pad(+m[1])}-${pad(+m[2])}`;
  return '';
}
function parseLeaveBulk(text) {
  const findUser = (v) => {
    const s = String(v || '').trim().toLowerCase();
    if (!s) return null;
    const byEmail = S.users.find((u) => u.email === s);
    if (byEmail) return byEmail;
    const named = S.users.filter((u) => u.name.toLowerCase() === s);
    return named.length === 1 ? named[0] : named.length > 1 ? { dup: true } : null;
  };
  const HEAD = { who: /휴가자|연수자|직원|성명|이름|이메일|신청자/, type: /유형|종류|구분/, start: /시작/, end: /종료/, sub: /대직/, memo: /메모|사유|비고|내용/, created: /등록일|신청일/ };
  let cols = null;
  const out = [];
  text.split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    const cells = (line.includes('\t') ? line.split('\t') : line.split(/\s*,\s*/)).map((c) => c.trim());
    // 제목 줄?
    const head = {};
    cells.forEach((c, j) => Object.keys(HEAD).forEach((k) => { if (head[k] === undefined && c && c.length <= 12 && HEAD[k].test(c)) head[k] = j; }));
    if (head.who !== undefined && head.start !== undefined && !cells.some((c) => bulkDate(c))) { cols = head; return; }

    const r = { line: i + 1, raw: line };
    let who, typeText, start, end, created, subText, memo;
    if (cols) {
      who = cells[cols.who]; start = bulkDate(cells[cols.start]); end = cols.end !== undefined ? bulkDate(cells[cols.end]) : '';
      typeText = cols.type !== undefined ? cells[cols.type] : '';
      if (!leaveTypeOf(typeText)) typeText = cells.find((c) => leaveTypeOf(c)) || typeText; // 유형 칸이 비면 제목 등에서
      subText = cols.sub !== undefined ? cells[cols.sub] : '';
      memo = cols.memo !== undefined ? cells[cols.memo] : '';
      created = cols.created !== undefined ? bulkDate(cells[cols.created]) : '';
    } else {
      const wi = cells.findIndex((c) => findUser(c));
      who = wi >= 0 ? cells[wi] : cells[0];
      const dates = cells.map(bulkDate).filter(Boolean);
      [start, end, created] = [dates[0] || '', dates[1] || '', dates[2] || ''];
      typeText = cells.find((c) => leaveTypeOf(c)) || '';
      subText = cells.slice(wi + 1).find((c) => { const u = findUser(c); return u && !u.dup && c !== who; }) || '';
      memo = '';
    }
    const u = findUser(who);
    r.who = who || ''; r.email = u && !u.dup ? u.email : ''; r.name = u && !u.dup ? u.name : who || '';
    r.type = leaveTypeOf(typeText); r.typeText = typeText || '';
    r.startDate = start; r.endDate = HALF[r.type] ? start : end || start; r.createdAt = created; r.memo = memo || '';
    r.subs = []; r.subNames = [];
    String(subText || '').split(/[,;·/]/).map((x) => x.trim()).filter(Boolean).forEach((x) => {
      const su = findUser(x);
      if (su && !su.dup) { r.subs.push(su.email); r.subNames.push(su.name); } else r.subError = `대직자 '${x}'${su && su.dup ? ' 동명이인 — 이메일로 적어 주세요' : ' 없음'}`;
    });
    if (!u) r.error = `직원 '${who || ''}'을(를) 찾을 수 없음`;
    else if (u.dup) r.error = `'${who}' 동명이인 — 이메일로 적어 주세요`;
    else if (!r.type) r.error = `유형을 알 수 없음 (${typeText || '빈칸'})`;
    else if (r.type === '?반차') r.error = '반차는 오전/오후를 적어 주세요';
    else if (!r.startDate) r.error = '시작일을 알 수 없음';
    else if (r.endDate < r.startDate) r.error = '종료일이 시작일보다 빠름';
    else if (r.subError) r.error = r.subError;
    else if (r.subs.includes(r.email)) r.error = '본인을 대직자로 지정할 수 없음';
    else if (!r.subs.length && r.endDate >= todayStr()) r.error = '오늘 이후 일정은 대직자 필요';
    else {
      const clash = (x) => x.email === r.email && overlaps(x, r);
      if (S.leaves.some(clash)) r.error = '이미 등록된 일정과 겹침';
      else if (out.some((o) => !o.error && clash(o))) r.error = '붙여넣은 목록 안에서 겹침';
    }
    out.push(r);
  });
  return out;
}

/* ---------- 공휴일 ---------- */
/** 공휴일 추가 · 이름 수정 (수정할 때는 날짜는 그대로 — 날짜를 바꾸려면 삭제 후 추가) */
/** 공휴일 일괄 추가 — 한 줄에 '날짜 이름'. 날짜는 2027-01-01 · 2027.1.1 · 1/1(연도는 보고 있는 해) 모두 가능, (금) 같은 요일 표시는 무시 */
function parseHolidayBulk(text, year) {
  return String(text || '').split(/\r?\n/).map((s) => s.trim()).filter(Boolean).map((line) => {
    const m = line.match(/^(?:(\d{4})\s*[-./년]\s*)?(\d{1,2})\s*[-./월]\s*(\d{1,2})\s*일?\s*(?:\([^)]*\))?\s*[\t|,·]?\s*(.*)$/);
    if (!m) return { line, error: '날짜를 읽을 수 없어요' };
    const date = `${m[1] || year}-${pad(+m[2])}-${pad(+m[3])}`;
    const name = m[4].replace(/^[\t|,·\s]+/, '').trim().slice(0, 30);
    const d = parse(date);
    if (ymd(d) !== date) return { line, error: '없는 날짜예요' };
    if (!name) return { line, date, error: '이름이 없어요' };
    return { line, date, name, exists: S.holidays.some((h) => h.date === date) };
  });
}

/* =========================================================
   서버 호출 / 이벤트
   ========================================================= */
let $toast = null, toastTimer = null;
function toast(msg, err, action) {
  if ($toast) $toast.remove();
  $toast = document.createElement('div');
  $toast.className = 'toast' + (err ? ' err' : '');
  $toast.textContent = msg;
  if (action) { // 예: [되돌리기]
    const b = document.createElement('button');
    b.className = 'tbtn'; b.textContent = action.label;
    b.onclick = () => { if ($toast) { $toast.remove(); $toast = null; } action.fn(); };
    $toast.appendChild(b);
  }
  document.body.appendChild($toast);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { if ($toast) { $toast.remove(); $toast = null; } }, action ? 6000 : 3200);
}

let $loading = null;
function loading(on) {
  // 열린 창의 주 버튼(저장·등록 등)을 '처리 중…'으로 바꾸고 잠가서 두 번 눌리지 않게
  if ($modal) {
    $modal.querySelectorAll('footer .btn.primary, [data-save]').forEach((b) => {
      if (on && !b.dataset.busy) { b.dataset.busy = b.innerHTML; b.innerHTML = '처리 중…'; b.disabled = true; }
      if (!on && b.dataset.busy) { b.innerHTML = b.dataset.busy; delete b.dataset.busy; b.disabled = false; }
    });
  }
  if (on && !$loading) { $loading = document.createElement('div'); $loading.className = 'loading'; $loading.innerHTML = '<div class="spinner"></div>'; document.body.appendChild($loading); }
  if (!on && $loading) { $loading.remove(); $loading = null; }
}

function handleError(e) {
  const msg = (e && e.message) || String(e);
  if (msg.indexOf('SAVED:') === 0) { // 저장은 됐는데 결과가 커서 못 받은 경우 → 다시 불러오기
    closeModal(); toast(msg.slice(6));
    W.loaded = false;
    call('getBootstrap', getToken()).then((b) => { if (b.state) { S = b.state; render(); } }).catch(() => {});
    return;
  }
  if (msg.indexOf('AUTH:') >= 0) { // 토큰 만료·비밀번호 변경됨 → 로그인 화면
    setToken(''); syncUrlToken(''); S = null; screen = 'login'; closeModal(); render();
    return toast(msg.slice(msg.indexOf('AUTH:') + 5), true);
  }
  toast(msg, true);
}

/** 서버 응답 { state, token?, ... } 을 반영 */
async function run(promise, okMsg, after) {
  loading(true);
  try {
    const res = await promise;
    if (res.token) { setToken(res.token); if (urlToken) syncUrlToken(res.token); } // 비밀번호 변경 시 주소의 로그인 정보도 교체
    if (res.state) { S = res.state; screen = 'app'; stateSeq++; lastRefresh = Date.now(); }
    closeModal();
    render();
    if (okMsg) toast(okMsg);
    if (after) after(res);
  } catch (e) {
    handleError(e);
  } finally {
    loading(false);
  }
}

applyTheme(themePref()); // 저장해 둔 화면 모드

async function boot() {
  if (MOVED) return render(); // 예전 주소: 서버를 부르지 않고 안내만
  W.loaded = false; W.tasks = []; W.error = '';
  R.loaded = false; R.list = []; R.error = '';
  E.loaded = false; E.items = [];
  screen = 'loading'; render();
  const fromUrl = await readUrlToken();
  if (fromUrl) { urlToken = true; if (!getToken()) setToken(fromUrl); }
  call('getBootstrap', getToken()).then((res) => {
    if (res.needsSetup) screen = 'setup';
    else if (res.needLogin) {
      // 저장된 로그인 정보가 만료됐으면 주소에 붙은 것으로 한 번 더 시도
      if (fromUrl && getToken() !== fromUrl) { setToken(fromUrl); return boot(); }
      setToken(''); if (urlToken) syncUrlToken(''); screen = 'login';
    }
    else { S = res.state; screen = 'app'; stateSeq++; lastRefresh = Date.now(); }
    render();
  }).catch((e) => { screen = 'error'; screenMsg = (e && e.message) || String(e); render(); });
}

document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  if ($loading) return; // 처리 중 중복 제출 방지
  const v = (n) => (form.querySelector(`[name=${n}]`) || {}).value || '';
  switch (form.dataset.form) {
    case 'login': {
      const remember = !!(form.querySelector('[name=remember]') || {}).checked;
      rememberMode = remember;
      run(call('login', v('email'), v('password'), remember), '', () => syncUrlToken(remember ? getToken() : ''));
      break;
    }
    case 'setup': run(call('setupAdmin', { email: v('email'), name: v('name'), password: v('password') }), '관리자 계정을 만들었습니다.'); break;
    case 'password':
      if (v('next') !== v('next2')) return toast('새 비밀번호 확인이 일치하지 않습니다.', true);
      run(api('changePassword', v('current'), v('next'), rememberMode || urlToken), '비밀번호를 변경했습니다.');
      break;
  }
});

// PC 업무 캘린더: 업무 칩을 다른 날짜로 끌어 놓으면 기간을 유지한 채 옮김 (수정 권한 있는 칩만 draggable)
let dragTask = null;
document.addEventListener('dragstart', (e) => {
  const c = e.target.closest && e.target.closest('[data-tid]');
  const cell = c && c.closest('.day[data-act="wday"]');
  if (!c || !cell) return;
  dragTask = { id: c.dataset.tid, from: cell.dataset.v };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', c.dataset.tid);
  c.classList.add('dragging');
});
document.addEventListener('dragend', (e) => {
  if (e.target.classList) e.target.classList.remove('dragging');
  document.querySelectorAll('.drop-over').forEach((x) => x.classList.remove('drop-over'));
  dragTask = null;
});
document.addEventListener('dragover', (e) => {
  const cell = dragTask && e.target.closest && e.target.closest('.day[data-act="wday"]');
  if (!cell) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (!cell.classList.contains('drop-over')) {
    document.querySelectorAll('.drop-over').forEach((x) => x.classList.remove('drop-over'));
    cell.classList.add('drop-over');
  }
});
document.addEventListener('drop', (e) => {
  const cell = dragTask && e.target.closest && e.target.closest('.day[data-act="wday"]');
  if (!cell) return;
  e.preventDefault();
  const { id, from } = dragTask;
  dragTask = null;
  document.querySelectorAll('.drop-over').forEach((x) => x.classList.remove('drop-over'));
  const t = (W.tasks || []).find((x) => x.id === id);
  const n = Math.round((parse(cell.dataset.v) - parse(from)) / 864e5);
  if (!t || !n) return;
  const move = (k) => ({ startDate: ymd(addDays(parse(t.startDate), k)), endDate: ymd(addDays(parse(t.endDate), k)) });
  const to = move(n);
  runTasks(api('saveTask', Object.assign({}, t, to, { scope: '' }))).then(() => {
    if (!(W.tasks || []).some((x) => x.id === id && x.startDate === to.startDate)) return; // 저장 실패
    toast(`${fmtRange(to)}(으)로 옮겼어요`, false, { label: '되돌리기', fn: () => runTasks(api('saveTask', Object.assign({}, t, { scope: '' })), '되돌렸어요') });
  });
});

}

/*
