<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>슈퍼쏠 전담반 일정</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="전담반 일정">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f5eff">
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e3e6eb;
    --text: #1d2330; --muted: #6b7280; --primary: #1f5eff; --primary-weak: #e8efff;
    --danger: #d92d20; --danger-weak: #fdecea; --warn: #b54708; --warn-weak: #fff4e5;
    --sun: #d92d20; --sat: #2563eb; --today: #1f5eff;
    --t-annual: #2563eb; --t-am: #0d9488; --t-pm: #7c3aed; --t-sick: #ea580c; --t-edu: #db2777; --t-etc: #64748b; --evt: #b45309; --evt-bg: #fff7ed;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --border: #2a2f3a;
      --text: #e7e9ee; --muted: #9aa3b2; --primary: #6b93ff; --primary-weak: #1c2742;
      --danger: #ff6b5e; --danger-weak: #3a1b19; --warn: #f5a524; --warn-weak: #33260f;
      --sun: #ff6b5e; --sat: #6b93ff; --today: #6b93ff;
      --t-annual: #5b8cff; --t-am: #2dd4bf; --t-pm: #a78bfa; --t-sick: #fb923c; --t-edu: #f472b6; --t-etc: #94a3b8; --evt: #fbbf24; --evt-bg: #2a2110;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --border: #2a2f3a;
    --text: #e7e9ee; --muted: #9aa3b2; --primary: #6b93ff; --primary-weak: #1c2742;
    --danger: #ff6b5e; --danger-weak: #3a1b19; --warn: #f5a524; --warn-weak: #33260f;
    --sun: #ff6b5e; --sat: #6b93ff; --today: #6b93ff;
    --t-annual: #5b8cff; --t-am: #2dd4bf; --t-pm: #a78bfa; --t-sick: #fb923c; --t-edu: #f472b6; --t-etc: #94a3b8; --evt: #fbbf24; --evt-bg: #2a2110;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  /* 모바일에서 화면 전체가 옆으로 밀리지 않게 (가로로 긴 표·타임라인은 각자 안에서 스크롤) */
  html, body { overflow-x: clip; overscroll-behavior-x: none; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 14px; line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .preview-bar { background: #111827; color: #f9fafb; font-size: 12px; padding: 8px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .preview-bar select { background: #374151; color: #fff; border: 0; border-radius: 6px; padding: 3px 6px; }
  .preview-bar button { background: transparent; color: #cbd5e1; border: 1px solid #4b5563; border-radius: 6px; padding: 2px 8px; }

  header.top { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .top-inner { max-width: 1200px; margin: 0 auto; padding: 12px 16px 0; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: -.2px; }
  .whoami { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .badge.admin { background: var(--primary-weak); color: var(--primary); }
  nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { border: 0; background: none; padding: 10px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  nav.tabs button.on { color: var(--primary); border-bottom-color: var(--primary); }

  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .section-title { font-size: 15px; font-weight: 700; margin: 20px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  .btn { white-space: nowrap; border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 12px; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn[disabled] { opacity: .5; cursor: default; }

  /* summary */
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stat { padding: 12px 14px; min-width: 0; }
  .stat .label { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .stat .sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.warn .value { color: var(--danger); }

  /* calendar */
  .cal-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 10px; flex-wrap: wrap; }
  .month-nav { display: flex; align-items: center; gap: 4px; }
  .month-nav h2 { font-size: 18px; margin: 0 6px; min-width: 112px; text-align: center; }
  .icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
  .cal-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); user-select: none; }
  .cal { overflow: hidden; }
  .cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-head div { padding: 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; border-bottom: 1px solid var(--border); }
  .cal-head div:first-child { color: var(--sun); }
  .cal-head div:last-child { color: var(--sat); }
  .day { min-height: 130px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 4px; cursor: pointer; position: relative; min-width: 0; }
  .day:nth-child(7n) { border-right: 0; }
  .day:hover { background: var(--surface-2); }
  .day.out { background: var(--bg); }
  .day.out .dnum { opacity: .45; }
  .day .dtop { display: flex; align-items: center; gap: 4px; min-width: 0; margin-bottom: 2px; }
  .dnum { font-size: 12px; font-weight: 600; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; flex: none; }
  .day.sun .dnum, .day.hol .dnum { color: var(--sun); }
  .day.sat .dnum { color: var(--sat); }
  .day.today .dnum { background: var(--today); color: #fff; }
  .hname { font-size: 10.5px; color: var(--sun); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: flex; align-items: center; gap: 3px; font-size: 11.5px; padding: 1px 5px; border-radius: 4px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  .chip .nm { overflow: hidden; text-overflow: ellipsis; }
  .chip.conflict { outline: 2px solid var(--danger); outline-offset: -1px; }
  .chip .w { flex: none; }
  .more { font-size: 11px; color: var(--muted); margin-top: 2px; padding-left: 4px; }
  .t-연차 { background: var(--t-annual); } .t-오전반차 { background: var(--t-am); } .t-오후반차 { background: var(--t-pm); }
  .t-병가 { background: var(--t-sick); } .t-연수\/교육 { background: var(--t-edu); } .t-기타 { background: var(--t-etc); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }

  /* list items */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .item .bar { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
  .item .body { flex: 1; min-width: 0; }
  .item .title { font-weight: 700; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .item .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .item .actions { display: flex; gap: 6px; flex: none; }
  .item.past { opacity: .6; }
  .warnbox { background: var(--danger-weak); color: var(--danger); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-top: 8px; }
  .warnbox div + div { margin-top: 2px; }
  .infobox { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filters select, .filters input[type=month] { padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(15,17,21,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 480px; max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 40px rgba(0,0,0,.2); }
  .modal.wide { max-width: 640px; }
  .modal header { padding: 16px 18px 8px; display: flex; justify-content: space-between; align-items: center; }
  .modal header h3 { margin: 0; font-size: 16px; }
  .modal .content { padding: 4px 18px 16px; }
  .modal footer { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--border); }
  .modal footer .spacer { flex: 1; }
  .field { margin-top: 12px; }
  .field > label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  .req { color: var(--danger); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
  .seg button.on { border-color: var(--primary); background: var(--primary-weak); color: var(--primary); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 100; max-width: calc(100% - 32px); box-shadow: 0 8px 20px rgba(0,0,0,.2); }
  .toast.err { background: var(--danger); }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.4); z-index: 90; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center-page { max-width: 440px; margin: 80px auto; padding: 28px; text-align: center; }
  .center-page code { background: var(--surface-2); padding: 3px 8px; border-radius: 6px; }

  .auth { text-align: left; }
  .auth h2 { margin: 0 0 6px; font-size: 19px; }
  .auth .btn.block { margin-top: 16px; }
  .btn.block { display: block; width: 100%; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; letter-spacing: 1px; }
  .chip.evt { background: var(--evt-bg); color: var(--evt); border: 1px solid var(--evt); font-weight: 600; }
  .evt-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .evt-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-left: 3px solid var(--evt); }
  .evt-item .when { color: var(--evt); font-weight: 700; font-size: 13px; white-space: nowrap; min-width: 92px; }
  .evt-item .what { flex: 1; min-width: 0; }
  .evt-item .what b { display: block; }
  .chip.cover { opacity: .85; background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.18) 6px 12px); }
  .toggle.remember { align-items: flex-start; margin-top: 14px; color: var(--text); }
  .toggle.remember input { margin-top: 3px; }
  .ghost-btn { border-color: transparent; background: transparent; color: var(--muted); font-size: 18px; }
  .ghost-btn.spin { animation: spin .8s linear infinite; }
  /* 새 소식 */
  .bell { position: relative; }
  .bell svg { width: 19px; height: 19px; }
  .nbadge { position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
  .news-item { position: relative; padding: 10px 0 10px 14px; border-bottom: 1px solid var(--border); }
  .news-item:last-of-type { border-bottom: 0; }
  .news-item[data-act] { cursor: pointer; }
  .news-item.unread::before { content: ''; position: absolute; left: 0; top: 16px; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
  .news-item.unread .nt { font-weight: 700; }
  .news-item .when { font-size: 12px; color: var(--muted); margin-top: 2px; }
  /* 변경 이력 (PM) */
  .hrow { display: flex; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .hrow:last-child { border-bottom: 0; }
  .hwhen { flex: none; width: 78px; font-size: 12px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
  .hbody { flex: 1; min-width: 0; }
  .hsum { margin-top: 2px; overflow-wrap: anywhere; }
  .whoami.btn { padding: 4px 8px; font-weight: 500; }
  /* 업무 일정 분류 색상 (0 개발 · 1 배포 · 2 테스트 · 3 회의/리뷰 · 4 마감 · 5 기타) */
  .k-0 { background: #4f46e5; } .k-1 { background: #dc2626; } .k-2 { background: #d97706; }
  .k-3 { background: #0d9488; } .k-4 { background: #db2777; } .k-5 { background: #64748b; }
  .chip .pt { flex: none; opacity: .85; font-weight: 600; }
  .chip.done { opacity: .45; text-decoration: line-through; }
  .chips-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chips-row button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
  .chips-row button.on { border-color: var(--primary); background: var(--primary-weak); color: var(--primary); }
  .absent-box { background: var(--warn-weak); color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; margin-top: 6px; }
  .overdue { background: var(--danger-weak); color: var(--danger); }
  .status-sel { padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font-size: 12px; }
  .view-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .view-switch button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .view-switch button.on { background: var(--primary-weak); color: var(--primary); }
  /* 타임라인 (간트형) */
  .tl-wrap { overflow-x: auto; }
  .tl { display: grid; min-width: 760px; font-size: 12px; }
  .tl-row { display: contents; }
  .tl-label { position: sticky; left: 0; z-index: 1; background: var(--surface); padding: 6px 8px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-part { background: var(--surface-2); font-weight: 700; }
  .tl-day { border-bottom: 1px solid var(--border); border-right: 1px solid var(--surface-2); text-align: center; color: var(--muted); padding: 4px 0; font-size: 11px; }
  .tl-day.off { background: var(--bg); }
  .tl-day.today { color: var(--primary); font-weight: 700; }
  .tl-cell { border-bottom: 1px solid var(--border); position: relative; min-height: 30px; }
  .tl-bar { position: absolute; top: 5px; bottom: 5px; border-radius: 5px; color: #fff; font-size: 11px; padding: 0 6px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; cursor: pointer; }
  .tl-bar.done { opacity: .45; }
  .assignee-box { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .assignee-box .name-chip button { border: 0; background: none; padding: 0 0 0 4px; color: var(--muted); }
  .assignee-box select { flex: 1; min-width: 140px; }
  .designated { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; color: var(--text); }
  .designated b { margin-right: 4px; font-size: 13px; }
  .week-absent { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .week-absent:last-child { border-bottom: 0; }
  .wa-day { flex: none; width: 92px; font-weight: 700; font-size: 13px; padding-top: 3px; }
  .wa-day.today { color: var(--primary); }
  .wa-names { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .wa-names .name-chip { display: inline-flex; align-items: center; gap: 4px; }
  .name-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .msg-box { font-size: 13px; line-height: 1.55; resize: vertical; }
  .copy-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .sub-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .sub-row select { flex: 1; min-width: 0; }
  .part-select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }

  @media (max-width: 640px) {
    .top-inner { padding: 10px 12px 0; }
    main { padding: 12px; }
    .brand h1 { font-size: 15px; }
    .stats { gap: 6px; }
    .stat { padding: 10px; }
    .stat .value { font-size: 18px; }
    .stat .label, .stat .sub { font-size: 11px; }
    .month-nav h2 { font-size: 16px; min-width: 96px; }
    /* 모바일: 주말 칸은 좁게, 평일 칸은 넓게 · 칸을 길게 해서 일정을 더 보여줌 */
    .cal-head, .cal-grid { grid-template-columns: minmax(0, .6fr) repeat(5, minmax(0, 1fr)) minmax(0, .6fr); }
    .cal-head div { padding: 8px 2px; }
    .day { min-height: 108px; padding: 2px; }
    .dnum { font-size: 11px; width: 20px; height: 20px; }
    .hname { display: none; }
    .chip { font-size: 10px; padding: 0 3px; border-radius: 3px; }
    .chip .ty { display: none; }
    .item { padding: 10px 12px; }
    .item { flex-wrap: wrap; }
    .item .actions { width: 100%; justify-content: flex-end; }
    .overlay { align-items: flex-end; padding: 0; }
    .modal { max-width: none; border-radius: 16px 16px 0 0; max-height: 92vh; }
    .row2 { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   공통 상수 / 유틸
   ========================================================= */

/*
 * GitHub Pages에서의 서버 호출
 * 1순위: 통신용 페이지(Apps Script ?bridge=1)를 보이지 않는 iframe으로 띄우고 postMessage로 요청 → google.script.run
 * 2순위: 통신용 페이지가 안 뜨는 환경이면 doPost(fetch). 이 방식은 구글 응답 전달(echo)이 자주 404로 실패해서 보조로만 쓴다
 */
const bridge = { win: null, origin: '', ready: null, broken: false, seq: 0, pending: {} };

function initBridge() {
  if (bridge.ready) return bridge.ready;
  bridge.ready = new Promise((resolve, reject) => {
    const fail = () => { bridge.broken = true; reject(new Error('bridge timeout')); };
    const timer = setTimeout(fail, 15000);
    window.addEventListener('message', (ev) => {
      const d = ev.data;
      let host = '';
      try { host = new URL(ev.origin).hostname; } catch (e) { return; }
      if (!d || typeof d !== 'object' || !/\.googleusercontent\.com$/.test(host)) return;
      if (d.type === 'teamoff-ready') {
        bridge.win = ev.source; bridge.origin = ev.origin;
        clearTimeout(timer); resolve();
      } else if (d.type === 'teamoff-broken') {
        clearTimeout(timer); fail(); // 통신용 페이지는 떴지만 구글 서버와 통신이 안 됨 (회사망 등)
      } else if (d.type === 'teamoff-reply' && bridge.pending[d.id]) {
        const p = bridge.pending[d.id];
        delete bridge.pending[d.id];
        clearTimeout(p.timer);
        d.ok ? p.resolve(d.data) : p.reject(new Error(d.error));
      }
    });
    const f = document.createElement('iframe');
    f.src = API_URL + '?bridge=1';
    f.title = '서버 연결';
    f.setAttribute('aria-hidden', 'true');
    f.tabIndex = -1;
    f.style.cssText = 'position:absolute;left:-9999px;top:0;width:1px;height:1px;border:0;visibility:hidden';
    document.body.appendChild(f);
  });
  return bridge.ready;
}

function callBridge(fn, args) {
  return initBridge().then(() => new Promise((resolve, reject) => {
    const id = ++bridge.seq;
    const timer = setTimeout(() => {
      delete bridge.pending[id];
      reject(new Error('서버 응답이 없습니다. 잠시 후 다시 시도하세요.'));
    }, 60000);
    bridge.pending[id] = { resolve, reject, timer };
    bridge.win.postMessage({ type: 'teamoff-call', id, fn, args }, bridge.origin);
  }));
}

const READ_ONLY = { getBootstrap: true, checkLeave: true, getTasks: true, checkTaskAbsence: true };

/*
 * 회사망(모개망)은 외부 사이트로 가는 POST 요청을 보안 장비가 가로채서 안내 문구로 바꿔치기한다.
 * /api 전달을 쓸 때 POST 응답이 JSON이 아니면 GET(/api?q=요청내용)으로 다시 보내고, 이 기기는 이후 계속 GET을 쓴다.
 * (가로채진 POST는 서버에 도달하지 않았으므로 다시 보내도 중복 처리되지 않는다)
 */
const GET_KEY = 'team-off-use-get';
let useGet = false;
try { useGet = localStorage.getItem(GET_KEY) === '1'; } catch (e) {}

function newRid() {
  const a = new Uint8Array(12);
  (window.crypto || crypto).getRandomValues(a);
  return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
}

/** 문자열(한글 포함) → URL에 넣을 수 있는 base64url */
function toB64Url(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach((b) => (bin += String.fromCharCode(b)));
  return btoa(bin).split('+').join('-').split('/').join('_').replace(/=+$/, ''); // 정규식에 슬래시 두 개가 연달아 들어가면 Apps Script가 주석으로 잘라낸다
}

function fetchOnce(fn, args) {
  const lost = () => { const e = new Error('lost'); e.lost = true; throw e; };
  // 저장 요청에는 한 번만 처리되도록 요청 ID(rid)를 붙인다 (전달 서버가 응답을 잃어버려 다시 보내도 중복 저장 안 됨)
  const payload = JSON.stringify(READ_ONLY[fn] ? { fn, args } : { fn, args, rid: newRid() });
  const viaGet = USE_PROXY && useGet;
  // POST는 text/plain 으로 보내야 브라우저가 사전 확인(CORS preflight) 없이 바로 보낸다
  const req = viaGet
    ? fetch(PROXY_URL + '?q=' + toB64Url(payload), { cache: 'no-store' })
    : fetch(USE_PROXY ? PROXY_URL : API_URL, { method: 'POST', body: payload });
  return req
    .then((r) => r.text().then((text) => ({ r, text })), lost)
    .then(({ r, text }) => {
      let res = null;
      try { res = JSON.parse(text); } catch (e) {}
      if (!res || typeof res !== 'object') {
        if (!r.ok && !USE_PROXY) lost();
        // 우리 서버 응답이 아님 → 중간에서 가로챔
        if (USE_PROXY && !viaGet) {
          useGet = true;
          try { localStorage.setItem(GET_KEY, '1'); } catch (e) {}
          return fetchOnce(fn, args);
        }
        const snippet = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 150);
        throw new Error(`네트워크에서 요청이 차단되었습니다 (HTTP ${r.status}). 받은 내용: ${snippet || '(없음)'}`);
      }
      if (r.status === 502 || (!r.ok && !USE_PROXY)) lost();
      if (!res.ok) throw new Error(res.error);
      return res.data;
    });
}

/** fetch 방식: 구글 응답 전달(echo)이 가끔 응답을 잃어버려서 조회는 최대 3번 시도 */
function callFetch(fn, args, attempt = 1) {
  return fetchOnce(fn, args).catch((e) => {
    if (!e.lost) throw e;
    if (READ_ONLY[fn] && attempt < 3) return new Promise((r) => setTimeout(r, 700 * attempt)).then(() => callFetch(fn, args, attempt + 1));
    if (READ_ONLY[fn]) throw new Error('서버에 연결할 수 없습니다. 잠시 후 다시 시도하세요.');
    // 저장 요청은 서버에서 이미 처리됐을 수 있어 다시 보내지 않고, 화면만 새로 불러온다

  });
}

function callApi(fn, args) {
  if (USE_PROXY || bridge.broken) return callFetch(fn, args);
  return callBridge(fn, args).catch((e) => {
    if (e.message === 'bridge timeout') return callFetch(fn, args); // 통신용 페이지가 안 뜨면 fetch로
    throw e;
  });
}

        if (ev.endDate >= todayStr()) push(a, db.users.map((x) => x.email), `중요 일정 취소: ${ev.title} ${fmtRange(ev)}`, 'tab:events');
      }
      return result(a);
    },
    getHistory(token) {
      admin(token);
      return { items: (db.history || []).slice().reverse().sort((x, y) => (x.at < y.at ? 1 : x.at > y.at ? -1 : 0)), days: 90 };
    },
    markNewsRead(token) {
      const u = auth(token); const n = (db.news || {})[u.email];
      if (!n) return { seenAt: '' };
      n.seenAt = new Date().toISOString(); persist(); return { seenAt: n.seenAt };
    },
    saveHoliday(token, h) {
      const a = admin(token); need(h.date && (h.name || '').trim(), '날짜와 이름을 입력하세요.');
      db.holidays = db.holidays.filter((x) => x.date !== h.date).concat([{ date: h.date, name: h.name.trim() }]); return result(a);
    },
    deleteHoliday(token, date) {
      const a = admin(token); db.holidays = db.holidays.filter((x) => x.date !== date); return result(a);
    },
  };
})();

const ui = {
  tab: 'cal',
  month: (() => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), 1); })(),
  mineOnly: false,
  part: '', // PM 파트 필터
  allFilter: { member: '', month: '', warnOnly: false },
  holYear: new Date().getFullYear(),
  workMonth: (() => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), 1); })(),
  workPart: '',   // 업무 일정 파트 필터 ('' = 전체)
  workMine: false, // 내 담당·내가 쓴 것만
  workView: 'cal', // 'cal' 캘린더 / 'timeline' 타임라인
};
let D = {}; // 파생 데이터

const isAdmin = () => S && S.me.role === 'pm';
const isPL = () => S && S.me.role === 'pl';
const canSeeAll = () => isAdmin() || isPL() || !!(S && S.me.viewAll); // 전체 일정 조회 (PM·PL·'전체 일정 조회' 옵션)
const canSeeTeam = () => canSeeAll() || !!(S && S.me.part); // 다른 사람 일정도 받는 권한 (파트원은 같은 파트)
const roleLabel = (u) => (u.role === 'pm' ? 'PM' : u.role === 'pl' ? `${u.part} PL` : `${u.part || ''} 파트원`.trim())
  + (u.viewAll && u.role === 'member' ? ' · 전체조회' : '');
const nameOf = (email) => { const u = S.users.find((x) => x.email === email); return u ? u.name : email; };
const partOf = (email) => (S.users.find((x) => x.email === email) || {}).part || '';
/** 전체 조회 권한자가 파트 필터를 고르면 그 파트 일정만 */
const scoped = () => (canSeeAll() && ui.part ? S.leaves.filter((l) => partOf(l.email) === ui.part) : S.leaves);
const canEdit = (l) => isAdmin() || l.email === S.me.email;
const conflictsOf = (l) => l.conflicts || [];

function derive() {
  const holidays = {};
  (S.holidays || []).forEach((h) => (holidays[h.date] = h.name));
  const isOff = (ds, d) => d.getDay() === 0 || d.getDay() === 6 || !!holidays[ds];
  D = { holidays, isOff };
}

function workdays(l) {
  let n = 0;
  eachDate(l.startDate, l.endDate, (ds, d) => { if (!D.isOff(ds, d)) n++; });
  return HALF[l.type] ? n * 0.5 : n;
}

/** 해당 날짜의 중요 일정 (PM이 등록, 전 직원 공개) */
/** 캘린더 표시 순서: 등록한 순서 (등록 시각이 없는 예전 일정은 받은 순서 그대로) */
const byCreated = (a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
const eventsOn = (ds) => (S.events || []).filter((e) => e.startDate <= ds && ds <= e.endDate).sort(byCreated);
const evtWhen = (e) => fmtRange(e) + (e.time ? ' ' + e.time : '');

/** 해당 날짜에 표시할 일정 (여러 날 일정은 주말·공휴일엔 표시하지 않음) */
function leavesOn(ds) {
  const d = parse(ds);
  return scoped().filter((l) => l.startDate <= ds && ds <= l.endDate && (l.startDate === l.endDate || !D.isOff(ds, d))).sort(byCreated);
}

/* ---------- 캘린더 ---------- */
function viewCalendar() {
  const today = todayStr();
  const tDate = parse(today);
  const me = S.me.email;
  const year = today.slice(0, 4);
  let stats;

  if (canSeeTeam()) {
    const scope = !canSeeAll() ? '파트 ' : ui.part ? ui.part + ' ' : '';
    const todays = D.isOff(today, tDate) ? [] : leavesOn(today);
    const mon = addDays(tDate, -((tDate.getDay() + 6) % 7));
    const weekPeople = new Set();
    for (let i = 0; i < 5; i++) { const ds = ymd(addDays(mon, i)); if (!D.isOff(ds, parse(ds))) leavesOn(ds).forEach((l) => weekPeople.add(l.email)); }
    const warn = scoped().filter((l) => l.endDate >= today && conflictsOf(l).length);
    stats = [
      [`오늘 ${scope}부재`, `${todays.length}명`, todays.length ? todays.map((l) => `${esc(nameOf(l.email))} ${SHORT[l.type]}`).join(', ') : '전원 근무', 0, todays.length ? { act: 'day', v: today } : ''],
      [`이번 주 ${scope}부재`, `${weekPeople.size}명`, [...weekPeople].map((e) => esc(nameOf(e))).join(', ') || '-', 0, weekPeople.size ? { act: 'weekAbsent', v: ymd(mon) } : ''],
      [`${scope}대직 겹침 경고`, `${warn.length}건`, warn.length ? '확인 필요 ⚠' : '문제 없음', warn.length, warn.length ? 'all-warn' : ''],
    ];
  } else {
    const mine = S.leaves.filter((l) => l.email === me);
    const next = mine.filter((l) => l.endDate >= today).sort((a, b) => a.startDate.localeCompare(b.startDate))[0];
    const used = mine.filter((l) => l.startDate.startsWith(year) && (l.type === '연차' || HALF[l.type])).reduce((s, l) => s + workdays(l), 0);
    const warn = mine.filter((l) => l.endDate >= today && conflictsOf(l).length);
    stats = [
      ['다음 내 일정', next ? fmtShort(next.startDate) : '-', next ? next.type : '예정 없음'],
      [`${year}년 연차 사용`, `${used}일`, '반차 0.5일 · 주말·공휴일 제외'],
      ['대직자 겹침', `${warn.length}건`, warn.length ? '확인 필요 ⚠' : '문제 없음', warn.length, warn.length ? 'mine' : ''],
    ];
  }
  const statsHtml = `<div class="stats">${stats.map(([label, value, sub, warn, go]) => `
    <div class="card stat ${warn ? 'warn' : ''}" ${go ? `data-act="${go.act || 'tab'}" data-v="${go.v || go}" style="cursor:pointer"` : ''}>
      <div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`).join('')}</div>`;

  // 달력
  const first = ui.month;
  const start = addDays(first, -first.getDay());
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const weeks = Math.ceil((first.getDay() + last.getDate()) / 7);
  const maxChips = 5;
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i);
    const ds = ymd(d);
    let items = leavesOn(ds);
    if (ui.mineOnly) items = items.filter((l) => l.email === me || l.substitutes.includes(me));
    const cls = ['day', d.getMonth() !== first.getMonth() && 'out', d.getDay() === 0 && 'sun', d.getDay() === 6 && 'sat', D.holidays[ds] && 'hol', ds === today && 'today'].filter(Boolean).join(' ');
    const evs = eventsOn(ds);
    const room = Math.max(maxChips - evs.length, 1);
    const shown = items.slice(0, items.length > room ? room - 1 : room);
    cells += `<div class="${cls}" data-act="day" data-v="${ds}">
      <div class="dtop"><span class="dnum">${d.getDate()}</span>${D.holidays[ds] ? `<span class="hname">${esc(D.holidays[ds])}</span>` : ''}</div>
      ${evs.map((e) => `<div class="chip evt" title="${esc(e.title)}${e.time ? ' ' + esc(e.time) : ''}"><span class="w">★</span><span class="nm">${esc(e.title)}</span></div>`).join('')}
      ${shown.map((l) => {
        const c = conflictsOf(l).length;
        const cover = l.email !== me && l.substitutes.includes(me);
        return `<div class="chip t-${l.type} ${c ? 'conflict' : ''} ${cover ? 'cover' : ''}" title="${esc(nameOf(l.email))} ${l.type}${cover ? ' (내가 대직)' : ''}${c ? ' — 대직 겹침' : ''}">${c ? '<span class="w">⚠</span>' : ''}${cover ? '<span class="w">↺</span>' : ''}<span class="nm">${esc(nameOf(l.email))}</span><span class="ty">${SHORT[l.type]}</span></div>`;
      }).join('')}
      ${items.length > shown.length ? `<div class="more">+${items.length - shown.length}</div>` : ''}
    </div>`;
  }

  const upcoming = (S.events || []).filter((e) => e.endDate >= today).sort((a, b) => a.startDate.localeCompare(b.startDate)).slice(0, 3);
  const upcomingHtml = upcoming.length ? `
    <div class="evt-list">${upcoming.map((e) => `
      <div class="card evt-item" data-act="day" data-v="${e.startDate < today ? today : e.startDate}" style="cursor:pointer">
        <div class="when">★ ${esc(evtWhen(e))}</div><div class="what"><b>${esc(e.title)}</b>${e.memo ? `<span class="muted small">${esc(e.memo)}</span>` : ''}</div></div>`).join('')}
      ${(S.events || []).filter((e) => e.endDate >= today).length > 3 ? '<button class="btn sm ghost" data-act="tab" data-v="events" style="align-self:flex-start">중요 일정 더 보기</button>' : ''}
    </div>` : '';

  return upcomingHtml + statsHtml + `
    <div class="cal-toolbar">
      <div class="month-nav">
        <button class="icon-btn" data-act="month" data-v="-1" aria-label="이전 달">‹</button>
        <h2>${first.getFullYear()}년 ${first.getMonth() + 1}월</h2>
        <button class="icon-btn" data-act="month" data-v="1" aria-label="다음 달">›</button>
        <button class="btn sm" data-act="month" data-v="0" style="margin-left:4px">오늘</button>
      </div>
      <div class="cal-actions">
        ${canSeeAll() ? partSelect() : ''}
        ${canSeeAll() ? `<button class="btn" data-act="copyAttendance" data-v="${today}">오늘 근태 복사</button>` : ''}
        ${isAdmin() ? '<button class="btn" data-act="newEvent">+ 중요 일정</button>' : ''}
        ${canSeeTeam() ? `<label class="toggle"><input type="checkbox" data-act="mineOnly" ${ui.mineOnly ? 'checked' : ''}> 나와 관련된 일정만</label>` : ''}
        <button class="btn primary" data-act="newLeave">+ 일정 등록</button>
      </div>
    </div>
    <div class="card cal">
      <div class="cal-head">${WEEK.map((w) => `<div>${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div class="legend">
      ${TYPES.map((t) => `<span><i class="dot t-${t}"></i>${t}</span>`).join('')}
      <span><span style="color:var(--evt)">★</span> 중요 일정</span>
      <span><span style="color:var(--danger)">⚠</span> 대직자와 일정 겹침</span>
      ${canSeeTeam() ? '<span>↺ 내가 대직하는 일정</span>' : ''}
      ${isAdmin() ? '' : canSeeAll() ? '<span>· 전체 직원 일정 (수정은 본인 일정만)</span>' : S.me.part ? `<span>· ${esc(S.me.part)} 파트 일정 + PM·PL 일정 (수정은 본인 일정만)</span>` : '<span>· 본인 일정 + PM·PL 일정</span>'}
    </div>
    ${isAdmin() ? '' : designatedBox()}`;
}

/** 나를 대직자로 지정한 사람 (이름만) — PM은 전체 일정을 보므로 표시 안 함 */
function designatedBox() {
  const names = S.designatedBy || [];
  return `<div class="infobox designated"><b>나를 대직자로 지정한 사람</b>
    ${names.length ? names.map((n) => `<span class="name-chip">${esc(n)}</span>`).join('') : '<span>없음</span>'}</div>`;
}

/** 아침 근태 보고용 문구 — 그날 부재자를 유형별로 묶는다 */
function attendanceText(ds) {
  const items = leavesOn(ds);
  const title = `[${fmtShort(ds)}${ui.part ? ' ' + ui.part : ''} 근태 현황]`;
  if (!items.length) return `${title}\n부재 없음 (전원 정상 근무)`;
  const who = (l) => nameOf(l.email) + (partOf(l.email) && !ui.part ? `(${partOf(l.email)})` : '');
  const lines = TYPES.map((t) => {
    const ls = items.filter((l) => l.type === t).sort((a, b) => nameOf(a.email).localeCompare(nameOf(b.email)));
    return ls.length ? `${t}: ${ls.map(who).join(', ')}` : '';
  }).filter(Boolean);
  return `${title}\n${lines.join('\n')}\n→ 부재 ${new Set(items.map((l) => l.email)).size}명`;
}

function partSelect() {
  return `<select class="part-select" data-act="part"><option value="">전체 파트</option>
    ${PARTS.map((p) => `<option ${ui.part === p ? 'selected' : ''}>${p}</option>`).join('')}</select>`;
}

/* ---------- 일정 카드 ---------- */
function leaveItem(l, opts = {}) {
  const c = conflictsOf(l);
  const past = l.endDate < todayStr();
  return `<div class="card item ${past ? 'past' : ''}">
    <div class="bar t-${l.type}"></div>
    <div class="body">
      <div class="title">${opts.showName ? esc(nameOf(l.email)) + ' · ' : ''}${l.type} <span class="muted small" style="font-weight:500">${fmtRange(l)} · ${workdays(l)}일</span>
        ${c.length ? '<span class="badge" style="background:var(--danger-weak);color:var(--danger)">⚠ 대직 겹침</span>' : ''}</div>
      <div class="meta">대직자 ${l.substitutes.map((e) => esc(nameOf(e))).join(', ')}${l.memo ? ' · ' + esc(l.memo) : ''}</div>
      ${c.length ? `<div class="warnbox">${c.map((x) => `<div>⚠ ${esc(x)}</div>`).join('')}</div>` : ''}
    </div>
    ${canEdit(l) ? `<div class="actions">
      <button class="btn sm" data-act="editLeave" data-v="${l.id}">수정</button>
      <button class="btn sm danger" data-act="delLeave" data-v="${l.id}">삭제</button></div>` : ''}
  </div>`;
}

/* =========================================================
   업무 일정 — 파트별 업무 공유 (휴가 일정과 데이터·화면 모두 별도)
   탭을 열 때만 서버에서 불러온다 (getTasks)
   ========================================================= */
const TASK_CATS = ['개발', '배포', '테스트', '회의/리뷰', '마감', '기타'];
const TASK_STATUS = ['예정', '진행 중', '완료', '지연'];
const MAX_ASSIGNEES = 10;
const W = { loaded: false, loading: false, error: '', tasks: [] };
const catIdx = (c) => Math.max(TASK_CATS.indexOf(c), 0);

function loadTasks(force) {
  if (W.loading || (W.loaded && !force)) return;
  W.loading = true;
  api('getTasks')
    .then((r) => { W.tasks = r.tasks || []; W.loaded = true; W.error = ''; })
    .catch((e) => { const m = (e && e.message) || String(e); if (m.indexOf('AUTH:') >= 0) return handleError(e); W.error = m; })
    .finally(() => { W.loading = false; if (screen === 'app' && ui.tab === 'work') render(); });
}

/** 업무 일정 저장·삭제 결과({ tasks }) 반영 */
async function runTasks(promise, okMsg) {
  loading(true);
  try {
    const r = await promise;
    W.tasks = r.tasks || []; W.loaded = true; stateSeq++;
    closeModal(); render();
    if (okMsg) toast(okMsg);
  } catch (e) {
    handleError(e);
  } finally {
    loading(false);
  }
}

function workFiltered() {
  const me = S.me.email;
  return W.tasks.filter((t) => (!ui.workPart || t.part === ui.workPart) && (!ui.workMine || t.assignees.includes(me) || t.createdBy === me));
}

/** 그날 표시할 업무 (여러 날 업무는 주말·공휴일엔 표시하지 않음) */
function tasksOn(ds, list) {
  const d = parse(ds);
  return list.filter((t) => t.startDate <= ds && ds <= t.endDate && (t.startDate === t.endDate || !D.isOff(ds, d)))
    .sort((a, b) => a.part.localeCompare(b.part) || a.title.localeCompare(b.title));
}

const isOverdue = (t) => t.status !== '완료' && t.endDate < todayStr();

function taskItem(t) {
  const names = t.assignees.map((e) => esc(nameOf(e))).join(', ');
  const late = isOverdue(t);
  return `<div class="card item ${t.status === '완료' ? 'past' : ''}">
    <div class="bar k-${catIdx(t.category)}"></div>
    <div class="body">
      <div class="title"><span class="badge">${esc(t.part)}</span> ${esc(t.title)}
        <span class="muted small" style="font-weight:500">${fmtRange(t)}${t.time ? ' ' + esc(t.time) : ''}</span>
        ${late ? '<span class="badge overdue">기한 지남</span>' : t.status === '지연' ? '<span class="badge overdue">지연</span>' : ''}</div>
      <div class="meta">${esc(t.category)}${t.canEdit ? '' : ' · ' + esc(t.status)}${names ? ' · 담당 ' + names : ''}${t.visibility === 'part' ? ' · 파트 내부' : t.visibility === 'private' ? ' · <b>나만 보기</b>' : ''}</div>
      ${t.memo ? `<div class="meta" style="white-space:pre-wrap">${esc(t.memo)}</div>` : ''}
      ${(t.absences || []).length ? `<div class="absent-box">⚠ 담당자 부재: ${t.absences.map(esc).join(', ')}</div>` : ''}
    </div>
    ${t.canEdit ? `<div class="actions">
      <select class="status-sel" data-act="tstatus" data-v="${t.id}" aria-label="상태">${TASK_STATUS.map((st) => `<option ${t.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select>
      <button class="btn sm" data-act="editTask" data-v="${t.id}">수정</button>
      <button class="btn sm danger" data-act="delTask" data-v="${t.id}">삭제</button></div>` : ''}
  </div>`;
}

/** 요약 카드: 이번 주 · 마감 임박(3일 이내) · 지연/기한 지남 */
function workSummary(list) {
  const today = todayStr();
  const t = parse(today);
  const mon = ymd(addDays(t, -((t.getDay() + 6) % 7)));
  const sun = ymd(addDays(parse(mon), 6));
  const soonEnd = ymd(addDays(t, 3));
  const open = list.filter((x) => x.status !== '완료');
  const groups = {
    week: list.filter((x) => x.startDate <= sun && mon <= x.endDate),
    soon: open.filter((x) => x.endDate >= today && x.endDate <= soonEnd),
    late: open.filter((x) => x.status === '지연' || x.endDate < today),
  };
  const scope = ui.workPart ? ui.workPart + ' ' : ui.workMine ? '내 ' : '';
  const card = (key, label, warn) => {
    const g = groups[key];
    return `<div class="card stat ${warn && g.length ? 'warn' : ''}" ${g.length ? `data-act="wsum" data-v="${key}" style="cursor:pointer"` : ''}>
      <div class="label">${label}</div><div class="value">${g.length}건</div>
      <div class="sub">${g.length ? g.slice(0, 3).map((x) => esc(x.title)).join(', ') : '없음'}</div></div>`;
  };
  W.groups = groups;
  return `<div class="stats" style="margin-bottom:12px">${card('week', `이번 주 ${scope}업무`)}${card('soon', '마감 3일 이내', true)}${card('late', '지연 · 기한 지남', true)}</div>`;
}

/** 이번 주 부재 — 평일별로 누가 어떤 일정인지 (날짜를 누르면 그날 상세) */
function openWeekAbsent(monStr) {
  const mon = parse(monStr);
  const days = [0, 1, 2, 3, 4].map((i) => ymd(addDays(mon, i))).filter((ds) => !D.isOff(ds, parse(ds)));
  const who = (l) => `<span class="name-chip"><i class="dot t-${l.type}"></i> ${esc(nameOf(l.email))}${partOf(l.email) && canSeeAll() && !ui.part ? ` <span class="muted small">${esc(partOf(l.email))}</span>` : ''} <span class="muted small">${SHORT[l.type]}</span></span>`;
  const rows = days.map((ds) => {
    const ls = leavesOn(ds);
    return `<div class="week-absent" data-act="day" data-v="${ds}">
      <div class="wa-day${ds === todayStr() ? ' today' : ''}">${fmtShort(ds)} <span class="muted small">${ls.length}명</span></div>
      <div class="wa-names">${ls.length ? ls.map(who).join('') : '<span class="muted small">부재 없음</span>'}</div></div>`;
  }).join('');
  openModal(`<header><h3>이번 주 부재 <span class="muted small">날짜를 누르면 상세</span></h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content">${rows || '<div class="empty">이번 주는 평일이 없습니다.</div>'}</div>`);
  $modal.querySelector('.modal').classList.add('wide');
}

function openWorkGroup(key) {
  const title = { week: '이번 주 업무', soon: '마감 3일 이내', late: '지연 · 기한 지남' }[key];
  const items = ((W.groups || {})[key] || []).slice().sort((a, b) => a.endDate.localeCompare(b.endDate));
  openModal(`<header><h3>${title} <span class="muted small">${items.length}건</span></h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content"><div class="list">${items.map(taskItem).join('') || '<div class="empty">없습니다.</div>'}</div></div>`);
}

/** 타임라인: 파트별로 묶어 선택한 달의 기간을 막대로 */
function workTimeline(list, first) {
  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const ym = `${first.getFullYear()}-${pad(first.getMonth() + 1)}`;
  const mStart = `${ym}-01`, mEnd = `${ym}-${pad(days)}`;
  const today = todayStr();
  const inMonth = list.filter((t) => t.startDate <= mEnd && mStart <= t.endDate);
  const cols = `grid-template-columns: 150px repeat(${days}, minmax(22px, 1fr))`;
  let html = `<div class="tl-row"><div class="tl-label tl-part">업무</div>`;
  for (let d = 1; d <= days; d++) {
    const ds = `${ym}-${pad(d)}`;
    html += `<div class="tl-day ${D.isOff(ds, parse(ds)) ? 'off' : ''} ${ds === today ? 'today' : ''}">${d}</div>`;
  }
  html += '</div>';
  const parts = PARTS.filter((p) => inMonth.some((t) => t.part === p));
  parts.forEach((p) => {
    html += `<div class="tl-row"><div class="tl-label tl-part" style="grid-column: 1 / -1">${esc(p)} <span class="muted small">${inMonth.filter((t) => t.part === p).length}건</span></div></div>`;
    inMonth.filter((t) => t.part === p).sort((a, b) => a.startDate.localeCompare(b.startDate)).forEach((t) => {
      const s = t.startDate < mStart ? 1 : Number(t.startDate.slice(8));
      const e = t.endDate > mEnd ? days : Number(t.endDate.slice(8));
      const left = ((s - 1) / days) * 100, width = ((e - s + 1) / days) * 100;
      html += `<div class="tl-row"><div class="tl-label" title="${esc(t.title)}">${(t.absences || []).length ? '⚠ ' : ''}${esc(t.title)}</div>
        <div class="tl-cell" style="grid-column: 2 / -1">
          <div class="tl-bar k-${catIdx(t.category)} ${t.status === '완료' ? 'done' : ''}" data-act="${t.canEdit ? 'editTask' : 'wday'}" data-v="${t.canEdit ? t.id : t.startDate < mStart ? mStart : t.startDate}"
            style="left:${left}%;width:${width}%" title="${esc(t.title)} ${fmtRange(t)}">${esc(t.title)}</div></div></div>`;
    });
  });
  if (!parts.length) return '<div class="card empty">이 달에 등록된 업무가 없습니다.</div>';
  return `<div class="card tl-wrap"><div class="tl" style="${cols}">${html}</div></div>`;
}

function viewWork() {
  if (!W.loaded) {
    loadTasks();
    return W.error
      ? `<div class="card empty">업무 일정을 불러오지 못했습니다. ${esc(W.error)}<br><button class="btn sm" data-act="reloadTasks" style="margin-top:8px">다시 시도</button></div>`
      : '<div class="card empty">업무 일정을 불러오는 중…</div>';
  }
  const today = todayStr();
  const list = workFiltered();
  const first = ui.workMonth;
  const summary = workSummary(list);
  const start = addDays(first, -first.getDay());
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const weeks = Math.ceil((first.getDay() + last.getDate()) / 7);
  const mobile = window.matchMedia('(max-width: 640px)').matches;
  const maxChips = 5;
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i);
    const ds = ymd(d);
    const items = tasksOn(ds, list);
    const cls = ['day', d.getMonth() !== first.getMonth() && 'out', d.getDay() === 0 && 'sun', d.getDay() === 6 && 'sat', D.holidays[ds] && 'hol', ds === today && 'today'].filter(Boolean).join(' ');
    const shown = items.slice(0, items.length > maxChips ? maxChips - 1 : maxChips);
    cells += `<div class="${cls}" data-act="wday" data-v="${ds}">
      <div class="dtop"><span class="dnum">${d.getDate()}</span>${D.holidays[ds] ? `<span class="hname">${esc(D.holidays[ds])}</span>` : ''}</div>
      ${shown.map((t) => `<div class="chip k-${catIdx(t.category)} ${t.status === '완료' ? 'done' : ''}" title="[${esc(t.part)}] ${esc(t.title)}${(t.absences || []).length ? ' (담당자 부재)' : ''}">${(t.absences || []).length ? '<span class="w">⚠</span>' : ''}${mobile || ui.workPart ? '' : `<span class="pt">${esc(t.part)}</span>`}<span class="nm">${esc(t.title)}</span></div>`).join('')}
      ${items.length > shown.length ? `<div class="more">+${items.length - shown.length}</div>` : ''}
    </div>`;
  }
  const ym = `${first.getFullYear()}-${pad(first.getMonth() + 1)}`;
  const monthList = list.filter((t) => t.startDate.slice(0, 7) <= ym && ym <= t.endDate.slice(0, 7))
    .sort((a, b) => a.startDate.localeCompare(b.startDate) || a.part.localeCompare(b.part));

  return `
    <div class="chips-row" style="margin-bottom:10px">
      ${['', ...PARTS].map((p) => `<button class="${ui.workPart === p ? 'on' : ''}" data-act="wpart" data-v="${p}">${p || '전체 파트'}</button>`).join('')}
    </div>
    ${summary}
    <div class="cal-toolbar">
      <div class="month-nav">
        <button class="icon-btn" data-act="wmonth" data-v="-1" aria-label="이전 달">‹</button>
        <h2>${first.getFullYear()}년 ${first.getMonth() + 1}월</h2>
        <button class="icon-btn" data-act="wmonth" data-v="1" aria-label="다음 달">›</button>
        <button class="btn sm" data-act="wmonth" data-v="0" style="margin-left:4px">오늘</button>
      </div>
      <div class="cal-actions">
        <div class="view-switch"><button class="${ui.workView === 'cal' ? 'on' : ''}" data-act="wview" data-v="cal">캘린더</button><button class="${ui.workView === 'timeline' ? 'on' : ''}" data-act="wview" data-v="timeline">타임라인</button></div>
        <label class="toggle"><input type="checkbox" data-act="wmine" ${ui.workMine ? 'checked' : ''}> 내 업무만</label>
        <button class="btn primary" data-act="newTask">+ 업무 등록</button>
      </div>
    </div>
    ${ui.workView === 'timeline' ? workTimeline(list, first) : `<div class="card cal">
      <div class="cal-head">${WEEK.map((w) => `<div>${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>`}
    <div class="legend">${TASK_CATS.map((c, i) => `<span><i class="dot k-${i}"></i>${c}</span>`).join('')}
      <span><span style="color:var(--warn)">⚠</span> 담당자 부재</span>
      <span>· 휴가 일정과는 별도로 관리됩니다</span></div>
    <div class="section-title">${first.getMonth() + 1}월 업무 <span class="muted small">${monthList.length}건</span></div>
    <div class="list">${monthList.length ? monthList.map(taskItem).join('') : '<div class="card empty">이 달에 등록된 업무가 없습니다.</div>'}</div>`;
}

function openWorkDay(ds) {
  const items = tasksOn(ds, workFiltered());
  const d = parse(ds);
  openModal(`<header><h3>${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEK[d.getDay()]}) 업무</h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content"><div class="list">${items.length ? items.map(taskItem).join('') : '<div class="empty">등록된 업무가 없습니다.</div>'}</div></div>
    <footer><span class="spacer"></span><button class="btn primary" data-act="newTask" data-v="${ds}">+ 이 날 업무 등록</button></footer>`);
}

/** 담당자 선택 (칩 + 추가 목록, 본인 포함 가능) */
function renderAssignees(box, list, part, onChange) {
  const groups = {};
  S.users.filter((u) => !list.includes(u.email)).forEach((u) => (groups[u.part || 'PM'] = groups[u.part || 'PM'] || []).push(u));
  const order = [part, ...PARTS, 'PM'].filter((g, k, a) => g && a.indexOf(g) === k && groups[g]);
  box.innerHTML = list.map((e, i) => `<span class="name-chip">${esc(nameOf(e))}<button type="button" data-adel="${i}" aria-label="${esc(nameOf(e))} 빼기">✕</button></span>`).join('')
    + (list.length < MAX_ASSIGNEES ? `<select data-aadd><option value="">+ 담당자 추가</option>${order.map((g) =>
      `<optgroup label="${esc(g)}">${groups[g].sort((a, b) => a.name.localeCompare(b.name)).map((u) => `<option value="${esc(u.email)}">${esc(u.name)}</option>`).join('')}</optgroup>`).join('')}</select>` : '');
  const again = () => { renderAssignees(box, list, part, onChange); if (onChange) onChange(); };
  box.querySelectorAll('[data-adel]').forEach((b) => (b.onclick = () => { list.splice(+b.dataset.adel, 1); again(); }));
  const sel = box.querySelector('[data-aadd]');
  if (sel) sel.onchange = () => { if (sel.value) list.push(sel.value); again(); };
}

function openTaskForm(id, date) {
  const ex = id ? W.tasks.find((t) => t.id === id) : null;
  const myPart = S.me.part || '';
  if (!ex && !isAdmin() && !myPart) return toast('파트가 지정되지 않은 계정입니다. PM에게 파트 지정을 요청하세요.', true);
  const d0 = date || todayStr();
  const mine = !ex || ex.createdBy === S.me.email; // '나만 보기'는 등록한 사람만 설정 가능
  const f = ex ? Object.assign({}, ex, { assignees: ex.assignees.slice() })
    : { id: '', part: isAdmin() ? ui.workPart || myPart : myPart, title: '', category: '개발', startDate: d0, endDate: d0, time: '', assignees: [S.me.email], status: '예정', visibility: 'all', memo: '' };
  const m = openModal(`
    <header><h3>${ex ? '업무 일정 수정' : '업무 일정 등록'}</h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content">
      <div class="field"><label>파트 <span class="req">*</span></label>${isAdmin() && !ex
        ? `<select name="part"><option value="">— 파트 선택 —</option>${PARTS.map((p) => `<option ${f.part === p ? 'selected' : ''}>${p}</option>`).join('')}</select>`
        : `<input value="${esc(f.part)}" disabled>`}</div>
      <div class="field"><label>제목 <span class="req">*</span></label><input name="title" maxlength="60" value="${esc(f.title)}" placeholder="예: 10월 정기배포, 앱 3.2 회귀 테스트"></div>
      <div class="field"><label>분류 <span class="req">*</span></label>
        <div class="seg">${TASK_CATS.map((c, i) => `<button type="button" data-cat="${esc(c)}" class="${f.category === c ? 'on' : ''}"><i class="dot k-${i}"></i>${c}</button>`).join('')}</div></div>
      <div class="row2">
        <div class="field"><label>시작일 <span class="req">*</span></label><input type="date" name="startDate" value="${f.startDate}"></div>
        <div class="field"><label>종료일</label><input type="date" name="endDate" value="${f.endDate}" min="${f.startDate}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>시간 <span class="muted" style="font-weight:400">선택</span></label><input name="time" maxlength="30" value="${esc(f.time)}" placeholder="예: 14:00~16:00"></div>
        <div class="field"><label>상태</label><select name="status">${TASK_STATUS.map((st) => `<option ${f.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>공개 범위</label><div class="seg">
        <button type="button" data-vis="all" class="${f.visibility !== 'part' && f.visibility !== 'private' ? 'on' : ''}">전체 공개</button>
        <button type="button" data-vis="part" class="${f.visibility === 'part' ? 'on' : ''}">파트 내부만</button>
        ${mine ? `<button type="button" data-vis="private" class="${f.visibility === 'private' ? 'on' : ''}">나만 보기</button>` : ''}</div>
        <div class="muted small" data-vishelp style="margin-top:4px"></div></div>
      <div class="field" data-afield><label>담당자 <span class="muted" style="font-weight:400">선택 · 최대 ${MAX_ASSIGNEES}명 · 다른 파트도 가능</span></label><div class="assignee-box" data-assignees></div><div data-absent></div></div>
      <div class="field"><label>메모</label><textarea name="memo" rows="3" maxlength="300" placeholder="링크, 참고사항">${esc(f.memo)}</textarea></div>
    </div>
    <footer>${ex ? '<button class="btn danger" data-del>삭제</button>' : ''}<span class="spacer"></span>
      <button class="btn" data-close>취소</button><button class="btn primary" data-save>${ex ? '저장' : '등록'}</button></footer>`);
  const q = (sel) => m.querySelector(sel);
  const box = q('[data-assignees]');
  // 담당자·기간이 바뀌면 부재 여부를 서버에 확인 (휴가 공개 규칙 안에서만)
  let seq = 0, timer = null;
  const checkAbsent = () => {
    clearTimeout(timer);
    const my = ++seq;
    timer = setTimeout(() => {
      if (!f.assignees.length) { q('[data-absent]').innerHTML = ''; return; }
      api('checkTaskAbsence', { startDate: q('[name=startDate]').value, endDate: q('[name=endDate]').value, assignees: f.assignees })
        .then((r) => { if (my === seq && $modal === m) q('[data-absent]').innerHTML = r.absences.length ? `<div class="absent-box">⚠ 담당자 부재: ${r.absences.map(esc).join(', ')}</div>` : ''; })
        .catch(() => {});
    }, 300);
  };
  const renderA = () => renderAssignees(box, f.assignees, f.part, checkAbsent);
  renderA();
  checkAbsent();
  m.querySelectorAll('[data-cat]').forEach((b) => (b.onclick = () => { f.category = b.dataset.cat; m.querySelectorAll('[data-cat]').forEach((x) => x.classList.toggle('on', x === b)); }));
  // 공개 범위: '나만 보기'면 담당자 칸을 숨긴다 (담당자는 본인으로 고정, 서버도 같은 규칙)
  const VIS_HELP = { all: '모든 직원이 볼 수 있습니다.', part: '우리 파트 직원과 PM만 볼 수 있습니다.', private: '나만 볼 수 있습니다. PM·PL도 볼 수 없고, 담당자는 본인으로 고정됩니다.' };
  const syncVis = () => {
    q('[data-afield]').style.display = f.visibility === 'private' ? 'none' : '';
    q('[data-vishelp]').textContent = VIS_HELP[f.visibility] || VIS_HELP.all;
  };
  m.querySelectorAll('[data-vis]').forEach((b) => (b.onclick = () => { f.visibility = b.dataset.vis; m.querySelectorAll('[data-vis]').forEach((x) => x.classList.toggle('on', x === b)); syncVis(); }));
  syncVis();
  if (q('select[name=part]')) q('select[name=part]').onchange = (e) => { f.part = e.target.value; renderA(); };
  const sd = q('[name=startDate]'), ed = q('[name=endDate]');
  sd.onchange = () => { if (!ed.value || ed.value < sd.value) ed.value = sd.value; ed.min = sd.value; checkAbsent(); };
  ed.onchange = checkAbsent;
  if (ex) q('[data-del]').onclick = () => removeTask(ex.id);
  q('[data-save]').onclick = () => runTasks(api('saveTask', {
    id: f.id, part: f.part, title: q('[name=title]').value, category: f.category,
    startDate: sd.value, endDate: ed.value || sd.value, time: q('[name=time]').value, status: q('[name=status]').value,
    assignees: f.visibility === 'private' ? [S.me.email] : f.assignees, visibility: f.visibility, memo: q('[name=memo]').value,
  }), ex ? '수정했습니다.' : '업무 일정을 등록했습니다.');
}

async function removeTask(id) {
  const t = W.tasks.find((x) => x.id === id);
  if (!t) return;
  const ok = await confirmBox('업무 일정 삭제', `<p>[${esc(t.part)}] ${esc(t.title)} · ${fmtRange(t)}<br>삭제할까요?</p>`, '삭제', true);
  if (ok) runTasks(api('deleteTask', id), '삭제했습니다.');
}

/* ---------- 중요 일정 (등록·수정은 PM, 보기는 전체) ---------- */
function evtItem(e) {

    <div class="when">★ ${esc(evtWhen(e))}</div>

      <button class="btn sm danger" data-act="delEvent" data-v="${e.id}">삭제</button></div>` : ''}</div>`;

function viewEvents() {

    ${past.length ? `<div class="section-title">지난 중요 일정</div><div class="evt-list" style="margin-top:0">${past.slice(0, 30).map(evtItem).join('')}</div>` : ''}`;

/* ---------- 내 일정 ---------- */
function viewMine() {
  const me = S.me.email, today = todayStr(), year = today.slice(0, 4);
  const mine = S.leaves.filter((l) => l.email === me).sort((a, b) => a.startDate.localeCompare(b.startDate));
  const upcoming = mine.filter((l) => l.endDate >= today);
  const past = mine.filter((l) => l.endDate < today).reverse();
  const covering = S.leaves.filter((l) => l.substitutes.includes(me) && l.endDate >= today).sort((a, b) => a.startDate.localeCompare(b.startDate));
  const used = mine.filter((l) => l.startDate.startsWith(year) && (l.type === '연차' || HALF[l.type])).reduce((s, l) => s + workdays(l), 0);

  return `
    <div class="section-title" style="margin-top:4px">
      <span>예정된 내 일정 <span class="muted small">· ${year}년 연차 사용 ${used}일</span></span>
      <button class="btn primary" data-act="newLeave">+ 일정 등록</button>

}

/* ---------- 전체 일정 (PM·PL·전체 조회) / 파트 일정 (파트원) ---------- */
function viewAll() {
  const f = ui.allFilter, today = todayStr(), year = today.slice(0, 4);
  const part = canSeeAll() ? ui.part : S.me.part;
  // 휴가 사용 현황(개수)은 PM 전체, PL은 자기 파트만. 전체 조회 옵션만 있는 사람은 볼 수 없음
  const usagePart = isAdmin() ? part : isPL() ? S.me.part : null;
  const usagePeople = usagePart === null ? [] : S.users.filter((u) => !usagePart || u.part === usagePart);
  const people = S.users.filter((u) => !part || u.part === part);
  let list = scoped().slice();
  if (f.member) list = list.filter((l) => l.email === f.member);
  if (f.month) list = list.filter((l) => l.startDate.slice(0, 7) <= f.month && f.month <= l.endDate.slice(0, 7));
  else list = list.filter((l) => l.endDate >= today);
  if (f.warnOnly) list = list.filter((l) => conflictsOf(l).length);
  list.sort((a, b) => a.startDate.localeCompare(b.startDate) || nameOf(a.email).localeCompare(nameOf(b.email)));

  const rows = usagePeople.slice().sort((a, b) => a.name.localeCompare(b.name)).map((u) => {
    const ls = S.leaves.filter((l) => l.email === u.email && l.startDate.startsWith(year));
    const sum = (pred) => ls.filter(pred).reduce((s, l) => s + workdays(l), 0);
    return `<tr><td>${esc(u.name)}${isAdmin() && u.part ? ` <span class="muted small">${esc(u.part)}</span>` : ''}</td>
      <td class="num">${sum((l) => l.type === '연차')}</td>
      <td class="num">${sum((l) => HALF[l.type])}</td>
      <td class="num"><b>${sum((l) => l.type === '연차' || HALF[l.type])}</b></td>
      <td class="num">${sum((l) => l.type === '병가')}</td>
      <td class="num">${sum((l) => l.type === '연수/교육')}</td>
      <td class="num">${sum((l) => l.type === '기타')}</td></tr>`;
  }).join('');

  return `
    <div class="filters">
      ${canSeeAll() ? partSelect() : ''}
      <select data-act="filter" data-k="member"><option value="">${part ? esc(part) + ' 전체' : '전체 팀원'}</option>
        ${people.map((u) => `<option value="${esc(u.email)}" ${f.member === u.email ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>
      <input type="month" data-act="filter" data-k="month" value="${f.month}">
      ${f.month ? '<button class="btn sm ghost" data-act="clearMonth">예정 일정 보기</button>' : '<span class="muted small">예정된 일정 표시 중</span>'}
      <label class="toggle"><input type="checkbox" data-act="filter" data-k="warnOnly" ${f.warnOnly ? 'checked' : ''}> 겹침 경고만</label>
      <span style="flex:1"></span>
      ${isAdmin() ? '<button class="btn primary" data-act="newLeave">+ 대리 등록</button>' : ''}
    </div>
    ${isAdmin() ? '' : `<div class="infobox" style="margin:0 0 12px">${canSeeAll() ? '전체 직원' : esc(part) + ' 파트원'}의 일정을 볼 수 있습니다. 수정·삭제는 본인 또는 PM만 할 수 있습니다.</div>`}
    <div class="list">${list.length ? list.map((l) => leaveItem(l, { showName: true })).join('') : '<div class="card empty">해당하는 일정이 없습니다.</div>'}</div>
    ${usagePart === null ? '' : `<div class="section-title">${year}년 ${usagePart ? esc(usagePart) + ' 파트' : '팀원별'} 사용 현황 <span class="muted small">(주말·공휴일 제외 일수)</span></div>
    <div class="card table-wrap"><table>
      <thead><tr><th>이름</th><th class="num">연차</th><th class="num">반차</th><th class="num">연차 합계</th><th class="num">병가</th><th class="num">연수/교육</th><th class="num">기타</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`}`;
}

/* ---------- 새 소식 (전 직원) ---------- */
function bellButton() {
  const n = (S.news && S.news.unread) || 0;
  return `<button class="icon-btn ghost-btn bell" data-act="news" title="새 소식" aria-label="새 소식${n ? ' ' + n + '개' : ''}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    ${n ? `<span class="nbadge">${n > 9 ? '9+' : n}</span>` : ''}</button>`;
}

/** '방금' · 'N분 전' · 'N시간 전' · '10/3 14:02' */
function agoText(iso) {
  const d = new Date(iso);
  const mins = Math.floor((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return '방금';
  if (mins < 60) return `${mins}분 전`;
  if (mins < 1440) return `${Math.floor(mins / 60)}시간 전`;
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function openNews() {
  const n = S.news || { items: [], unread: 0, seenAt: '' };
  const seen = n.seenAt || '';
  openModal(`<header><h3>새 소식</h3><button class="btn ghost sm" data-close>닫기</button></header>
    <div class="content">
      ${n.items.length ? n.items.map((x) => `<div class="news-item ${x.at > seen ? 'unread' : ''}" ${x.go ? `data-act="newsGo" data-v="${esc(x.go)}"` : ''}>
        <div class="nt">${esc(x.text)}</div><div class="when">${esc(agoText(x.at))}</div></div>`).join('') : '<div class="empty">새 소식이 없습니다.</div>'}
      <p class="muted small" style="margin:12px 0 0">나를 대직자로 지정하거나, 나에게 업무가 배정되거나, 중요 일정이 바뀌면 여기에 알려드려요. 내가 한 일은 오지 않아요.</p>
    </div>`);
  if (n.unread) {
    n.unread = 0;
    render(); // 숫자 표시 없애기 (열린 창은 그대로)
    api('markNewsRead').then((r) => { if (S && S.news) S.news.seenAt = r.seenAt || S.news.seenAt; }).catch(() => {});
  }
}

/** 소식을 누르면 해당 날짜(캘린더) 또는 탭으로 */
function goNews(go) {
  closeModal();
  const i = go.indexOf(':');
  const kind = go.slice(0, i), val = go.slice(i + 1);
  if (kind === 'day') {
    const d = parse(val);
    ui.tab = 'cal'; ui.month = new Date(d.getFullYear(), d.getMonth(), 1);
    render(); window.scrollTo(0, 0); openDay(val);
  } else if (kind === 'tab') {
    ui.tab = val; render(); window.scrollTo(0, 0);
  }
}

/* ---------- 변경 이력 (PM) ---------- */
const KIND_LABELS = { leave: '휴가', task: '업무', event: '중요 일정', user: '팀원', holiday: '공휴일', login: '로그인' };
const HX = { loaded: false, loading: false, error: '', items: [], kind: '', who: '', noLogin: true, limit: 200 };

function loadHistory() {
  HX.loading = true; HX.error = '';
  api('getHistory')
    .then((r) => { HX.items = r.items || []; HX.loaded = true; })
    .catch((e) => { HX.error = (e && e.message) || '변경 이력을 불러오지 못했습니다.'; })
    .finally(() => { HX.loading = false; if (ui.tab === 'history') render(); });
}

function viewHistory() {
  if (!HX.loaded && !HX.loading && !HX.error) loadHistory();
  const head = `<div class="section-title" style="margin-top:0"><span>변경 이력 <span class="muted small">최근 90일</span></span>
    <button class="btn sm" data-act="reloadHistory">새로 불러오기</button></div>`;
  if (!HX.loaded) return head + `<div class="card empty">${HX.error ? esc(HX.error) : '불러오는 중…'}</div>`;
  const people = S.users.slice().sort((a, b) => a.name.localeCompare(b.name));
  let list = HX.items;
  if (HX.kind) list = list.filter((h) => h.kind === HX.kind);
  else if (HX.noLogin) list = list.filter((h) => h.kind !== 'login');
  if (HX.who) list = list.filter((h) => h.actor === HX.who || h.owner === HX.who);
  const when = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const row = (h) => `<div class="hrow"><div class="hwhen">${when(h.at)}</div><div class="hbody">
      <div><b>${esc(nameOf(h.actor))}</b> <span class="badge">${esc(KIND_LABELS[h.kind] || h.kind)} ${esc(h.action)}</span>${h.owner && h.owner !== h.actor ? ` <span class="muted small">대상: ${esc(nameOf(h.owner))}</span>` : ''}</div>
      ${h.summary ? `<div class="muted small hsum">${esc(h.summary)}</div>` : ''}</div></div>`;
  return head + `<div class="filters">

/** 마지막 백업 시각 (DB → 스프레드시트, 1시간마다). 3시간 넘게 없으면 경고 */
const BK = { loaded: false, loading: false, at: '' };
function backupBox() {
  if (MODE !== 'api' || !USE_PROXY) return ''; // DB를 쓰는 주소에서만
  if (!BK.loaded && !BK.loading) {
    BK.loading = true;
    api('getBackupInfo').then((r) => { BK.at = r.lastBackupAt || ''; }).catch(() => {}).finally(() => { BK.loaded = true; BK.loading = false; if (ui.tab === 'members') render(); });
  }
  if (!BK.loaded) return '<div class="infobox" style="margin:8px 0 0">스프레드시트 백업 상태 확인 중…</div>';
  if (!BK.at) return '<div class="warnbox" style="margin:8px 0 0">스프레드시트 백업 기록이 없습니다. Apps Script에서 setupBackup을 한 번 실행해 주세요.</div>';
  const d = new Date(BK.at);
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  const ago = mins < 60 ? `${mins}분 전` : mins < 1440 ? `${Math.floor(mins / 60)}시간 전` : `${Math.floor(mins / 1440)}일 전`;
  const text = `마지막 스프레드시트 백업: ${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())} (${ago}) · 1시간마다 자동`;
  return mins > 180 ? `<div class="warnbox" style="margin:8px 0 0">⚠ ${text} — 백업이 3시간 넘게 되지 않았습니다.</div>` : `<div class="infobox" style="margin:8px 0 0">${text}</div>`;
}

let $modal = null, onDismiss = null;
function openModal(html, dismiss) {
  closeModal();
  $modal = document.createElement('div');
  $modal.className = 'overlay';
  $modal.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  $modal.addEventListener('mousedown', (e) => { if (e.target === $modal) dismissModal(); });
  document.body.appendChild($modal);
  onDismiss = dismiss || null;
  $modal.querySelectorAll('[data-close]').forEach((b) => (b.onclick = dismissModal));
  return $modal;
}
function closeModal() { if ($modal) { $modal.remove(); $modal = null; } onDismiss = null; }
/** 바깥 클릭 / ESC / 닫기 — 확인창이면 '취소'로 처리 */
function dismissModal() { const cb = onDismiss; closeModal(); if (cb) cb(); }

function confirmBox(title, body, okLabel = '확인', danger = false) {
  return new Promise((resolve) => {
    const m = openModal(`<header><h3>${esc(title)}</h3></header><div class="content">${body}</div>
      <footer><button class="btn" data-r="0">취소</button><button class="btn ${danger ? 'danger' : 'primary'}" data-r="1">${esc(okLabel)}</button></footer>`, () => resolve(false));
    m.querySelectorAll('[data-r]').forEach((b) => b.addEventListener('click', () => { closeModal(); resolve(b.dataset.r === '1'); }));
  });
}

/** 클립보드 복사 — 막혀 있으면 execCommand, 그것도 안 되면 선택만 해두고 안내 */
async function copyText(text, ta) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
  if (!ok) {
    const t = ta || Object.assign(document.createElement('textarea'), { value: text });
    if (!ta) { t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); }
    t.focus(); t.select();
    try { ok = document.execCommand('copy'); } catch (e) {}
    if (!ta) t.remove();
  }
  toast(ok ? '복사했습니다. 메신저에 붙여넣으세요.' : '자동 복사가 안 됩니다. 글을 길게 눌러 직접 복사하세요.', !ok);
}

/* ---------- 대직자 선택칸 (휴가 등록 · 기본 대직자 설정에서 공용) ---------- */
/** subs 배열(1~3칸, 빈칸은 '')을 box에 그린다. 다른 칸에서 고른 사람과 owner 본인은 목록에서 뺀다 */
function renderSubPicker(box, owner, subs, onChange, firstOptional) {
  const own = partOf(owner);
  box.innerHTML = subs.map((cur, i) => {
    const taken = subs.filter((e, j) => j !== i && e);
    const groups = {};
    S.users.filter((u) => u.email !== owner && taken.indexOf(u.email) < 0)
      .forEach((u) => (groups[u.part || 'PM'] = groups[u.part || 'PM'] || []).push(u));
    const order = [own, ...PARTS, 'PM'].filter((g, k, a) => g && a.indexOf(g) === k && groups[g]);
    return `<div class="sub-row"><select data-sub="${i}"><option value="">— 대직자 ${i + 1}${i || firstOptional ? ' (선택)' : ''} —</option>${order.map((g) =>
      `<optgroup label="${esc(g === own ? g + ' (같은 파트)' : g)}">${groups[g].sort((a, b) => a.name.localeCompare(b.name))
        .map((u) => `<option value="${esc(u.email)}" ${u.email === cur ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</optgroup>`).join('')}</select>
      ${i ? `<button type="button" class="icon-btn" data-subdel="${i}" aria-label="대직자 ${i + 1} 빼기">✕</button>` : ''}</div>`;
  }).join('') + (subs.length < MAX_SUBS ? '<button type="button" class="btn sm" data-subadd>+ 대직자 추가</button>' : '');
  const again = () => { renderSubPicker(box, owner, subs, onChange, firstOptional); if (onChange) onChange(); };
  box.querySelectorAll('[data-sub]').forEach((el) => (el.onchange = () => { subs[+el.dataset.sub] = el.value; again(); }));
  box.querySelectorAll('[data-subdel]').forEach((el) => (el.onclick = () => { subs.splice(+el.dataset.subdel, 1); again(); }));
  const add = box.querySelector('[data-subadd]');
  if (add) add.onclick = () => { subs.push(''); renderSubPicker(box, owner, subs, onChange, firstOptional); box.querySelector(`[data-sub="${subs.length - 1}"]`).focus(); };
}

      ${ex ? '<button class="btn danger" data-del>삭제</button>' : ''}<span class="spacer"></span>
      <button class="btn" data-close>취소</button><button class="btn primary" data-save>${ex ? '저장' : '등록'}</button>
    </footer>`);

  const q = (s) => m.querySelector(s);
  const payload = () => ({ id: f.id, email: f.email, type: f.type, startDate: f.startDate, endDate: f.endDate, substitutes: chosen(), memo: f.memo });

  // 대직자 겹침은 서버가 판단 (팀원은 다른 사람 일정을 받지 않으므로)
  let seq = 0, timer = null;
  const check = () => {
    clearTimeout(timer);
    const my = ++seq;
    q('[data-check]').innerHTML = chosen().length ? '<div class="infobox">대직자 일정 확인 중…</div>' : '';
    timer = setTimeout(() => {
      api('checkLeave', payload()).then((r) => {
        if (my !== seq || !$modal || $modal !== m) return;
        q('[data-check]').innerHTML =
          (r.duplicate ? `<div class="warnbox">${esc(r.duplicate)}</div>` : '') +
          (r.warnings.length ? `<div class="warnbox"><b>⚠ 대직자와 일정이 겹칩니다</b>${r.warnings.map((w) => `<div>· ${esc(w)}</div>`).join('')}</div>` : '') +
          (!r.duplicate && !r.warnings.length && chosen().length ? `<div class="infobox">✓ 대직자${chosen().length > 1 ? ' 모두' : ''} 일정과 겹치지 않습니다.</div>` : '');
      }).catch(handleError);
    }, 250);
  };

  const update = () => {
    const half = !!HALF[f.type];
    q('[data-endwrap]').style.display = half ? 'none' : '';
    q('[data-startlabel]').innerHTML = (half ? '날짜' : '시작일') + ' <span class="req">*</span>';
    if (half || f.endDate < f.startDate) { f.endDate = f.startDate; q('[name=endDate]').value = f.endDate; }
    q('[name=endDate]').min = f.startDate;
    f.subs = f.subs.map((e) => (e === f.email ? '' : e));
    renderSubPicker(q('[data-subs]'), f.email, f.subs, update);
    // 지금 고른 대직자가 기본 대직자와 다르면 '기본으로 저장' 체크박스를 보여준다
    const def = defaultSubsOf(f.email);
    const showDef = chosen().length > 0 && !sameSubs(chosen(), def) && (f.email === S.me.email || isAdmin());
    q('[data-defwrap]').style.display = showDef ? '' : 'none';
    q('[data-deflabel]').textContent = f.email === S.me.email ? '이 대직자를 내 기본 대직자로 저장' : `${nameOf(f.email)}님의 기본 대직자로 저장`;
    if (f.saveDefault == null) f.saveDefault = !def.length; // 기본 대직자가 아직 없으면 체크된 채로
    q('[data-savedefault]').checked = f.saveDefault;
    f.showDef = showDef;
    const evs = f.startDate ? (S.events || []).filter((e) => e.startDate <= f.endDate && f.startDate <= e.endDate) : [];
    q('[data-days]').innerHTML = (f.startDate ? `<div class="infobox">사용일수 <b>${workdays(f)}일</b> <span class="small">(주말·공휴일 제외)</span></div>` : '')
      + (evs.length ? `<div class="infobox" style="color:var(--evt)"><b>★ 이 기간에 중요 일정이 있습니다</b>${evs.map((e) => `<div>· ${esc(evtWhen(e))} ${esc(e.title)}</div>`).join('')}</div>` : '');
    if (f.startDate) check();
  };

  q('[data-savedefault]').onchange = (e) => (f.saveDefault = e.target.checked);

  m.querySelectorAll('[data-type]').forEach((b) => (b.onclick = () => {
    f.type = b.dataset.type;
    m.querySelectorAll('[data-type]').forEach((x) => x.classList.toggle('on', x === b));
    update();
  }));
  if (q('[name=email]')) q('[name=email]').onchange = (e) => { f.email = e.target.value; f.subs = lastSubs(f.email); update(); };
  q('[name=startDate]').onchange = (e) => { f.startDate = e.target.value; update(); };
  q('[name=endDate]').onchange = (e) => { f.endDate = e.target.value; update(); };
  q('[name=memo]').oninput = (e) => (f.memo = e.target.value);
  if (q('[data-del]')) q('[data-del]').onclick = () => removeLeave(f.id);

  q('[data-save]').onclick = async () => {
    if (!f.startDate) return toast('날짜를 선택하세요.', true);
    if (!chosen().length) { q('[data-sub="0"]').focus(); return toast('대직자를 1명 이상 지정해야 합니다.', true); }
    const p = payload();
    loading(true);
    let r;
    try { r = await api('checkLeave', p); } catch (e) { loading(false); return handleError(e); }
    loading(false);
    if (r.duplicate) return toast(r.duplicate, true);
    if (r.warnings.length) {
      const ok = await confirmBox('대직자와 일정이 겹칩니다', `<div class="warnbox" style="margin-top:0">${r.warnings.map((w) => `<div>⚠ ${esc(w)}</div>`).join('')}</div>
        <p class="muted small">그래도 저장하면 캘린더에 경고 표시가 남습니다. 대직자를 바꾸는 것을 권장합니다.</p>`, '그래도 저장');
      if (!ok) return openLeaveForm(id, null, f); // 입력하던 내용 그대로 폼으로 돌아감
    }
    const asDefault = f.showDef && f.saveDefault;
    run(api('saveLeave', { ...p, saveDefault: asDefault }), (ex ? '수정했습니다.' : '등록했습니다.') + (asDefault ? ' 기본 대직자도 저장했습니다.' : ''));
  };
  update();
}

/* ---------- 일괄 등록 (엑셀·시트에서 붙여넣기) ---------- */
function parseBulk(text) {
  const seen = {};
  S.users.forEach((u) => (seen[u.email] = 'registered'));
  return text.split(/\r?\n/).map((line) => line.split(/\t|,/).map((c) => c.trim()))
    .filter((c) => c.some(Boolean))
    .filter((c) => !/이메일|email/i.test(c[0])) // 제목 줄은 건너뜀
    .map(([email = '', name = '', part = '', role = '']) => {
      email = email.toLowerCase();
      const r = { email, name, part, role: roleOfText(role) };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) r.error = '이메일 형식 오류';
      else if (!name) r.error = '이름 없음';
      else if (r.role !== 'pm' && !PARTS.includes(part)) r.error = `파트 확인 (${PARTS.join('/')})`;
      else if (seen[email] === 'registered') r.error = '이미 등록됨';
      else if (seen[email]) r.error = '목록에 중복';
      seen[email] = seen[email] || 'batch';
      return r;
    });
}
